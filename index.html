<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --surface: #f1f0ed;
    --muted: #66655f;
    --rule: #d9d8d3;
    --display: "Fira Sans Extra Condensed", "Arial Narrow", sans-serif;
    --body: "Fira Sans", system-ui, sans-serif;
    --stripe: repeating-linear-gradient(90deg, var(--ink) 0 14px, var(--paper) 14px 28px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #fff;
      --paper: #000;
      --surface: #161615;
      --muted: #a3a29c;
      --rule: #2c2c2a;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Η ταυτότητα της σελίδας: οι ρίγες της φανέλας. */
  .masthead { background: var(--stripe); padding: 56px 16px 0; }
  .masthead.compact { padding-top: 28px; }
  .masthead-inner { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .mast-bell {
    display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 10px; flex: none;
    background: var(--paper); color: var(--ink); border: 2px solid var(--ink); text-decoration: none;
  }
  .mast-bell svg { width: 22px; height: 22px; }
  .mast-bell { position: relative; }
  .mast-bell.warn::after {
    content: "!"; position: absolute; top: -9px; right: -9px; width: 20px; height: 20px; display: grid; place-items: center;
    background: var(--paper); color: var(--ink); border: 2px solid var(--ink); font: 800 14px/1 var(--body);
  }
  .mast-actions { display: flex; gap: 8px; flex: none; }
  button.mast-bell { padding: 0; cursor: pointer; }
  .mast-bell.on { background: var(--ink); color: var(--paper); border-color: var(--paper); }
  .masthead h1 {
    display: inline-block; margin: 0; padding: 10px 16px 6px;
    background: var(--paper);
    font: 800 clamp(34px, calc((100vw - 150px) / 6.3), 76px)/0.9 var(--display);
    letter-spacing: -0.01em;
  }
  .masthead.compact h1 { font-size: clamp(30px, calc((100vw - 150px) / 6.6), 56px); }
  .masthead h1 { min-width: 0; padding-left: 12px; padding-right: 12px; }
  .masthead h1 a { text-decoration: none; }
  .masthead h1 .light { font-weight: 600; color: var(--muted); }
  .masthead { padding-top: calc(56px + env(safe-area-inset-top)); }
  .masthead.compact { padding-top: calc(28px + env(safe-area-inset-top)); }
  main { padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

  /* Εγκατάσταση ως εφαρμογή */
  .moved {
    background: var(--ink); color: var(--paper); padding: 14px 16px; margin: 18px 0 0;
  }
  .moved strong { display: block; font: 800 20px/1.15 var(--display); }
  .moved p { margin: 4px 0 0; font-size: 15px; }
  .moved a { font-weight: 600; text-underline-offset: 3px; }
  .explain { border: 1.5px solid var(--ink); padding: 14px 16px; margin: 6px 0 18px; }
  .explain h4 { margin: 0 0 6px; font: 800 20px/1.15 var(--display); }
  .explain p { margin: 0 0 8px; }
  .explain p:last-child { margin-bottom: 0; }
  .step-title { font: 800 20px/1.15 var(--display); margin: 22px 0 8px; }
  .platform { margin: 0 0 22px; }
  .platform h3 { font: 800 24px/1.1 var(--display); margin: 26px 0 8px; }
  .platform.mine h3::after { content: "  (αυτή η συσκευή)"; font: 500 15px var(--body); color: var(--muted); }
  ul.perks { margin: 0 0 8px; padding-left: 20px; max-width: 58ch; }
  ul.perks li { margin-bottom: 4px; }
  footer a { text-underline-offset: 2px; }
  .install {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
    border: 1.5px solid var(--ink); padding: 12px; margin: 0 0 24px;
  }
  .install img { width: 52px; height: 52px; border-radius: 12px; display: block; }
  .install strong { display: block; font: 800 20px/1.1 var(--display); }
  .install p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .install .btn { padding: 8px 12px; }
  .install-close {
    border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer;
    align-self: start;
  }
  .share-glyph { display: inline-block; vertical-align: -3px; }

  main { max-width: 680px; margin: 0 auto; padding: 0 16px 48px; }
  .lede { margin: 18px 0 28px; color: var(--muted); max-width: 52ch; }
  h2.section-title { font: 800 34px/1 var(--display); margin: 44px 0 14px; }

  /* Σήματα ομάδων */
  .crest {
    width: 22px; height: 22px; object-fit: contain; vertical-align: -4px; margin-right: 6px;
    display: inline-block; flex: none;
  }
  .initials {
    display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px;
    border: 1.5px solid var(--ink); border-radius: 50%;
    font: 600 10px/1 var(--body); vertical-align: -4px; flex: none;
  }
  @media (prefers-color-scheme: dark) {
    img.crest { background: #fff; border-radius: 3px; padding: 1px; }
  }

  /* Επόμενος αγώνας */
  .next { background: var(--ink); color: var(--paper); padding: 20px 20px 22px; margin-bottom: 8px; }
  .next-label { font-size: 15px; opacity: .75; margin: 0 0 8px; }
  .next-teams { display: block; font: 800 clamp(30px, 8.5vw, 48px)/1.08 var(--display); margin: 0 0 12px; overflow-wrap: anywhere; }
  .next-teams .crest, .next-teams .initials { width: 34px; height: 34px; vertical-align: -6px; }
  .next-teams .initials { border-color: var(--paper); font-size: 13px; }
  .next-when { font: 600 22px/1.2 var(--display); margin: 0; }
  .next-meta { margin: 6px 0 0; opacity: .8; font-size: 15px; }

  /* Μενού: τα τμήματα ανά άθλημα και οι υπόλοιπες σελίδες */
  body.menu-open { overflow: hidden; }
  .menu { position: fixed; inset: 0; z-index: 10; }
  .menu-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
  .menu-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(380px, 90vw); overflow-y: auto;
    background: var(--paper); color: var(--ink); border-left: 2px solid var(--ink);
    padding: calc(14px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
  }
  @media (prefers-reduced-motion: no-preference) {
    .menu:not([hidden]) .menu-panel { animation: menu-in .18s ease-out; }
    @keyframes menu-in { from { transform: translateX(40px); opacity: 0; } }
  }
  .menu-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .menu-top strong { font: 800 28px/1 var(--display); }
  .menu-close { border: 1.5px solid var(--ink); background: transparent; width: 42px; height: 42px; font-size: 20px; cursor: pointer; }
  .menu h3 { font: 600 13px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 6px; }
  .menu-sports { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .menu-sport { padding: 10px 0 12px; border-bottom: 1px solid var(--rule); }
  .menu-sport-name { display: flex; align-items: center; gap: 8px; font: 600 20px/1.15 var(--display); margin-bottom: 8px; }
  .menu-sport-name span { flex: none; width: 24px; font-size: 19px; }
  .menu-gender { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .menu-gender a {
    display: block; text-align: center; padding: 8px 6px; border: 1.5px solid var(--ink);
    text-decoration: none; font-weight: 500; font-size: 15px;
  }
  .menu-gender a[aria-current="page"], .menu-gender a:active { background: var(--ink); color: var(--paper); }
  .menu-links { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .menu-links a { display: block; padding: 12px 0; border-bottom: 1px solid var(--rule); text-decoration: none; font: 600 19px/1.2 var(--display); }
  .menu-links a[aria-current="page"] { box-shadow: inset 4px 0 0 var(--ink); padding-left: 14px; }
  .menu-links small { display: block; font: 400 14px/1.3 var(--body); color: var(--muted); margin-top: 2px; }

  /* Ανδρών / Γυναικών στη σελίδα τμήματος */
  .gender-switch { display: inline-flex; border: 1.5px solid var(--ink); margin: 0 0 16px; }
  .gender-switch a { padding: 7px 14px; text-decoration: none; font-weight: 500; }
  .gender-switch a + a { border-left: 1.5px solid var(--ink); }
  .gender-switch a[aria-current="page"] { background: var(--ink); color: var(--paper); }

  /* Συντομεύσεις στο τέλος της αρχικής */
  .shortcuts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .shortcut { display: block; border: 1.5px solid var(--ink); padding: 12px 14px; text-decoration: none; }
  .shortcut:active { background: var(--ink); color: var(--paper); }
  .shortcut strong { display: block; font: 800 21px/1.1 var(--display); }
  .shortcut span { display: block; font-size: 14px; color: var(--muted); margin-top: 3px; }
  .shortcut:active span { color: inherit; }

  /* Φίλτρα και επιλογές */
  .controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 8px; }
  .controls > * { min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .when-bar { margin-bottom: 10px; }
  .nowrap { white-space: nowrap; }
  .filterbar { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .btn.filter-toggle { display: inline-flex; align-items: center; gap: 8px; }
  .filter-toggle svg { width: 18px; height: 18px; flex: none; }
  .filter-toggle[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
  .filter-count { background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1; padding: 3px 6px; }
  .filter-toggle[aria-expanded="true"] .filter-count { background: var(--paper); color: var(--ink); }
  .filter-summary { flex: 1 1 160px; min-width: 0; font-size: 15px; color: var(--muted); }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .controls.panel { border: 1.5px solid var(--ink); padding: 12px; margin-bottom: 10px; }
  .chips-hint { margin: -2px 0 0; font-size: 14px; color: var(--muted); }
  .chip {
    flex: none; border: 1.5px solid var(--ink); background: var(--paper);
    padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg { display: flex; border: 1.5px solid var(--ink); width: 100%; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; cursor: pointer; font-weight: 500; }
  .seg button + button { border-left: 1.5px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .legend { margin: 4px 0 0; font-size: 14px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  .legend span::before {
    content: ""; display: inline-block; width: 6px; height: 16px; margin-right: 7px; vertical-align: -3px;
    border: 1.5px solid var(--ink);
  }
  .legend .l-home::before { border: 0; background: repeating-linear-gradient(180deg, var(--ink) 0 4px, transparent 4px 8px); }

  /* Καρτέλες σελίδας τμήματος */
  .back { display: inline-block; margin: 18px 0 6px; font-weight: 500; text-underline-offset: 3px; }
  .section-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
  .section-head h2 { margin: 0; font: 800 clamp(36px, 10vw, 52px)/1 var(--display); }
  .section-head span { font-size: 34px; }
  .tabs {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    border: 1.5px solid var(--ink); margin: 26px 0 14px;
  }
  .tabs a {
    padding: 10px 6px; text-align: center; text-decoration: none; font-weight: 600;
    border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
  }
  .tabs a:nth-child(2n) { border-right: 0; }
  .tabs a:nth-child(n+3) { border-bottom: 0; }
  .tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }
  @media (min-width: 560px) {
    .tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tabs a, .tabs a:nth-child(2n) { border-right: 1.5px solid var(--ink); border-bottom: 0; }
    .tabs a:last-child { border-right: 0; }
  }

  /* Λίστα αγώνων */
  .day {
    position: sticky; top: 0; z-index: 1; background: var(--paper);
    margin: 0; padding: 22px 0 6px; border-bottom: 2px solid var(--ink);
    font: 800 22px/1.1 var(--display);
  }
  .day small { font: 500 15px var(--body); color: var(--muted); margin-left: 8px; }
  ol.games { list-style: none; margin: 0; padding: 0; }
  .game {
    display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: start;
    padding: 12px 0 12px 14px; border-bottom: 1px solid var(--rule); position: relative;
  }
  /* Εντός έδρας: ρίγες στην άκρη. Εκτός: απλό περίγραμμα. */
  .game::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 6px;
    border: 1.5px solid var(--ink);
  }
  .game.home::before { border: 0; background: repeating-linear-gradient(180deg, var(--ink) 0 4px, transparent 4px 8px); }
  .time { font: 800 22px/1.2 var(--display); }
  .time.tbc { color: var(--muted); font-size: 18px; }
  .teams { display: block; font: 600 20px/1.25 var(--display); overflow-wrap: anywhere; }
  .teams .team { display: block; }
  .teams b { font-weight: 800; }
  .meta { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .meta a { text-underline-offset: 2px; }
  .score { font: 800 22px/1.25 var(--display); text-align: right; white-space: nowrap; }
  .score span.n { display: block; }
  .res {
    display: inline-block; min-width: 24px; margin-top: 4px; padding: 0 5px;
    font: 600 15px/24px var(--body); text-align: center; border: 1.5px solid var(--ink);
  }
  .res.w { background: var(--ink); color: var(--paper); }
  .empty { padding: 28px 0; color: var(--muted); }
  .more {
    margin: 20px 0 0; width: 100%; border: 1.5px solid var(--ink); background: transparent;
    padding: 12px; font-weight: 600; cursor: pointer;
  }

  /* Μήνας */
  .month { margin-top: 18px; }
  .month-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .month-head h3 { margin: 0; text-align: center; font: 800 26px/1.1 var(--display); }
  .month-head button { width: 44px; height: 44px; border: 1.5px solid var(--ink); background: transparent; font: 800 22px/1 var(--display); cursor: pointer; }
  .month-head button:disabled { opacity: .25; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .wd { text-align: center; font-size: 13px; color: var(--muted); padding: 8px 0 4px; }
  .cell {
    min-height: 62px; padding: 4px 3px 5px; border: 0; border-bottom: 1px solid var(--rule);
    background: transparent; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .cell.out { visibility: hidden; cursor: default; }
  .cell .n { font: 600 16px/22px var(--display); width: 24px; text-align: center; }
  .cell.today .n { background: var(--ink); color: var(--paper); }
  .cell.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
  .cell.none { cursor: default; }
  .cell.none .n { color: var(--muted); }
  .mks { display: flex; flex-wrap: wrap; gap: 2px; font-size: 15px; line-height: 1; }
  .mk { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .mk::after { content: ""; width: 14px; height: 4px; border: 1px solid var(--ink); }
  .mk.home::after { border: 0; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px); }
  .plus { font: 600 13px/1 var(--body); color: var(--muted); align-self: center; }

  /* Βαθμολογία */
  .standing { margin: 8px 0 30px; }
  .standing h3 { font: 800 24px/1.1 var(--display); margin: 18px 0 8px; }
  .table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table.st { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.st th { font-weight: 500; color: var(--muted); text-align: right; padding: 6px 6px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
  table.st th:nth-child(2) { text-align: left; }
  table.st td { padding: 8px 6px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.st td.pos { width: 28px; color: var(--muted); }
  table.st td.team { text-align: left; white-space: normal; font-weight: 500; min-width: 140px; }
  table.st td.pts { font-weight: 600; }
  /* Σκορ ανά περίοδο / σετ: στήλες ίδιου πλάτους, στο κέντρο */
  table.st.qt th, table.st.qt td { text-align: center; width: 2.6em; padding-left: 2px; padding-right: 2px; }
  table.st.qt th:first-child, table.st.qt td.team { text-align: left; width: auto; }
  table.st.qt th:last-child, table.st.qt td.pts { width: 3.2em; text-align: right; padding-right: 6px; }
  table.st tr.paok td { background: var(--ink); color: var(--paper); font-weight: 600; }
  table.st tr.paok .initials { border-color: var(--paper); }
  .source { font-size: 14px; color: var(--muted); }

  /* Ακολούθησε: ημερολόγια και ειδοποιήσεις */
  .follow h3 { font: 800 26px/1.1 var(--display); margin: 26px 0 8px; }

  .btn {

  }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn:active { background: var(--ink); color: var(--paper); }
  .tv a { color: inherit; }
  .cups h4 { font: 800 19px/1.2 var(--display); margin: 18px 0 6px; }
  table.st.cup td { vertical-align: top; padding-top: 9px; padding-bottom: 9px; }
  table.st.cup td { padding-left: 4px; padding-right: 4px; }
  table.st.cup td.round { font-size: 13px; color: var(--muted); width: 20%; white-space: normal; text-align: left; }
  table.st.cup td.team { min-width: 0; font-size: 14px; }
  table.st.cup td.legs { font-size: 13px; white-space: nowrap; }
  table.st.cup td.legs a { color: inherit; }
  table.st.cup td.agg { text-align: right; font-weight: 700; white-space: nowrap; }
  table.st.cup td.agg small { font-weight: 500; font-size: 13px; }
  table.st.cup tr.win td.agg small { color: var(--ink); text-decoration: underline; }
  table.st.cup tr.out td { color: var(--muted); }
  .foot-links a { color: inherit; }
  .foot-social { display: flex; gap: 10px; flex-wrap: wrap; }
  a.social { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid currentColor; padding: 7px 12px;
    color: var(--ink); text-decoration: none; font-weight: 500; }
  a.social svg { width: 20px; height: 20px; flex: none; }
  a.social:active { background: var(--ink); color: var(--paper); }
  .privacy h3 { font: 800 22px/1.15 var(--display); margin: 22px 0 6px; }
  ul.plain { margin: 0 0 12px; padding-left: 20px; max-width: 58ch; }
  ul.plain li { margin: 4px 0; }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); max-width: 440px; width: 100%; padding: 20px 20px 16px; max-height: 90vh; overflow: auto; }
  .modal h2 { font: 800 30px/1.05 var(--display); margin: 0 0 12px; }
  .modal p { margin: 0 0 10px; }
  .tz-note { font-size: 15px; color: var(--muted); border-left: 4px solid var(--ink); padding: 4px 0 4px 10px; margin: 0 0 14px; }
  .admin-box { border: 2px solid var(--ink); padding: 4px 14px 14px; margin: 18px 0; }
  .admin-box h3 { font: 800 22px/1.1 var(--display); margin: 12px 0 6px; }
  .adm-score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .adm-field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
  .adm-field.wide { margin: 0 0 10px; }
  .adm-field input { font: inherit; font-size: 18px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink);
    border-radius: 0; padding: 8px 10px; width: 100%; box-sizing: border-box; }
  .adm-score input { font-size: 28px; font-weight: 700; text-align: center; }
  .adm-score .adm-field { justify-content: flex-end; }
  .adm-score input[type="text"] { font-size: 18px; font-weight: 400; text-align: left; padding: 12px 10px; }
  .adm-steps { display: flex; gap: 6px; margin-top: 6px; }
  .adm-steps .btn { flex: 1 1 0; padding: 10px 0; font-size: 17px; font-weight: 700; min-width: 0; }
  .adm-steps .btn.minus { color: var(--muted); font-weight: 400; }
  .adm-label { font-size: 14px; color: var(--muted); margin: 12px 0 6px; }
  .adm-events, .adm-sides { display: flex; flex-wrap: wrap; gap: 8px; }
  .adm-events .btn { padding: 8px 12px; }
  .adm-sides .btn { flex: 1 1 40%; padding: 12px 10px; font-weight: 700; }
  .adm-change { font-size: 17px; margin: 0 0 12px; }
  button.linkish { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }
  ul.notify { list-style: none; margin: 14px 0 0; padding: 0; border-top: 2px solid var(--ink); }
  ul.notify li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  ul.notify strong { font: 600 19px/1.2 var(--display); display: block; }
  ul.notify small { color: var(--muted); font-size: 14px; display: block; }
  ol.steps { margin: 0 0 12px; padding-left: 22px; max-width: 58ch; }

  /* Διακόπτες ειδοποιήσεων (τετράγωνοι, όπως όλη η σελίδα) */
  .switch {
    flex: none; position: relative; width: 54px; height: 32px; padding: 0; cursor: pointer;
    border: 1.5px solid var(--ink); background: var(--paper);
  }
  .switch::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 21px; height: 21px; background: var(--ink);
  }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { background: var(--paper); transform: translateX(22px); }
  @media (prefers-reduced-motion: no-preference) { .switch::after { transition: transform .15s; } }
  .switch:disabled, .chip:disabled { opacity: .35; cursor: not-allowed; }
  .push-note { margin: 4px 0 12px; }
  .server-ok { margin: 0 0 8px; font-size: 15px; }
  .server-err { border-width: 2px; }
  .push-on { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 4px 0 12px; }
  .push-on::before { content: ""; width: 10px; height: 10px; background: var(--ink); flex: none; }
  .nsec { padding: 12px 0; border-bottom: 1px solid var(--rule); }

  .nsec .chip, .nsport .chip { padding: 7px 12px; }
  .chip-all { font-weight: 700; }
  /* Τα είδη ειδοποιήσεων σε μία γραμμή, σαν ενιαίο κουμπί με τμήματα */

  .nsec-top { border-top: 2px solid var(--ink); }
  .nsport { padding: 14px 0 6px; border-bottom: 2px solid var(--ink); }

  .nsport-name small { font: 400 14px var(--body); color: var(--muted); }
  .nsec-sub { padding: 10px 0 10px 14px; border-bottom: 0; border-top: 1px solid var(--rule); }

  .nmatch { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .nmatch a { font: 600 19px/1.2 var(--display); text-decoration: none; }
  .nmatch small { display: block; color: var(--muted); font-size: 14px; }
  .kinds-legend { margin: 10px 0 0; padding: 0; list-style: none; font-size: 15px; color: var(--muted); }
  .kinds-legend b { color: var(--ink); font-weight: 600; }
  ol.steps li { margin-bottom: 6px; }

  .cal-list { list-style: none; margin: 14px 0 0; padding: 0; border-top: 2px solid var(--ink); }
  .cal { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .cal-name { font: 600 19px/1.2 var(--display); text-decoration: none; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 10px 16px; font-weight: 500; max-width: calc(100% - 32px); z-index: 5;
  }
  /* Live */
  .live-badge {
    display: inline-block; background: var(--ink); color: var(--paper);
    font: 800 13px/1 var(--body); letter-spacing: .04em; padding: 4px 6px 3px;
  }
  .live-badge::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; margin-right: 5px; vertical-align: 1px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .live-badge::before { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
  }
  .clock { display: block; font: 600 15px/1.3 var(--body); margin-top: 4px; }
  .ongoing { display: block; font: 500 13px/1.2 var(--body); color: var(--muted); margin-top: 3px; }
  .status-off { color: var(--ink); font-weight: 700; }
  .final-tag { display: block; font: 500 13px/1.2 var(--body); color: var(--muted); }
  .next .live-badge { background: var(--paper); color: var(--ink); }
  .next-teams .row { display: flex; justify-content: space-between; gap: 12px; }
  .next-teams .sc { flex: none; }

  /* Ειδοποίηση για έναν αγώνα */
  .bell {
    display: inline-grid; place-items: center; width: 38px; height: 38px; margin-top: 6px;
    border: 1.5px solid var(--ink); background: transparent; cursor: pointer; padding: 0;
    color: inherit; text-decoration: none;
  }
  .bell svg { width: 18px; height: 18px; }
  .bell.on { background: var(--ink); color: var(--paper); }
  .next .bell { border-color: var(--paper); color: var(--paper); width: auto; height: auto; padding: 8px 12px; gap: 8px; grid-auto-flow: column; font-weight: 600; margin-top: 14px; }
  .next .bell.on { background: var(--paper); color: var(--ink); }
  /* Όλη η γραμμή του αγώνα ανοίγει τη σελίδα του (το link «απλώνεται» σε όλη τη γραμμή). */
  a.game-link { color: inherit; text-decoration: none; display: block; }
  a.game-link::after { content: ""; position: absolute; inset: 0; z-index: 0; }
  .game .meta a, .game .bell, .next .bell, .next-meta a { position: relative; z-index: 1; }
  .game { cursor: pointer; }
  @media (hover: hover) { .game:hover { background: var(--surface); } }
  .next { position: relative; }
  .next a.game-link::after { z-index: 0; }

  /* Σελίδα αγώνα */
  .match-head { background: var(--ink); color: var(--paper); padding: 18px 18px 20px; margin: 6px 0 18px; }
  .mh-comp { margin: 0 0 12px; font-size: 15px; opacity: .8; }
  .mh-status { margin: 0 0 14px; font: 600 20px/1.2 var(--display); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .match-head .live-badge { background: var(--paper); color: var(--ink); }
  .mh-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 6px 0; }
  .mh-row .crest, .mh-row .initials { width: 40px; height: 40px; margin: 0; }
  .mh-row .initials { border-color: var(--paper); font-size: 14px; }
  .mh-name { font: 800 clamp(24px, 7vw, 34px)/1.05 var(--display); overflow-wrap: anywhere; }
  .mh-score { font: 800 clamp(34px, 10vw, 48px)/1 var(--display); font-variant-numeric: tabular-nums; }
  .mh-row.lose .mh-score, .mh-row.lose .mh-name { opacity: .55; }
  .mh-row.vb { grid-template-columns: 44px 1fr auto auto; }
  .mh-pts { font: 700 clamp(20px, 6vw, 28px)/1 var(--display); min-width: 1.9em; padding: 5px 6px; text-align: center;
            border: 1.5px solid var(--paper); font-variant-numeric: tabular-nums; }
  .mh-when { margin: 14px 0 0; font-size: 15px; opacity: .8; }
  .match-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .match h3 { font: 800 26px/1.1 var(--display); margin: 30px 0 10px; }
  ol.timeline { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  ol.timeline li { display: grid; grid-template-columns: 44px 26px 1fr; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  ol.timeline .min { font: 800 18px/1 var(--display); }
  ol.timeline .who small { display: block; color: var(--muted); font-size: 13px; }
  ol.timeline li.away .who { text-align: right; }
  .stat { padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .stat-top { display: grid; grid-template-columns: 1fr auto 1fr; font-variant-numeric: tabular-nums; }
  .stat-top span:first-child { font-weight: 600; }
  .stat-top span:nth-child(2) { color: var(--muted); font-size: 14px; text-align: center; padding: 0 8px; }
  .stat-top span:last-child { text-align: right; font-weight: 600; }
  .bar { display: grid; height: 6px; margin-top: 6px; background: var(--rule); }
  .bar i { display: block; height: 6px; background: var(--ink); }
  .stats-head { display: grid; grid-template-columns: 1fr 1fr; font-weight: 600; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .stats-head span:last-child { text-align: right; }
  h4.box-team { margin: 18px 0 4px; font-size: 16px; }
  /* Χωρίς το περιθώριο του .table-wrap: η στήλη του ονόματος κολλά στην άκρη και δεν φαίνεται τίποτα αριστερά της. */
  .table-wrap.box-wrap { margin: 0; padding: 0; }
  table.st.box td.name, table.st.box th:first-child { box-shadow: 1px 0 0 var(--rule); }
  table.st.box th, table.st.box td { padding-left: 5px; padding-right: 5px; }
  table.st.box th:nth-child(2) { text-align: right; }
  table.st.box th:first-child, table.st.box td.name { text-align: left; position: sticky; left: 0; background: var(--paper); }
  table.st.box td.name { min-width: 120px; max-width: 170px; white-space: normal; line-height: 1.25; }
  table.st.box td.name small { color: var(--muted); margin-right: 4px; font-variant-numeric: tabular-nums; }
  table.st.box tr.starter td.name { font-weight: 600; }
  table.st.box td.hi { font-weight: 700; }
  table.st.box tr.tot td { font-weight: 600; border-top: 2px solid var(--ink); }
  .box-legend { margin-top: 6px; }
  dl.info { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; border-top: 2px solid var(--ink); padding-top: 10px; }
  dl.info dt { color: var(--muted); }
  dl.info dd { margin: 0; }
  .loading { color: var(--muted); }

  footer { margin-top: 48px; font-size: 14px; color: var(--muted); }
  footer p { margin: 0 0 8px; }

  @media (min-width: 560px) {
    .shortcuts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .game { grid-template-columns: 70px 1fr auto; }
    .cell { min-height: 78px; padding: 6px; }
    .mks { font-size: 18px; }
  }
</style>
</head>
<body>
<header class="masthead" id="masthead">
  <div class="masthead-inner"><h1><a href="#/" aria-label="PAOKalendar, αρχική">PAOK<span class="light">alendar</span></a></h1>
    <div class="mast-actions">
      <a class="mast-bell" id="mast-bell" href="#/notifications" aria-label="Ειδοποιήσεις"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM9.5 19a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></a>
      <button type="button" class="mast-bell" id="menu-btn" aria-label="Μενού" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
    </div></div>
</header>

<div class="menu" id="menu" hidden>
  <div class="menu-backdrop" data-close></div>
  <div class="menu-panel" role="dialog" aria-modal="true" aria-label="Μενού" id="menu-panel"></div>
</div>

<main id="app"><p class="empty">Φόρτωση προγράμματος…</p></main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  // Ώρα: όσοι είναι σε άλλη ζώνη ώρας βλέπουν τις ώρες στη δική τους (με την ώρα Ελλάδας στη σελίδα
  // του αγώνα). Μπορούν να γυρίσουν στην ώρα Ελλάδας (αποθηκεύεται στη συσκευή).
  var ATHENS = "Europe/Athens";
  var deviceTz = (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ATHENS; } catch (e) { return ATHENS; } })();
  function offsetOf(tz, d) {
    var p = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric" }).formatToParts(d);
    var v = {}; p.forEach(function (x) { v[x.type] = +x.value; });
    return (Date.UTC(v.year, v.month - 1, v.day, v.hour, v.minute) - Math.floor(d.getTime() / 60000) * 60000) / 60000;
  }
  var abroad = false;
  try { abroad = offsetOf(deviceTz, new Date()) !== offsetOf(ATHENS, new Date()); } catch (e) {}
  var forceAthens = false;
  try { forceAthens = localStorage.getItem("paok-tz") === "athens"; } catch (e) {}
  var TZ = abroad && !forceAthens ? deviceTz : ATHENS;
  var fmtAthensTime = new Intl.DateTimeFormat("el-GR", { timeZone: ATHENS, hour: "2-digit", minute: "2-digit", hour12: false });
  function tzPlace(tz) {
    try {
      var n = new Intl.DateTimeFormat("el-GR", { timeZone: tz, timeZoneName: "long" }).formatToParts(new Date())
        .filter(function (x) { return x.type === "timeZoneName"; })[0];
      return n ? n.value : tz;
    } catch (e) { return tz; }
  }
  function tzNoteHtml() {
    if (!abroad) return "";
    return '<p class="tz-note">' + (TZ === ATHENS
      ? "Οι ώρες είναι σε ώρα Ελλάδας. <button type=\"button\" class=\"linkish\" data-act=\"tz-local\">Δείξε τες στην ώρα μου</button>"
      : "Οι ώρες είναι στην ώρα σου (" + esc(tzPlace(TZ)) + "). <button type=\"button\" class=\"linkish\" data-act=\"tz-athens\">Ώρα Ελλάδας</button>") + "</p>";
  }
  var PAGE = 40;
  var KIND_INFO = {
    pre: ["Πριν τον αγώνα", "Περίπου μία ώρα πριν ξεκινήσει"],
    time: ["Αλλαγές προγράμματος", "Νέος αγώνας, ορισμός ή αλλαγή ώρας"],
    live: ["Live", "Έναρξη, γκολ ή περίοδοι, ημίχρονο και τελικό"],
    result: ["Τελικό αποτέλεσμα", "Το σκορ μόλις ανακοινωθεί"]
  };
  // Στα τμήματα χωρίς live, η υπενθύμιση έρχεται και στην ώρα έναρξης (notify.py).
  var PRE_NO_LIVE = "Μία ώρα πριν και στην ώρα έναρξης";
  // Στα τμήματα χωρίς αυτόματο live, τα γεγονότα τα στέλνει ο διαχειριστής (api/admin.js).
  var LIVE_ADMIN = "Σκορ και γεγονότα του αγώνα (γκολ, πόντοι, περίοδοι), όταν τα στέλνει το PAOKalendar";
  var isAndroid = /android/i.test(navigator.userAgent);
  var data = null, standings = {};

  // Επιλογές που θυμάται η σελίδα (ανά συσκευή).
  var prefs = { view: "list", sports: [], gender: "all", when: "upcoming", venue: "all" };
  try {
    var saved = JSON.parse(localStorage.getItem("paok-filters") || "{}");
    ["view", "gender", "when", "venue"].forEach(function (k) { if (typeof saved[k] === "string") prefs[k] = saved[k]; });
    if (Array.isArray(saved.sports)) {
      prefs.sports = saved.sports.filter(function (x) { return typeof x === "string"; });
    } else if (typeof saved.sport === "string" && saved.sport !== "all") {
      prefs.sports = [saved.sport];  // παλιά αποθήκευση με ένα άθλημα
    }
  } catch (e) {}
  function savePrefs() { try { localStorage.setItem("paok-filters", JSON.stringify(prefs)); } catch (e) {} }

  // Κατάσταση που δεν αποθηκεύεται.
  var ui = { shown: PAGE, month: null, day: null, secView: "list", secVenue: "all" };

  var fmtDay = new Intl.DateTimeFormat("el-GR", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
  var fmtShort = new Intl.DateTimeFormat("el-GR", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
  var fmtTime = new Intl.DateTimeFormat("el-GR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  var fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  var fmtMonth = new Intl.DateTimeFormat("el-GR", { month: "long", year: "numeric", timeZone: "UTC" });
  var WEEKDAYS = ["Δευ", "Τρι", "Τετ", "Πεμ", "Παρ", "Σαβ", "Κυρ"];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function $(id) { return document.getElementById(id); }

  function dayDiff(date) {
    var a = new Date(fmtKey.format(new Date()) + "T00:00:00");
    var b = new Date(fmtKey.format(date) + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function relative(date) {
    var d = dayDiff(date);
    if (d === 0) return "Σήμερα";
    if (d === 1) return "Αύριο";
    if (d > 1 && d < 7) return "Σε " + d + " μέρες";

  }

  // ---- Κύπελλα: η πορεία του ΠΑΟΚ, από τους αγώνες του (όλα τα αθλήματα, χωρίς άλλη πηγή).

  // μία γραμμή με τον απολογισμό (η βαθμολογία της, όπου υπάρχει, είναι πιο πάνω).
  var CUP_RE = /Κύπελλ|Cup|Europa|Conference|Champions|EHF|CEV|Euro/i;

        if (i >= 0) prefs.sports.splice(i, 1); else prefs.sports.push(sp);
        // Όλα επιλεγμένα είναι το ίδιο με «Όλα τα αθλήματα».
        var total = {};
        data.sections.forEach(function (s) { total[s.sport] = 1; });
        if (prefs.sports.length >= Object.keys(total).length) prefs.sports = [];
      }
      savePrefs();
      ui.shown = PAGE; ui.day = null;
      render();
      return;
    }
    var group = b.closest("[data-seg]");
    if (group && b.dataset.v) {
      var k = group.dataset.seg;
      if (k === "secView" || k === "secVenue") { ui[k] = b.dataset.v; }
      else { prefs[k] = b.dataset.v; savePrefs(); }
      ui.shown = PAGE; ui.day = null;
      render();
      return;
    }
    if (b.dataset.copy) { copy(b.dataset.copy, b.dataset.msg); return; }
    if (b.dataset.day && !b.disabled) { ui.day = b.dataset.day; render(); return; }
    var act = b.dataset.act;
    if (act === "filters") { ui.filtersOpen = !ui.filtersOpen; render(); return; }
    if (act === "filters-clear") {
      prefs.sports = []; prefs.gender = "all"; prefs.venue = "all"; savePrefs();
      ui.shown = PAGE; ui.day = null; render(); return;
    }
    if (act === "install" && installEvent) {
      installEvent.prompt();
      installEvent.userChoice.then(function () { installEvent = null; render(); });
      return;
    }
    if (act === "install-close") {
      installDismissed = true;
      try { localStorage.setItem("paok-install-snooze-until", String(Date.now() + INSTALL_SNOOZE)); } catch (e) {}
      render();
      toast("Οι οδηγίες υπάρχουν πάντα στο κάτω μέρος της σελίδας.");
      return;
    }
    if (act === "more") { ui.shown += PAGE; render(); }
    if (act === "prev-month") { ui.month = addMonths(ui.month, -1); ui.day = null; render(); }
    if (act === "next-month") { ui.month = addMonths(ui.month, 1); ui.day = null; render(); }
  });

  // Λειτουργία διαχειριστή: 5 γρήγορα πατήματα στον τίτλο «Ειδοποιήσεις». Χρειάζεται γιατί η εφαρμογή
  // στην αρχική οθόνη του iPhone δεν έχει γραμμή διευθύνσεων (για το #/admin) και κρατά δικά της δεδομένα.
  var adminTaps = [];
  $("app").addEventListener("click", function (e) {
    if (route().page !== "notifications" || !e.target.closest(".section-head h2")) return;
    var now = Date.now();
    adminTaps = adminTaps.filter(function (t) { return now - t < 2500; }).concat(now);
    if (adminTaps.length < 5) return;
    adminTaps = [];
    var on = !isAdmin();
    try { if (on) localStorage.setItem("paok-admin", "1"); else localStorage.removeItem("paok-admin"); } catch (err) {}
    toast(on ? "Λειτουργία διαχειριστή: δες την ενότητα «Διαχειριστής» πιο κάτω." : "Λειτουργία διαχειριστή: κλειστή.");
    render();
  });

  // ---- Ειδοποιήσεις μέσα στην εφαρμογή (web push)
  // Η συσκευή γράφεται σε θέματα «s:<τμήμα>:<είδος>» ή «m:<αγώνας>:<είδος>». Τα θέματα κρατιούνται
  // και τοπικά, ώστε η σελίδα να δείχνει αμέσως τι είναι ενεργό, και στέλνονται στο /api/subscribe.
  var PUSH_KINDS = [["pre", "Πριν"], ["time", "Αλλαγές"], ["live", "Live"], ["result", "Τελικό"]];
  var pushOrigin = /(^|\.)paokalendar\.gr$|(^|\.)vercel\.app$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);

  var push = { reg: null, sub: null, key: null, busy: false, ready: false, topics: [], server: "", serverAt: 0, lost: false };

  function pushStatus() {

  }

    return !!push.sub && push.topics.some(function (t) { return t.indexOf(prefix) === 0; });
  }

  function pushNoteHtml() {
    var st = pushStatus();

    if (st === "ios-install") return '<div class="explain"><h4>Πρώτα βάλε την εφαρμογή στην αρχική οθόνη</h4>' +
      "<p>Στο iPhone οι ειδοποιήσεις δουλεύουν μόνο όταν το PAOKalendar ανοίγει από το εικονίδιό του στην αρχική οθόνη (iOS 16.4 ή νεότερο).</p>" +
      "<p>Στο Safari πάτα " + SHARE_ICON + " και «Προσθήκη στην οθόνη Αφετηρίας». Άνοιξε την εφαρμογή από το εικονίδιο και έλα ξανά εδώ.</p>" +
      '<div class="actions"><a class="btn solid" href="#/app">Οδηγίες με βήματα</a></div></div>';
    if (st === "denied") return '<div class="explain"><h4>Οι ειδοποιήσεις είναι μπλοκαρισμένες</h4><p>' +
      (isIOS ? "Επίτρεψέ τες στις Ρυθμίσεις του iPhone → Γνωστοποιήσεις → PAOKalendar."
        : isAndroid ? "Επίτρεψέ τες στο Chrome: πάτα το εικονίδιο αριστερά από τη διεύθυνση → Άδειες → Ειδοποιήσεις. Αν έχεις την εφαρμογή, από τις Ρυθμίσεις του κινητού → Εφαρμογές → PAOKalendar → Ειδοποιήσεις."
        : "Επίτρεψέ τες από το εικονίδιο αριστερά από τη διεύθυνση της σελίδας.") + "</p></div>";
    return '<div class="explain"><p>Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις. ' +
      (isIOS ? "Χρειάζεται iOS 16.4 ή νεότερο." : "Δοκίμασε Chrome, Edge, Firefox ή Safari.") +
      "</p></div>";
  }

  function switchRow(topics, title, desc) {
    var st = pushStatus(), usable = st === "on" || st === "off";
    var on = topics.every(hasTopic);
    return "<li><span><strong>" + esc(title) + "</strong>" + (desc ? "<small>" + esc(desc) + "</small>" : "") + "</span>" +
      '<button type="button" class="switch" role="switch" aria-checked="' + on + '" aria-label="' + esc(title) +
      '" data-topics="' + esc(topics.join(" ")) + '"' + (usable ? "" : " disabled") + "></button></li>";
  }

  function savePushTopics() {
    try { localStorage.setItem("paok-push-topics", JSON.stringify(push.topics)); } catch (e) {}
    // Και για το service worker, αν χρειαστεί να ανανεώσει μόνο του τη συνδρομή.
    if ("caches" in window) {
      caches.open("paokalendar-data").then(function (c) {
        return c.put("push-topics", new Response(JSON.stringify(push.topics), { headers: { "Content-Type": "application/json" } }));
      }).catch(function () {});
    }
  }
  function setDirty(v) { try { if (v) localStorage.setItem("paok-push-dirty", "1"); else localStorage.removeItem("paok-push-dirty"); } catch (e) {} }
  // Η κατάσταση στον server: «ok» (ό,τι βλέπεις εδώ είναι αποθηκευμένο), «saving», «error».
  // Τη δείχνει η σελίδα Ειδοποιήσεις, ώστε να φαίνεται αμέσως αν οι επιλογές δεν έφτασαν.
  function setServer(state) {
    push.server = state;
    if (state === "ok") push.serverAt = Date.now();
    if (data && (route().page === "notifications" || state === "error" || $("mast-bell").classList.contains("warn"))) render();
  }
  var TOPIC_OK = /^(s:[a-z-]{2,30}|m:[0-9a-f]{10}):(pre|time|live|result)$/;
  function sameTopics(a, b) {
    var x = a.filter(function (t) { return TOPIC_OK.test(t); }).slice().sort().join(" ");
    return x === b.slice().sort().join(" ");
  }
  function syncPush() {
    savePushTopics();
    if (!push.sub) return Promise.resolve();
    setDirty(true);
    setServer("saving");
    return fetch("/api/subscribe", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subscription: push.sub.toJSON(), topics: push.topics })
    }).then(function (r) {
      if (!r.ok) throw new Error("subscribe " + r.status);
      return r.json();
    }).then(function (d) {
      if (d && d.saved && !sameTopics(push.topics, d.saved)) throw new Error("subscribe: άλλα θέματα αποθηκεύτηκαν");
      setDirty(false);
      try { localStorage.setItem("paok-push-synced", String(Date.now())); } catch (e) {}
      setServer("ok");
    }, function (e) { setServer("error"); throw e; });
  }
  // Έλεγχος ότι ο server έχει ακριβώς ό,τι δείχνει η συσκευή· αλλιώς ξαναστέλνει τις επιλογές.
  var lastVerify = 0;
  function verifyPush() {
    if (!push.sub || Date.now() - lastVerify < 60 * 1000) return Promise.resolve();
    lastVerify = Date.now();
    return fetch("/api/subscribe", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subscription: push.sub.toJSON(), action: "check" })
    }).then(function (r) {
      if (!r.ok) throw new Error("check " + r.status);
      return r.json();
    }).then(function (d) {
      if (d.gone) return markLost();  // η υπηρεσία push απάντησε ότι η συνδρομή δεν ισχύει πια
      if (d.found && sameTopics(push.topics, d.topics || [])) { setDirty(false); setServer("ok"); return; }
      return syncPush();
    }).catch(function () { if (push.server !== "ok") setServer("error"); });
  }
  // Η συσκευή ακύρωσε τη συνδρομή (συμβαίνει στο iPhone, π.χ. μετά από επαναφορά ή αν η εφαρμογή δεν
  // ανοιχτεί για καιρό). Οι επιλογές μένουν αποθηκευμένες· ζητάμε από τον χρήστη να τις ξαναενεργοποιήσει
  // με ένα πάτημα (το iPhone δέχεται νέα συνδρομή μόνο μετά από πάτημα).
  function markLost() {
    var old = push.sub;
    push.sub = null;
    push.lost = true;
    setServer("");
    if (old) old.unsubscribe().catch(function () {});
    if (data) render();
  }
  function restorePush() {
    ensureSub().then(function () {
      push.lost = false;
      return syncPush();
    }).then(function () {
      toast("Οι ειδοποιήσεις ενεργοποιήθηκαν ξανά, με τις ίδιες επιλογές.");
      render();
    }).catch(function () {
      toast(window.Notification && Notification.permission === "denied"
        ? "Οι ειδοποιήσεις είναι μπλοκαρισμένες στις ρυθμίσεις του κινητού." : "Δεν έγινε. Δοκίμασε ξανά σε λίγο.");
    });
  }
  function lostHtml() {
    if (!push.lost) return "";
    return '<div class="explain server-err"><h4>Οι ειδοποιήσεις σταμάτησαν σε αυτή τη συσκευή</h4>' +
      "<p>Το κινητό ακύρωσε τη συνδρομή (συμβαίνει καμιά φορά στο iPhone). Οι επιλογές σου είναι κρατημένες· πάτα για να ξαναρχίσουν.</p>" +
      '<div class="actions"><button type="button" class="btn solid" data-act="push-restore">Ενεργοποίηση ξανά</button></div></div>';
  }
  function testPush() {
    if (!push.sub) return;
    fetch("/api/subscribe", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subscription: push.sub.toJSON(), action: "test" })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.ok) toast("Στάλθηκε. Αν δεν έρθει σε λίγα δευτερόλεπτα, δες τις ρυθμίσεις ειδοποιήσεων του κινητού.");
        else if (r.status === 404) { toast("Η συσκευή δεν ήταν γραμμένη· γράφεται τώρα, δοκίμασε ξανά σε λίγο."); syncPush().catch(function () {}); }
        else toast(d.error || "Η δοκιμαστική δεν στάλθηκε. Δοκίμασε ξανά σε λίγο.");
      });
    }).catch(function () { toast("Δεν υπάρχει σύνδεση με τον server."); });
  }
  function serverStatusHtml() {
    if (pushStatus() !== "on") return "";
    var time = push.serverAt ? new Intl.DateTimeFormat("el-GR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(push.serverAt)) : "";
    var line = push.server === "ok"
      ? '<p class="server-ok">✓ Οι επιλογές σου είναι αποθηκευμένες στον server' + (time ? " (έλεγχος " + time + ")" : "") + ".</p>"
      : push.server === "error"
        ? '<div class="explain server-err"><h4>Οι επιλογές σου δεν αποθηκεύτηκαν στον server</h4>' +
          "<p>Μέχρι να αποθηκευτούν, δεν θα έρχονται οι ειδοποιήσεις που διάλεξες. Η εφαρμογή ξαναδοκιμάζει μόνη της κάθε φορά που ανοίγει.</p>" +
          '<div class="actions"><button type="button" class="btn solid" data-act="push-retry">Δοκίμασε ξανά τώρα</button></div></div>'
        : '<p class="help">Έλεγχος με τον server…</p>';
    return line;
  }
  function b64key(str) {
    var bin = atob(str.replace(/-/g, "+").replace(/_/g, "/")), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function fetchKey() {
    return fetch("/api/vapid").then(function (r) {
      if (!r.ok) throw new Error("vapid " + r.status);
      return r.json();
    }).then(function (d) { push.key = d.publicKey; return push.key; });
  }
  function ensureSub() {
    if (push.sub) return Promise.resolve(push.sub);

    var start = push.key && push.reg ? Promise.resolve(push.key) : fetchKey();
    return start.then(function (key) {
      var reg = push.reg ? Promise.resolve(push.reg) : navigator.serviceWorker.ready;
      return Promise.resolve(reg).then(function (r) {
        push.reg = r;
        return r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64key(key) });
      });
    }).then(function (sub) { push.sub = sub; return sub; });
  }

  function toggleTopics(list, on) {
    if (push.busy) return;
    var st = pushStatus();
    if (st !== "on" && st !== "off") return;
    var first = !push.sub;
    push.busy = true;
    (on ? ensureSub() : Promise.resolve()).then(function () {
      if (push.sub) push.lost = false;
      list.forEach(function (t) {
        var i = push.topics.indexOf(t);
        if (on && i < 0) push.topics.push(t);
        if (!on && i >= 0) push.topics.splice(i, 1);
      });
      push.busy = false;
      render();
      return syncPush().then(function () {
        if (on && first) toast("Οι ειδοποιήσεις ενεργοποιήθηκαν σε αυτή τη συσκευή.");
      }, function () {
        toast("Αποθηκεύτηκε στη συσκευή· θα σταλεί μόλις υπάρξει σύνδεση.");
      });
    }).catch(function () {
      push.busy = false;
      render();
      toast(window.Notification && Notification.permission === "denied"
        ? "Δεν δόθηκε άδεια για ειδοποιήσεις."
        : "Δεν έγινε η ενεργοποίηση. Δοκίμασε ξανά σε λίγο.");
    });
  }

  function disablePush() {
    var sub = push.sub;
    if (!sub) return;
    fetch("/api/subscribe", {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subscription: sub.toJSON() })
    }).catch(function () {});
    sub.unsubscribe().catch(function () {});
    push.sub = null; push.topics = [];
    savePushTopics(); setDirty(false);
    render();
    toast("Οι ειδοποιήσεις απενεργοποιήθηκαν σε αυτή τη συσκευή.");
  }

  // Αγώνες που τελείωσαν πάνω από μία μέρα πριν δεν χρειάζονται πια ειδοποιήσεις.
  function cleanMatchTopics() {
    var keep = {};
    data.matches.forEach(function (m) {
      if (!m.score || Date.now() - new Date(m.start).getTime() < 36 * 3600 * 1000) keep[m.nt] = 1;
    });
    var before = push.topics.length;
    push.topics = push.topics.filter(function (t) { return t.indexOf("m:") !== 0 || keep[t.split(":")[1]]; });
    return push.topics.length !== before;
  }

  function initPush() {
    if (!pushOrigin || !pushSupported) return;
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (e.data && e.data.type === "open" && e.data.url) location.href = e.data.url;
    });
    navigator.serviceWorker.ready.then(function (reg) {
      push.reg = reg;
      return reg.pushManager.getSubscription();
    }).then(function (sub) {
      push.sub = sub;
      push.ready = true;
      if (!sub && push.topics.length && Notification.permission === "granted") push.lost = true;
      if (data) render();
      return fetchKey().then(function (key) {
        if (!sub) return;
        // Αν άλλαξε το κλειδί του server, η παλιά συνδρομή δεν δουλεύει: νέα, με τα ίδια θέματα.
        var cur = sub.options && sub.options.applicationServerKey;
        var same = !cur || String(new Uint8Array(cur)) === String(b64key(key));
        if (same) return false;
        return sub.unsubscribe().then(function () { push.sub = null; return ensureSub(); }).then(function () { return true; });
      });
    }).then(function (renewed) {
      if (!push.sub) return;
      var dirty = false, last = 0;
      try { dirty = !!localStorage.getItem("paok-push-dirty"); last = +localStorage.getItem("paok-push-synced") || 0; } catch (e) {}
      var cleaned = data ? cleanMatchTopics() : false;
      if (renewed || dirty || cleaned || Date.now() - last > 12 * 3600 * 1000) return syncPush();
      return verifyPush();
    }).catch(function () {});
  }

  // ---- Σελίδα «Ειδοποιήσεις»
  function notificationsHtml() {
    var st = pushStatus(), usable = st === "on" || st === "off";
    // Ένα κουμπί για πολλά θέματα μαζί: πατημένο όταν είναι όλα ενεργά, και τα ανοίγει ή κλείνει όλα.
    function topicsOf(list, kind) {
      var out = [];
      list.forEach(function (s) {
        sectionKinds(s).forEach(function (k) { if (!kind || k[0] === kind) out.push("s:" + s.key + ":" + k[0]); });
      });
      return out;
    }
    function chip(topics, label, all, aria) {
      return '<button type="button" class="chip' + (all ? " chip-all" : "") + '" data-topics="' + esc(topics.join(" ")) +
        '" aria-pressed="' + topics.every(hasTopic) + '"' + (aria ? ' aria-label="' + esc(aria) + '"' : "") +
        (usable && topics.length ? "" : " disabled") + ">" + esc(label) + "</button>";
    }
    function kindChips(list, name) {
      return '<div class="nchips" role="group" aria-label="' + esc(name) + '">' + chip(topicsOf(list), "Όλα", true, name + ": όλα") +
        PUSH_KINDS.filter(function (k) { return topicsOf(list, k[0]).length; }).map(function (k) {
          return chip(topicsOf(list, k[0]), k[1], false, name + ": " + k[1]);
        }).join("") + "</div>";
    }
    var overall = '<div class="nsec nsec-top"><span class="nsec-name">Όλα τα τμήματα</span>' + kindChips(data.sections, "Όλα τα τμήματα") + "</div>";
    var sections = sportGroups().map(function (g) {
      var list = [g.men, g.women].filter(Boolean);
      var rows = list.length > 1 ? list.map(function (s) {
        return '<div class="nsec nsec-sub"><a class="nsec-name" href="#/' + s.key + '/follow">' + (s.women ? "Γυναικών" : "Ανδρών") + "</a>" +
          kindChips([s], s.name) + "</div>";
      }).join("") : "";
      return '<div class="nsport"><a class="nsec-name nsport-name" href="#/' + list[0].key + '/follow">' + g.emoji + " " + esc(g.sport) +
        (list.length > 1 ? ' <small>ανδρών και γυναικών</small>' : "") + "</a>" + kindChips(list, g.sport) + rows + "</div>";
    }).join("");
    var followed = data.matches.filter(matchFollowed);
    var matches = followed.length
      ? followed.map(function (m) {
          var s = sectionOf(m), d = new Date(m.start);
          var topics = push.topics.filter(function (t) { return t.indexOf("m:" + m.nt + ":") === 0; });
          var kinds = topics.map(function (t) { var k = t.split(":")[2]; return (PUSH_KINDS.filter(function (x) { return x[0] === k; })[0] || [k, k])[1]; });
          return '<div class="nmatch"><span><a href="' + matchHref(m) + '">' + s.emoji + " " + esc(m.home) + " – " + esc(m.away) + "</a>" +
            "<small>" + esc(cap(fmtShort.format(d))) + (m.timeKnown ? ", " + fmtTime.format(d) : "") + " · " + esc(kinds.join(", ")) + "</small></span>" +
            '<button type="button" class="btn" data-topics="' + esc(topics.join(" ")) + '" aria-pressed="true">Αφαίρεση</button></div>';
        }).join("")

  // ---- Σελίδα αγώνα
  function matchByNt(nt) { return data.matches.filter(function (m) { return m.nt === nt; })[0] || null; }
  var fmtLong = new Intl.DateTimeFormat("el-GR", { timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric" });
  var MATCH_KINDS = [

  // Στατιστικά παικτών: ένας πίνακας ανά ομάδα. det.box = { cols: [[κλειδί, τίτλος, εξήγηση]], legend,
  // home/away: { players: [{ no, name, starter, … }], tot } } (tot: η γραμμή «Σύνολο», αν υπάρχει).
  function boxHtml(m, det) {
    var b = det.box;

  // Μπάσκετ (Euroleague και Genius Sports, κοινή μορφή): στατιστικά ομάδας και πίνακας παικτών.
  // Γραμμή παίκτη/ομάδας: { pts, m2, a2, m3, a3, mf, af, reb, ast, stl, tov, blk, pf, pir? }.
  function pct(md, at) { return at ? Math.round(md / at * 100) : 0; }
  function basketBox(home, away, withPir) {
    if (!home || !away) return { stats: [], box: null };
    var H = home.tot, A = away.tot;
    var stats = [["m2", "a2", "Δίποντα"], ["m3", "a3", "Τρίποντα"], ["mf", "af", "Βολές"]].map(function (x) {
      return { label: x[2], home: H[x[0]] + "/" + H[x[1]] + " · " + pct(H[x[0]], H[x[1]]) + "%",
               away: A[x[0]] + "/" + A[x[1]] + " · " + pct(A[x[0]], A[x[1]]) + "%", bar: [H[x[0]], A[x[0]]] };
    }).concat([["reb", "Ριμπάουντ"], ["ast", "Ασίστ"], ["stl", "Κλεψίματα"], ["tov", "Λάθη"], ["blk", "Κοψίματα"], ["pf", "Φάουλ"]].map(function (x) {
      return { label: x[1], home: String(H[x[0]]), away: String(A[x[0]]) };
    }));
    function row(r) {
      return { no: r.no, name: r.name, starter: r.starter, min: r.min, pts: r.pts, s2: r.m2 + "/" + r.a2, s3: r.m3 + "/" + r.a3,
               ft: r.mf + "/" + r.af, reb: r.reb, ast: r.ast, stl: r.stl, tov: r.tov, blk: r.blk, pf: r.pf, pir: r.pir };
    }
    function team(t) {
      var players = t.players.map(row), top = Math.max.apply(null, players.map(function (r) { return r.pts; }).concat([1]));
      players.forEach(function (r) { if (r.pts === top) r.hi = "pts"; });
      var tot = row(t.tot);
      tot.min = "";
      return { players: players, tot: tot };
    }
    var cols = [["min", "Λεπ", "Λεπτά"], ["pts", "Π", "Πόντοι", true], ["s2", "2Π", "Δίποντα εύστοχα/προσπάθειες"],
      ["s3", "3Π", "Τρίποντα εύστοχα/προσπάθειες"], ["ft", "Βολ", "Βολές εύστοχες/προσπάθειες"], ["reb", "Ριμ", "Ριμπάουντ"],
      ["ast", "Ασ", "Ασίστ"], ["stl", "Κλ", "Κλεψίματα"], ["tov", "Λαθ", "Λάθη"], ["blk", "Κοψ", "Κοψίματα"], ["pf", "Φ", "Φάουλ"]];
    if (withPir) cols.push(["pir", "PIR", "Δείκτης αξιολόγησης"]);
    return { stats: stats, box: { cols: cols, home: team(home), away: team(away),
      legend: "Λεπ λεπτά · Π πόντοι · 2Π/3Π/Βολ εύστοχα/προσπάθειες · Ριμ ριμπάουντ · Ασ ασίστ · Κλ κλεψίματα · Λαθ λάθη · Κοψ κοψίματα · Φ φάουλ" +
        (withPir ? " · PIR αξιολόγηση" : "") + ". Με έντονα όσοι ξεκίνησαν." } };

  // Euroleague: «ΕΠΩΝΥΜΟ, ΟΝΟΜΑ» → «Ο. Επώνυμο».
  function elName(s) {
    function cap(w) { return w.toLowerCase().replace(/(^|[\s'-])(\S)/g, function (x, a, c) { return a + c.toUpperCase(); }); }
    var p = String(s || "").split(",");
    return p.length > 1 ? (p[1].trim() ? p[1].trim()[0].toUpperCase() + ". " : "") + cap(p[0].trim()) : cap(p[0].trim());
  }
  function elTeam(t) {
    if (!t) return null;
    function n(x) { return +x || 0; }
    function line(p) {
      return { pts: n(p.Points), m2: n(p.FieldGoalsMade2), a2: n(p.FieldGoalsAttempted2), m3: n(p.FieldGoalsMade3),
        a3: n(p.FieldGoalsAttempted3), mf: n(p.FreeThrowsMade), af: n(p.FreeThrowsAttempted), reb: n(p.TotalRebounds),
        ast: n(p.Assistances), stl: n(p.Steals), tov: n(p.Turnovers), blk: n(p.BlocksFavour), pf: n(p.FoulsCommited), pir: n(p.Valuation) };
    }
    var players = (t.PlayersStats || []).filter(function (p) {
      return p.Minutes && !/DNP/i.test(p.Minutes) && !/^0?0:00$/.test(String(p.Minutes).trim());
    }).map(function (p) {

      });
    }
    return { players: players, tot: tot };

  function quartersHtml(m, det) {

  // Ομαδικά φάουλ της περιόδου σε εξέλιξη (τα συνολικά είναι στα στατιστικά) και time-out.
  function foulsLine(det) {

  function matchHtml(m) {
    if (!m) {

    function teamRow(side) {
      var name = side === "home" ? m.home : m.away, logo = side === "home" ? m.homeLogo : m.awayLogo;
      var sc = side === "home" ? hs : as;

      return '<div class="mh-row' + (lose === side ? " lose" : "") + (pts != null ? " vb" : "") + '">' + crest(logo, name, m.section) +
        '<span class="mh-name">' + (name === "ΠΑΟΚ" ? "ΠΑΟΚ" : esc(name)) + "</span>" +
        (pts != null ? '<span class="mh-pts" aria-label="Πόντοι στο σετ">' + pts + "</span>" : "") +

    if (m.venue) info.push(["Γήπεδο", m.venue]);
    if (m.tv || m.tvUrl) info.push(["Τηλεόραση", m.tv || "Live streaming", m.tvUrl]);

    info.push(["Έδρα", m.paokHome ? "Εντός" : "Εκτός"]);

      body + (isAdmin() ? adminMatchHtml(m) : "") + (isUpcoming(m) && !finalLive ? matchNotifyHtml(m) : "") + infoHtml + "</div>" + footerHtml();

  function athensSuffix(date) {

  // ---- Διαχειριστής: γεγονότα με ειδοποίηση (api/admin.js), στη μορφή των αυτόματων
  // Η φόρμα κρατά την κατάστασή της εδώ (ανά αγώνα), ώστε να μη χάνεται όταν ξαναζωγραφίζεται η σελίδα.
  var admForm = {};
  function adminPass() { try { return localStorage.getItem("paok-admin-pass") || ""; } catch (e) { return ""; } }
  function admSport(m) { return m.section.replace(/-women$/, ""); }
  // Τα γεγονότα ανά άθλημα: [κωδικός, κουμπί]. Όσα έχουν περιόδους ή σετ ρωτούν και ποια.
  function admEvents(m) {

    if (s === "basketball") {
      return [["goal", "Καλάθι"], ["start", "Ξεκίνησε"], ["pstart", "Αρχή περιόδου"], ["period", "Τέλος περιόδου"],
