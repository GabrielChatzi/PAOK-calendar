name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./probe.sh 2>&1 | tee probe-log.txt
      - run: |
          mkdir -p /tmp/p && cp -r out probe-log.txt /tmp/p/
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan probe-data && git rm -rfq . && cp -r /tmp/p/* .
          git add -A && git commit -qm probe && git push -f origin probe-data
