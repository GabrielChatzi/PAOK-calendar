name: Ενημέρωση ημερολογίων

on:
  schedule:
    # Κάθε 2 ώρες (ώρα UTC), ώστε τα αποτελέσματα να φτάνουν γρήγορα
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_calendars.py, standings.py, notify.py, .github/workflows/update.yml]

permissions:
  contents: write
  id-token: write  # ταυτότητα για τις ειδοποιήσεις web push (/api/push)

concurrency:
  group: update-calendars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Δημιουργία ημερολογίων
        id: build
        continue-on-error: true
        env:
          NTFY: "1"
        run: python3 build_calendars.py

      - name: Αποθήκευση αλλαγών
        run: |
          if git diff --quiet -- docs && [ -z "$(git ls-files --others --exclude-standard docs)" ]; then
            echo "Καμία αλλαγή."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Ενημέρωση προγράμματος αγώνων"
          git pull --rebase --quiet
          git push

      # Αν κάποια πηγή απέτυχε, το workflow σημειώνεται ως αποτυχημένο,
      # ώστε να έρθει ειδοποίηση από το GitHub.
      - name: Έλεγχος πηγών
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Κάποια πηγή προγράμματος απέτυχε· τα αντίστοιχα ημερολόγια έμειναν ως είχαν."
          exit 1
