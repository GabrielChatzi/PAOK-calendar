name: Live αγώνων

# Ξεκινά από το workflow των υπενθυμίσεων λίγο πριν από αγώνα με live (ποδόσφαιρο ESPN, EuroCup)
# και τρέχει όσο υπάρχουν αγώνες σε εξέλιξη. Μπορεί να ξεκινήσει και χειροκίνητα.
on:
  workflow_dispatch:
  # Εφεδρικός δρόμος αν δεν το ξεκινήσουν τα reminders.yml / update.yml: χωρίς αγώνα κοντά τελειώνει αμέσως.
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  actions: write  # η επόμενη εκτέλεση πριν από το όριο χρόνου
  id-token: write  # ταυτότητα για τις ειδοποιήσεις web push (/api/push)

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Η κατάσταση των αγώνων από την προηγούμενη εκτέλεση (βλ. STATE_FILE στο live.py).
      - uses: actions/cache/restore@v4
        with:
          path: .live
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-

      - name: Παρακολούθηση αγώνων
        env:
          PUSH: "1"
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
        run: python3 live.py

      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true  # χωρίς αγώνα δεν γράφεται αρχείο
        with:
          path: .live
          key: live-state-${{ github.run_id }}
