<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Μεταβιβάσεις · PAOKalendar</title>
<meta name="description" content="Δοκιμαστική έκδοση: κάτοχοι διαρκείας του ΠΑΟΚ δίνουν δωρεάν τη θέση τους σε αγώνες που δεν πάνε.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Μεταβιβάσεις">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;800&family=Fira+Sans:wght@400;500;600&display=swap&subset=greek" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --surface: #f1f0ed;
    --muted: #66655f;
    --rule: #d9d8d3;
    --ok: #17663a;
    --ok-bg: #e3f1e8;
    --warn: #7a4200;
    --warn-bg: #fff1dd;
    --danger: #a3261b;
    --display: "Fira Sans Extra Condensed", "Arial Narrow", sans-serif;
    --body: "Fira Sans", system-ui, sans-serif;
    --stripe: repeating-linear-gradient(90deg, var(--ink) 0 14px, var(--paper) 14px 28px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #fff;
      --paper: #000;
      --surface: #161615;
      --muted: #a3a29c;
      --rule: #2c2c2a;
      --ok: #7fd4a0;
      --ok-bg: #0f2a1a;
      --warn: #ffc97a;
      --warn-bg: #2b1d08;
      --danger: #ff8a7d;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 110px; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main { flex: 1 0 auto; width: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .masthead { background: var(--stripe); padding: calc(28px + env(safe-area-inset-top)) 16px 0; }
  .masthead-inner { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .masthead h1 {
    display: inline-block; margin: 0; padding: 10px 14px 6px; background: var(--paper); min-width: 0;
    font: 800 clamp(30px, 8vw, 56px)/0.9 var(--display); letter-spacing: -0.01em;
  }
  .masthead h1 a { text-decoration: none; }
  .who {
    flex: none; margin-bottom: 10px; min-height: 46px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
    background: var(--paper); color: var(--ink); border: 2px solid var(--ink); font-weight: 600; cursor: pointer; max-width: 130px;
  }
  .who span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who svg { width: 20px; height: 20px; flex: none; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  main { padding-bottom: 24px; }
  body:has(#cta[hidden]) main { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .test { background: var(--warn-bg); color: var(--warn); padding: 10px 16px; font-size: 14px; }
  .test .wrap { padding: 0; }
  .test strong { font-weight: 600; }

  .tabs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.85fr) minmax(0, 1.25fr); border: 2px solid var(--ink); margin: 18px 0 16px; }
  .tabs a { min-height: 46px; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .tabs a + a { border-left: 2px solid var(--ink); }
  .tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }
  .badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--danger); color: #fff; font-size: 13px; line-height: 22px; text-align: center; }
  .tabs a[aria-current="page"] .badge { background: var(--paper); color: var(--ink); }

  h2 { font: 800 26px/1.1 var(--display); margin: 24px 0 10px; }
  h3 { font: 800 21px/1.15 var(--display); margin: 0; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }

  .info { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); padding: 12px 14px; font-size: 15px; }
  .info svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
  .info.warn { background: var(--warn-bg); color: var(--warn); }
  .info.ok { background: var(--ok-bg); color: var(--ok); }
  .info p { margin: 0; }

  .match {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
    border: 1.5px solid var(--ink); padding: 12px; margin-bottom: 10px; text-decoration: none;
  }
  .date { background: var(--ink); color: var(--paper); text-align: center; padding: 6px 0; line-height: 1.1; }
  .date .d { display: block; font: 800 26px/1 var(--display); }
  .date .w, .date .m { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; }
  .match strong { display: block; font: 800 21px/1.1 var(--display); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chev { width: 20px; height: 20px; color: var(--muted); }

  .seat {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
    border: 1.5px solid var(--rule); padding: 12px; margin-bottom: 10px;
  }
  .gate { width: 52px; height: 52px; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 800 20px/1 var(--display); }
  .seat strong { display: block; font-weight: 600; }
  .seat .note { font-size: 14px; margin-top: 4px; }

  .btn {
    min-height: 46px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.okb { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
  .btn.link { border-color: transparent; background: transparent; color: var(--danger); padding: 0 8px; }
  .btn.block { display: flex; width: 100%; }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn svg { width: 18px; height: 18px; }

  /* sticky, όχι fixed: μένει κάτω όσο κάνεις scroll, αλλά στο τέλος μπαίνει ΜΕΤΑ το περιεχόμενο
     και δεν κρύβει ποτέ την τελευταία θέση. */
  .cta { position: sticky; bottom: 0; z-index: 5; background: var(--paper); border-top: 1.5px solid var(--rule); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .cta .wrap { padding: 0; }

  form .field { margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type="text"], select, textarea {
    width: 100%; min-height: 50px; padding: 10px 14px; border: 1.5px solid var(--ink); background: var(--paper); border-radius: 0;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .row4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .row4 input[type="text"] { padding: 10px; }
  .check { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; margin: 6px 0 14px; }
  .check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ink); flex: none; }

  .card { border: 1.5px solid var(--ink); padding: 14px; margin-bottom: 14px; }
  .card.done { border-color: var(--rule); }
  .card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
  .status { font-size: 13px; font-weight: 600; padding: 3px 10px; background: var(--ink); color: var(--paper); white-space: nowrap; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status.gray { background: var(--surface); color: var(--muted); }
  .req { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
  .steps { list-style: none; margin: 10px 0 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 14px; position: relative; }
  .steps li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; background: var(--rule); }
  .steps li.did:not(:last-child)::before { background: var(--ink); }
  .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; border: 2px solid var(--rule); color: var(--muted); background: var(--paper); position: relative; z-index: 1; }
  .did .dot { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .now .dot { border-color: var(--ink); color: var(--ink); }
  .dot svg { width: 14px; height: 14px; }
  .steps strong { display: block; font-weight: 600; padding-top: 3px; }
  .steps .todo strong { color: var(--muted); }
  .afmbox { background: var(--surface); padding: 12px; margin-top: 8px; display: grid; gap: 10px; }
  .afmbox .num { font: 600 22px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.08em; }
  .afmbox .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .empty { border: 1.5px dashed var(--rule); padding: 18px; text-align: center; color: var(--muted); }

  dialog { border: 2px solid var(--ink); padding: 20px; max-width: min(420px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgb(0 0 0 / 0.55); }
  dialog h3 { margin-bottom: 8px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; background: var(--ink); color: var(--paper); padding: 12px 16px; font-weight: 500; z-index: 10; }
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 10px; text-decoration: none; font-weight: 600; }
  .back svg { width: 18px; height: 18px; }
  footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
  .seat .btn { padding: 0 14px; }
  /* Ένδειξη φόρτωσης: λεπτή μπάρα πάνω και θάμπωμα, μόνο αν αργήσει πάνω από 150ms. */
  #bar { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--ink); z-index: 20; opacity: 0; }
  body.loading #bar { opacity: 1; width: 80%; transition: width 2s cubic-bezier(.1,.7,.2,1) .15s, opacity 0s .15s; }
  body.loading main { opacity: .55; transition: opacity .2s .15s; }
  .prio { font-size: 13px; color: var(--warn); margin-top: 4px; }
  .settings { border: 1.5px solid var(--ink); padding: 14px; margin-bottom: 14px; }
  .settings h3 { margin-bottom: 4px; }
  .settings p { margin: 0 0 10px; }
  .inline { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
  .inline input[type="text"] { flex: 1; min-width: 0; }
  .nudge { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1.5px solid var(--ink); padding: 12px 14px; margin-top: 10px; }
  .nudge p { margin: 0; flex: 1; min-width: 180px; font-size: 15px; }
  .due { margin: 4px 0 0; font-size: 14px; font-weight: 600; color: var(--warn); }
  .gatechoice { display: grid; gap: 8px; margin: 10px 0 12px; }
  .radio { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 12px; border: 1.5px solid var(--rule); font-weight: 600; margin: 0; cursor: pointer; }
  .radio:has(input[type=radio]:checked) { border-color: var(--ink); }
  .radio input[type=radio] { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); flex: none; }
  .radio input[type=text] { flex: 1; min-width: 0; min-height: 40px; padding: 6px 10px; font-weight: 400; }
  .radio input[type=text]:disabled { opacity: .4; }
  .nudge.ok { border-color: var(--ok); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>
<div id="bar" aria-hidden="true"></div>
<header class="masthead">
  <div class="masthead-inner">
    <h1><a href="#/">Μεταβιβάσεις</a></h1>
    <button class="who" id="who" type="button"></button>
  </div>
</header>
<div class="test"><div class="wrap"><strong>Δοκιμαστική έκδοση.</strong> Για δοκιμή χωρίς αληθινή μεταβίβαση χρησιμοποίησε τον ΑΦΜ <strong>123456783</strong>.</div></div>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="cta" id="cta" hidden><div class="wrap"><a class="btn solid block" id="cta-link" href="#/give"></a></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<dialog id="nickdlg">
  <form method="dialog" id="nickform">
    <h3>Διάλεξε ψευδώνυμο</h3>
    <p class="small muted" style="margin:0 0 14px">Αυτό βλέπουν οι άλλοι. Κρατιέται σε αυτή τη συσκευή· δεν ζητάμε email, κωδικό ή ΑΦΜ.</p>
    <div class="field">
      <label for="nick">Ψευδώνυμο</label>
      <input type="text" id="nick" autocomplete="nickname" maxlength="20" placeholder="π.χ. toumba79" required>
    </div>
    <p class="small" id="nickerr" style="color:var(--danger);margin:0 0 10px" hidden></p>
    <div class="actions">
      <button class="btn solid" type="submit" value="ok">Συνέχεια</button>
      <button class="btn" type="button" id="nickcancel">Άκυρο</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
const API = "/api/tx";
const TOKEN_KEY = "paok-tx-token";
const NICK_KEY = "paok-tx-nick";
const SPORT_KEY = "paok-tx-sport";
const PUSH_KEY = "paok-tx-push";
const WALLET = "https://wallet.gov.gr";
const HOUR = 3600 * 1000;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let token = store.get(TOKEN_KEY);
let nick = store.get(NICK_KEY);
let matchesById = new Map();
let summary = {};
let mine = null;
let demoMode = false;
let cutoffHours = 6;
let pushOn = false;
// Το «mine» ζητιέται μαζί με τα δεδομένα κάθε οθόνης, όχι πριν από αυτά.
let mineReady = Promise.resolve();
function refreshMine() {
  mineReady = token ? api("mine").then((d) => { mine = d; }, () => { mine = null; }) : Promise.resolve().then(() => { mine = null; });
  return mineReady;
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ICON = {
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  lock: '<svg style="width:14px;height:14px;vertical-align:-2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  clock: '<svg style="width:15px;height:15px;vertical-align:-2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};

// ---------- Δεδομένα ----------
async function api(action, { method = "GET", body, query = "" } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(`${API}?a=${action}${query}`, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && token) { setIdentity(null, null); }
  if (!res.ok) throw new Error((data.error || `Κάτι πήγε στραβά (HTTP ${res.status}).`) + (data.detail ? ` [${data.detail}]` : ""));
  return data;
}
const post = (action, body) => api(action, { method: "POST", body });

async function loadMatches() {
  const res = await fetch("/matches.json", { cache: "no-cache" });
  const data = await res.json();
  matchesById = new Map((data.matches || []).filter((m) => m.nt).map((m) => [m.nt, m]));
}
const deadline = (m) => new Date(new Date(m.start).getTime() - cutoffHours * HOUR);
const closed = (m) => !m || deadline(m).getTime() <= Date.now();
function upcoming(section, { openOnly = false } = {}) {
  const now = Date.now();
  return [...matchesById.values()]
    .filter((m) => m.paokHome && m.section === section && new Date(m.start).getTime() > now && (!openOnly || !closed(m)))
    .sort((a, b) => a.start.localeCompare(b.start));
}

// ---------- Μορφοποίηση ----------
const TZ = "Europe/Athens";
const fmt = (d, o) => new Intl.DateTimeFormat("el-GR", { timeZone: TZ, ...o }).format(new Date(d));
const HM = { hour: "2-digit", minute: "2-digit", hourCycle: "h23" };
const sportName = (s) => (s === "basketball" ? "Μπάσκετ" : "Ποδόσφαιρο");
const title = (m) => (m ? `${m.home} – ${m.away}` : "Αγώνας");
const dayTime = (d) => `${fmt(d, { weekday: "short", day: "numeric", month: "numeric" })} ${fmt(d, HM)}`;
const sameDay = (a, b) => fmt(a, { day: "numeric", month: "numeric" }) === fmt(b, { day: "numeric", month: "numeric" });
// «ως τις 14:30» σήμερα, αλλιώς «ως Δευ 2/11 14:30»
const dueText = (d) => (d ? (sameDay(d, Date.now()) ? `ως τις ${fmt(d, HM)}` : `ως ${dayTime(d)}`) : "");
function when(m) {
  if (!m) return "";
  const day = fmt(m.start, { weekday: "short", day: "numeric", month: "numeric" });
  return m.timeKnown === false ? `${day} · ώρα δεν έχει οριστεί` : `${day} · ${fmt(m.start, HM)}`;
}
function seatText(o) {
  return [`Θύρα ${o.gate}`, o.block && `Τμήμα ${o.block}`, o.row && `Σειρά ${o.row}`, o.seat && `Θέση ${o.seat}`].filter(Boolean).join(" · ");
}
const given = (n) => (n ? `έχει δώσει ${n}` : "Νέο μέλος");
const gateLabel = (g) => (g ? `Θύρα ${g}` : "Οποιαδήποτε θύρα");
const deadlineText = (m) => (m ? `έως ${dayTime(deadline(m))}` : "");

// Στο Wallet η μεταβίβαση ισχύει για τον επόμενο αγώνα του διαρκείας.
const MATCH_LENGTH = 3 * HOUR;
function nextFor(section) {
  const now = Date.now();
  return [...matchesById.values()]
    .filter((m) => m.paokHome && m.section === section && new Date(m.start).getTime() + MATCH_LENGTH > now)
    .sort((a, b) => a.start.localeCompare(b.start))[0] || null;
}
const isNext = (m) => Boolean(m && nextFor(m.section)?.nt === m.nt);
const blocker = (m) => { const n = m && nextFor(m.section); return n && n.nt !== m.nt ? n : null; };
const waitText = (m) => { const b = blocker(m); return b ? `μετά το ${title(b)} (${when(b)})` : "όταν έρθει η σειρά του αγώνα"; };
const prefGate = (section) => mine?.user?.prefs?.[section] ?? null;

// ---------- Ταυτότητα ----------
function setIdentity(t, n) {

  store.set(TOKEN_KEY, t); store.set(NICK_KEY, n);

}
function renderWho() {
  $("#who").innerHTML = ICON.user + `<span>${nick ? "@" + esc(nick) : "Είσοδος"}</span>`;
  $("#who").setAttribute("aria-label", nick ? `Ρυθμίσεις (@${nick})` : "Διάλεξε ψευδώνυμο");

let nickResolve = null;
function needNick() {

    $("#nickdlg").showModal();

$("#nickform").addEventListener("submit", async (e) => {

let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}

// ---------- Ειδοποιήσεις web push ----------
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = window.matchMedia?.("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function pushHelp() {
  if (pushSupported()) return "";
  if (isIOS && !standalone) return "Στο iPhone οι ειδοποιήσεις δουλεύουν μόνο από την οθόνη Αφετηρίας: πάτα Κοινοποίηση → «Προσθήκη στην οθόνη Αφετηρίας» και άνοιξε τις Μεταβιβάσεις από εκεί.";
  return "Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις.";
}
function b64ToBytes(b64) {
  const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64.length + 3) % 4));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}
async function registration() {
  await navigator.serviceWorker.register("/sw.js");
  return navigator.serviceWorker.ready;
}
async function enablePush() {
  if (!pushSupported()) throw new Error(pushHelp());
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Δεν δόθηκε άδεια για ειδοποιήσεις. Μπορείς να την αλλάξεις από τις ρυθμίσεις του browser.");
  const reg = await registration();
  const res = await fetch("/api/vapid");
  if (!res.ok) throw new Error("Οι ειδοποιήσεις δεν είναι διαθέσιμες αυτή τη στιγμή.");
  const { publicKey } = await res.json();
  const sub = (await reg.pushManager.getSubscription())
    || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
  await post("pushsub", { subscription: sub.toJSON() });
  store.set(PUSH_KEY, "1");
  pushOn = true;
}
async function disablePush() {
  // Η συνδρομή του browser μένει (μπορεί να τη χρησιμοποιεί και το PAOKalendar)· σβήνεται μόνο εδώ.
  const reg = await navigator.serviceWorker.getRegistration("/");
  const sub = await reg?.pushManager.getSubscription();
  if (sub) await post("pushunsub", { endpoint: sub.endpoint });
  store.set(PUSH_KEY, "0");
  pushOn = false;
}
async function syncPush() {
  if (!token || store.get(PUSH_KEY) !== "1" || !pushSupported() || Notification.permission !== "granted") { pushOn = false; return; }
  try {
    const reg = await registration();
    const sub = await reg.pushManager.getSubscription();
    if (!sub) { pushOn = false; return; }
    await post("pushsub", { subscription: sub.toJSON() });
    pushOn = true;
  } catch { pushOn = false; }
}
// Πριν μπει κάποιος σε λίστα ή δώσει θέση: οι ειδοποιήσεις είναι απαραίτητες (τα βήματα έχουν χρόνο).
async function tryPush() {
  if (pushOn) return;
  try { await enablePush(); } catch (err) { toast(`${err.message} Θα πρέπει να ανοίγεις τη σελίδα για να βλέπεις τι έγινε.`); }
}

// ---------- Κουμπιά με data-act: εκτελούν μια ενέργεια και ανανεώνουν ----------
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  e.preventDefault();
  const act = b.dataset.act;
  if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
  if (act === "copy") {
    try { await navigator.clipboard.writeText(b.dataset.value); toast("Ο ΑΦΜ αντιγράφηκε."); } catch { toast("Δεν έγινε αντιγραφή· σημείωσέ τον."); }
    return;
  }
  if (act === "reveal") {
    const el = document.getElementById(b.dataset.target);
    const shown = el.dataset.shown === "1";
    el.textContent = shown ? "••• ••• •••" : el.dataset.value.replace(/(\d{3})(?=\d)/g, "$1 ");
    el.dataset.shown = shown ? "0" : "1";
    b.textContent = shown ? "Εμφάνιση" : "Απόκρυψη";
    return;
  }
  if (act === "seed") {
    b.disabled = true;
    try { const r = await post("seed", {}); toast(r.created ? `Μπήκαν ${r.created} δοκιμαστικές θέσεις.` : "Υπάρχουν ήδη δοκιμαστικές θέσεις."); await render(); }
    catch (err) { toast(err.message); b.disabled = false; }
    return;
  }
  if (act === "showjoin") {
    document.getElementById(b.dataset.target).hidden = false;
    b.hidden = true;
    return;
  }
  if (!(await needNick())) return;
  if (act === "push-on" || act === "push-off") {
    b.disabled = true;
    try {
      if (act === "push-on") { await enablePush(); toast("Οι ειδοποιήσεις ενεργοποιήθηκαν σε αυτή τη συσκευή."); }
      else { await disablePush(); toast("Οι ειδοποιήσεις απενεργοποιήθηκαν σε αυτή τη συσκευή."); }
    } catch (err) { toast(err.message); }
    await render();
    return;
  }
  const body = JSON.parse(b.dataset.body || "{}");
  if (act === "afm") body.afm = document.getElementById(b.dataset.input).value.replace(/\s/g, "");
  if (act === "take" || act === "join") await tryPush();
  b.disabled = true;
  try {
    const r = await post(act, body);
    let ok = b.dataset.ok || "";
    if (act === "take" && r.status === "assigned") ok = "Η θέση είναι δική σου! Δες τι ακολουθεί στις κινήσεις σου.";
    if (act === "reclaim" && r.revoke) ok = "Κάνε τώρα ανάκληση στο Gov.gr Wallet. Ψάχνουμε άλλη θέση για τον παραλήπτη.";
    if (ok) toast(ok);
    if (act === "take" && r.status === "assigned") location.hash = "#/mine";
    else await render();
  } catch (err) {
    toast(err.message);
    b.disabled = false;
    await render();
  }
});

// Φόρμες θύρας: «μπες στη λίστα» (data-join) και προεπιλογή στις ρυθμίσεις (data-prefs).
function gateBody(f) {
  const any = f.elements.kind.value === "any";
  return any ? { any: true } : { gate: f.elements.gate.value };
}
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-join], form[data-prefs]");
  if (!f) return;
  e.preventDefault();
  if (!(await needNick())) return;
  const body = gateBody(f);
  if (!body.any && !String(body.gate || "").trim()) { toast("Γράψε τη θύρα ή διάλεξε «Οποιαδήποτε θύρα»."); f.elements.gate.focus(); return; }
  const btn = f.querySelector("button[type=submit]");
  btn.disabled = true;
  try {
    if (f.dataset.join) {
      await tryPush();
      const r = await post("join", { matchId: f.dataset.join, ...body });
      if (r.status === "assigned") { toast("Σου βρέθηκε θέση αμέσως! Δες τι ακολουθεί."); location.hash = "#/mine"; return; }
      toast("Είσαι στη λίστα. Θα σε ειδοποιήσουμε μόλις βρεθεί θέση.");
    } else {
      await post("prefs", { section: f.dataset.prefs, ...body });
      toast(`Αποθηκεύτηκε: ${gateLabel(body.any ? "" : body.gate.trim())}.`);
    }
    await render();
  } catch (err) { toast(err.message); btn.disabled = false; }
});
// Το πεδίο θύρας ενεργό μόνο όταν είναι επιλεγμένη η «Θύρα».
document.addEventListener("change", (e) => {
  const f = e.target.closest("form[data-join], form[data-prefs]");
  if (f && e.target.name === "kind") {
    f.elements.gate.disabled = f.elements.kind.value === "any";
    if (!f.elements.gate.disabled) f.elements.gate.focus();
  }
});

// ---------- Οθόνες ----------
function cta(text, href) {
  if (!text) { $("#cta").hidden = true; return; }
  $("#cta-link").innerHTML = ICON.swap + esc(text);
  $("#cta-link").href = href;
  $("#cta").hidden = false;
}
function sportTab() { return store.get(SPORT_KEY) === "basketball" ? "basketball" : "football"; }

function actionCount() {
  if (!mine) return 0;
  let n = 0;
  for (const o of mine.offers) {
    if (o.status === "assigned" && o.step === "transfer" && o.afm) n++;
    if (o.canNotAccepted) n++;
  }
  for (const c of mine.claims) {
    if (c.offer?.step === "afm" && c.offer.status === "assigned") n++;
    if (c.offer?.status === "transferred") n++;
    if (c.alts?.length) n++;
  }
  return n;
}
function tabs(active) {
  const n = actionCount();
  const t = (key, label, href) => `<a href="${href}"${active === key ? ' aria-current="page"' : ""}>${label}</a>`;
  return `<nav class="tabs" aria-label="Ενότητες">
    ${t("football", "Ποδόσφαιρο", "#/football")}
    ${t("basketball", "Μπάσκετ", "#/basketball")}
    ${t("mine", `Οι κινήσεις μου${n ? ` <span class="badge" aria-label="${n} εκκρεμότητες">${n}</span>` : ""}`, "#/mine")}
  </nav>`;
}
const step = (state, n, head, body = "") =>
  `<li class="${state}"><span class="dot">${state === "did" ? ICON.check : n}</span><div><strong>${head}</strong>${body}</div></li>`;
const btnAct = (act, label, body, { cls = "btn solid", ok = "", confirm = "", disabled = false, aria = "" } = {}) =>
  `<button class="${cls}" type="button" data-act="${act}" data-body='${esc(JSON.stringify(body))}'${ok ? ` data-ok="${esc(ok)}"` : ""}${confirm ? ` data-confirm="${esc(confirm)}"` : ""}${aria ? ` aria-label="${esc(aria)}"` : ""}${disabled ? " disabled" : ""}>${label}</button>`;
const dueLine = (d, text = "") => (d ? `<p class="due">${ICON.clock} ${text}${esc(dueText(d))}</p>` : "");

// Επιλογή «μία θύρα ή οποιαδήποτε» (στη λίστα αγώνα και στις ρυθμίσεις).
function gateForm({ attr, gate, id, button }) {
  const any = gate === "";

      <label class="radio"><input type="radio" name="kind" value="gate"${any ? "" : " checked"}><span>Θύρα</span>
        <input type="text" name="gate" id="${id}" maxlength="10" inputmode="text" autocomplete="off" placeholder="π.χ. 4" value="${esc(gate || "")}" aria-label="Αριθμός θύρας"${any ? " disabled" : ""}></label>
      <label class="radio"><input type="radio" name="kind" value="any"${any ? " checked" : ""}><span>Οποιαδήποτε θύρα</span></label>
    </div>
    <button class="btn solid block" type="submit">${button}</button>

}

    ${nudges}

  cta(upcoming(section, { openOnly: true }).length ? "Δεν πάω — δίνω τη θέση μου" : "", "#/give");

function seatRow(o, { canTake }) {

async function viewMatch(id) {
  const m = matchesById.get(id);
  if (!m) { $("#view").innerHTML = `<p class="empty">Ο αγώνας δεν βρέθηκε.</p>`; cta(); return; }
  const [data] = await Promise.all([api("match", { query: `&id=${encodeURIComponent(id)}` }), mineReady]);
  const shut = closed(m);
  const cl = data.claim;
  const hasSeat = cl && ["assigned", "done"].includes(cl.status);
  const canTake = !shut && !hasSeat && !data.giving;
  const pg = data.prefGate ?? prefGate(m.section);

  let box = "";
  if (shut) {
    box = cl?.status === "expired" ? `<div class="nudge"><p>Δεν βρέθηκε θέση για αυτόν τον αγώνα.</p></div>` : "";
  } else if (data.giving) {
    box = `<div class="nudge"><p>Δίνεις θέση σε αυτόν τον αγώνα. Δες την πορεία της στις <a href="#/mine">κινήσεις σου</a>.</p></div>`;
  } else if (hasSeat) {
    box = `<div class="nudge ok"><p>${ICON.check.replace("<svg", '<svg style="width:18px;height:18px;vertical-align:-3px"')} Έχεις θέση για αυτόν τον αγώνα.</p><a class="btn solid" href="#/mine">Τι ακολουθεί</a></div>`;
  } else if (cl?.status === "waiting") {
    box = `<div class="settings">
      <h3>Είσαι στη λίστα · ${esc(gateLabel(cl.gate))}</h3>
      <p class="small">${cl.rescued ? "Ο κάτοχος της θέσης σου δεν ολοκλήρωσε. Είσαι <strong>πρώτος</strong> για την επόμενη θέση που θα βγει." : "Θα σε ειδοποιήσουμε μόλις βρεθεί θέση. Αν αλλάξεις θύρα, κρατάς τη σειρά σου."}</p>
      <div class="actions"><button class="btn" type="button" data-act="showjoin" data-target="joinwrap">Αλλαγή θύρας</button>
        ${btnAct("leave", "Βγες από τη λίστα", { matchId: id }, { cls: "btn link", confirm: "Να βγεις από τη λίστα; Αν ξαναμπείς, θα μπεις στο τέλος.", ok: "Βγήκες από τη λίστα." })}</div>
      <div id="joinwrap" hidden style="margin-top:12px">${gateForm({ attr: `data-join="${id}"`, gate: cl.gate, id: "jg", button: "Αποθήκευση" })}</div>
    </div>`;
  } else {
    const again = cl?.status === "timedout";
    box = `<div class="settings">
      <h3>${again ? "Θες ακόμα θέση;" : "Ψάχνεις θέση;"}</h3>
      <p class="small muted">${again ? "Η προηγούμενη θέση πήγε στον επόμενο επειδή δεν στάλθηκε ο ΑΦΜ εγκαίρως. " : ""}Δήλωσε μία θύρα ή οποιαδήποτε. Όποιος δηλώσει πρώτος παίρνει την επόμενη θέση που θα δοθεί.</p>
      ${gateForm({ attr: `data-join="${id}"`, gate: cl?.gate ?? pg ?? null, id: "jg", button: again ? "Ξαναμπές στη λίστα" : "Μπες στη λίστα" })}
    </div>`;
  }

  $("#view").innerHTML = `<a class="back" href="#/${m.section}">${ICON.back} ${sportName(m.section)}</a>
    <p class="label" style="margin-top:8px">${esc(m.competition || sportName(m.section))}</p>
    <h2 style="margin-top:0">${esc(title(m))}</h2>
    <p class="muted" style="margin-top:-4px">${esc(when(m))} · ${esc(m.venue || "")}</p>
    ${shut ? `<div class="info warn">${ICON.info}<p>Έκλεισαν οι μεταβιβάσεις για αυτόν τον αγώνα (γίνονται έως ${cutoffHours} ώρες πριν).</p></div>`
      : `<div class="info">${ICON.info}<p>Μεταβίβαση ${esc(deadlineText(m))}.${blocker(m) ? ` Ανοίγει ${esc(waitText(m))}· η θέση κανονίζεται από τώρα.` : ""}${data.seekers ? ` · ${data.seekers} στη λίστα.` : ""}</p></div>`}
    ${box}
    ${shut ? "" : `<p class="label">Ελεύθερες τώρα (${data.offers.length})</p>
    ${data.offers.map((o) => seatRow(o, { canTake })).join("") || `<p class="empty">Καμία ελεύθερη θέση. Όποια δοθεί, πάει αυτόματα στον πρώτο της λίστας.</p>`}`}`;
  cta(shut ? "" : "Δεν πάω — δίνω τη θέση μου", `#/give/${id}`);
}

    <div class="info warn" style="margin-bottom:16px">${ICON.info}<p>Το διαρκείας σου πρέπει να είναι στο Gov.gr Wallet. Η θέση δίνεται <strong>αυτόματα</strong> σε όποιον μπήκε πρώτος στη λίστα για αυτή τη θύρα ή για οποιαδήποτε. Θα σε ειδοποιήσουμε για κάθε βήμα.</p></div>
    <form id="giveform">
      <div class="field"><label for="g-match">Αγώνας</label><select id="g-match" required>${opts}</select>
        <p class="small muted" id="g-deadline" style="margin:6px 0 0"></p></div>
      <div class="row3 field" id="g-seatrow">
        <div><label for="g-gate">Θύρα</label><input type="text" id="g-gate" maxlength="10" required></div>
        <div id="g-blockwrap" hidden><label for="g-block">Τμήμα</label><input type="text" id="g-block" maxlength="6" placeholder="Προαιρ."></div>
        <div><label for="g-row">Σειρά</label><input type="text" id="g-row" maxlength="6" placeholder="Προαιρ."></div>
        <div><label for="g-seat">Θέση</label><input type="text" id="g-seat" maxlength="6" placeholder="Προαιρ."></div>
      </div>
      <div class="field"><label for="g-note">Σημείωση <span class="muted" style="font-weight:400">(προαιρετικά)</span></label>
        <textarea id="g-note" maxlength="140" placeholder="π.χ. Θα κάνω τη μεταβίβαση το πρωί"></textarea></div>
      <label class="check"><input type="checkbox" id="g-free"><span>Δίνω τη θέση <strong>δωρεάν</strong>, χωρίς να ζητήσω χρήματα ή αντάλλαγμα.</span></label>
      <button class="btn solid block" type="submit" id="g-submit" disabled>Δημοσίευση θέσης</button>
      <p class="small muted" style="text-align:center" id="g-hint">Τσέκαρε ότι τη δίνεις δωρεάν για να συνεχίσεις.</p>
    </form>`;
  cta();
  if (!opts) { $("#giveform").innerHTML = `<p class="empty">Δεν υπάρχει εντός έδρας αγώνας που να δέχεται ακόμα θέσεις.</p>`; return; }
  // Το κουμπί ενεργοποιείται ΜΟΝΟ όταν τσεκαριστεί το «δωρεάν».
  const syncFree = () => {
    const okFree = $("#g-free").checked;
    $("#g-submit").disabled = !okFree;
    $("#g-hint").textContent = okFree ? "Μπορείς να την πάρεις πίσω με «Τελικά θα πάω»." : "Τσέκαρε ότι τη δίνεις δωρεάν για να συνεχίσεις.";
  };
  $("#g-free").addEventListener("change", syncFree);
  syncFree();
  // Στο μπάσκετ η θέση έχει και «Τμήμα»· κάτω από τον αγώνα η προθεσμία του.
  const sync = () => {
    const m = matchesById.get($("#g-match").value);
    const basket = m?.section === "basketball";
    $("#g-blockwrap").hidden = !basket;
    $("#g-seatrow").className = (basket ? "row4" : "row3") + " field";
    $("#g-deadline").textContent = m ? `Μεταβίβαση ${deadlineText(m)}${blocker(m) ? ` · ανοίγει ${waitText(m)}` : ""}.` : "";
    const g = prefGate(m?.section);
    if (g && !$("#g-gate").value) $("#g-gate").value = g;
  };
  $("#g-match").addEventListener("change", sync);
  sync();
  $("#giveform").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!$("#g-free").checked) return;
    if (!(await needNick())) return;
    await tryPush();
    const btn = $("#g-submit");
    btn.disabled = true;
    try {
      const r = await post("offer", {
        matchId: $("#g-match").value, gate: $("#g-gate").value,
        block: $("#g-blockwrap").hidden ? "" : $("#g-block").value, row: $("#g-row").value,
        seat: $("#g-seat").value, note: $("#g-note").value, free: $("#g-free").checked,
      });
      toast(r.assigned ? "Η θέση δόθηκε αμέσως στον πρώτο της λίστας!" : "Η θέση δημοσιεύτηκε. Θα δοθεί αυτόματα στον πρώτο που θα μπει στη λίστα.");
      location.hash = "#/mine";
    } catch (err) { toast(err.message); btn.disabled = false; }
  });
}

const reclaimBtn = (o, after) => btnAct("reclaim", "Τελικά θα πάω", { offerId: o.id }, {
  cls: "btn link",
  confirm: after
    ? "Η μεταβίβαση έχει ήδη γίνει: θα πρέπει να κάνεις ανάκληση στο Gov.gr Wallet. Ο παραλήπτης θα μπει πρώτος στη λίστα για άλλη θέση. Συνέχεια;"
    : o.recipient ? "Ο παραλήπτης θα μπει πρώτος στη λίστα για άλλη θέση. Συνέχεια;" : "Να αποσυρθεί η θέση;",
  ok: o.recipient ? "Κράτησες τη θέση. Ψάχνουμε άλλη για τον παραλήπτη." : "Η θέση αποσύρθηκε.",
});

function offerCard(o) {
  const m = matchesById.get(o.matchId);
  const head = (status, cls = "") => `<div class="card-head"><div><h3>${esc(title(m))}</h3>
    <div class="small muted">${esc(when(m))} · ${esc(seatText(o))}</div></div><span class="status ${cls}">${status}</span></div>`;

  if (o.status === "open") {
    return `<div class="card">${head("Ψάχνουμε παραλήπτη", "gray")}
      <p class="small" style="margin:0">Θα δοθεί αυτόματα στον πρώτο που θα μπει στη λίστα για τη Θύρα ${esc(o.gate)} ή για οποιαδήποτε. Θα σε ειδοποιήσουμε.</p>
      <div class="actions">${reclaimBtn(o, false)}</div></div>`;
  }
  if (o.status === "assigned") {
    const afmBlock = o.afm
      ? `<div class="afmbox"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="small muted">ΑΦΜ</span><span class="num" id="afm-${o.id}" data-value="${esc(o.afm)}">••• ••• •••</span></div>
          <div class="two"><button class="btn" type="button" data-act="reveal" data-target="afm-${o.id}">Εμφάνιση</button>
          <button class="btn solid" type="button" data-act="copy" data-value="${esc(o.afm)}">${ICON.copy} Αντιγραφή</button></div></div>`
      : "";
    const s2 = o.step === "wait"
      ? step("now", 2, "Αναμονή για τη σειρά του αγώνα", `<p class="small" style="margin:4px 0 0">Η μεταβίβαση ισχύει για τον επόμενο αγώνα του διαρκείας και ανοίγει ${esc(waitText(m))}.</p>`)
      : o.step === "afm"
        ? step("now", 2, `Περιμένουμε τον ΑΦΜ του @${esc(o.recipient)}`, dueLine(o.due))
        : step("did", 2, `Ο @${esc(o.recipient)} έστειλε τον ΑΦΜ του`, afmBlock);
    const lateBox = o.step === "transfer" && o.late
      ? `<div class="info warn" style="margin:6px 0 0">${ICON.info}<p>${o.rescued
          ? `Ψάχνουμε άλλη θέση για τον @${esc(o.recipient)}. Αν προλαβαίνεις, κάνε τη μεταβίβαση τώρα· αλλιώς η θέση σου θα πάει στον επόμενο μόλις του βρεθεί άλλη.`
          : `Έληξε ο χρόνος. Έχεις άλλη 1 ώρα, ${esc(dueText(o.due))}.`}</p></div>` : "";
    const s3 = step(o.step === "transfer" ? "now" : "todo", 3, "Κάνε τη μεταβίβαση στο Gov.gr Wallet",
      o.step === "transfer" ? `${o.late ? "" : dueLine(o.due)}<p class="small" style="margin:4px 0 8px">Εισιτήρια › το διαρκείας σου › [⋮] › Μεταβίβαση, και επικόλλησε τον ΑΦΜ.</p>
        <a class="btn" href="${WALLET}" target="_blank" rel="noopener">Άνοιγμα Gov.gr Wallet ${ICON.ext}</a>${lateBox}` : "");
    return `<div class="card">${head(o.step === "wait" ? "Κανονίστηκε" : o.late ? "Αργεί!" : "Σε εξέλιξη", o.step === "wait" ? "ok" : "warn")}
      <ol class="steps">
        ${step("did", 1, `Βρέθηκε παραλήπτης: @${esc(o.recipient)}`)}
        ${s2}${s3}
        ${step("todo", 4, "Αποδοχή από τον παραλήπτη")}
      </ol>
      <div class="actions">${o.step === "transfer" ? btnAct("transferred", "Έκανα τη μεταβίβαση", { offerId: o.id }, { ok: "Ενημερώθηκε ο παραλήπτης." }) : ""}${reclaimBtn(o, false)}</div>
      ${o.afm ? `<p class="small muted" style="margin:10px 0 0">${ICON.lock} Ο ΑΦΜ τον βλέπεις μόνο εσύ και σβήνεται μόλις ολοκληρωθεί η μεταβίβαση.</p>` : ""}
    </div>`;
  }
  if (o.status === "transferred" || o.status === "received") {
    const got = o.status === "received";
    return `<div class="card">${head(got ? "Παραδόθηκε" : "Αναμονή αποδοχής", got ? "ok" : "warn")}
      <ol class="steps">
        ${step("did", 1, `Βρέθηκε παραλήπτης: @${esc(o.recipient)}`)}
        ${step("did", 2, "Ο παραλήπτης έστειλε τον ΑΦΜ του")}
        ${step("did", 3, "Έκανες τη μεταβίβαση")}
        ${step(got ? "did" : "now", 4, got ? `Ο @${esc(o.recipient)} το πήρε` : `Περιμένουμε τον @${esc(o.recipient)} να το αποδεχτεί`, got ? "" : dueLine(o.due))}
      </ol>
      ${o.canNotAccepted ? `<div class="info warn" style="margin:4px 0 0">${ICON.info}<p>Δεν έχει επιβεβαιώσει. Δες στο Wallet: αν <strong>δεν</strong> το αποδέχτηκε, κάνε ανάκληση και πάτα το κουμπί για να πάει η θέση στον επόμενο.</p></div>
        <div class="actions">${btnAct("notaccepted", "Δεν το αποδέχτηκε", { offerId: o.id }, { confirm: "Έκανες ανάκληση στο Wallet; Η θέση θα πάει στον επόμενο της λίστας.", ok: "Η θέση πάει στον επόμενο." })}</div>` : ""}
      <p class="small muted" style="margin:6px 0 0">Η μεταβίβαση ισχύει μόνο για αυτόν τον αγώνα· μετά το εισιτήριο επιστρέφει σε σένα.</p>
      <div class="actions">${reclaimBtn(o, true)}</div>
    </div>`;
  }
  const label = { closed: "Ολοκληρώθηκε", expired: "Έληξε", reclaimed: "Την κράτησες" }[o.status] || o.status;
  return `<div class="card done">${head(label, "gray")}${o.recipient && o.status === "closed" ? `<p class="small muted" style="margin:0">Δόθηκε στον @${esc(o.recipient)}.</p>` : ""}</div>`;
}

function claimCard(c) {
  const m = matchesById.get(c.matchId);
  const o = c.offer;
  const head = (status, cls = "", sub = "") => `<div class="card-head"><div><h3>${esc(title(m))}</h3>
    <div class="small muted">${esc(when(m))}${sub ? ` · ${sub}` : ""}</div></div><span class="status ${cls}">${status}</span></div>`;

  if (c.status === "waiting") {
    const alts = (c.alts || []).map((a) => `<div class="req"><span><strong>${esc(seatText(a))}</strong><br><span class="small muted">@${esc(a.owner)}</span></span>
      ${btnAct("take", "Τη θέλω", { offerId: a.id })}</div>`).join("");
    return `<div class="card">${head("Στη λίστα", "gray", esc(gateLabel(c.gate)))}
      ${c.rescued ? `<p class="small" style="margin:0 0 6px"><strong>Είσαι πρώτος</strong> για την επόμενη θέση${c.lateOffer ? `· αν ο @${esc(c.lateOffer.owner)} κάνει τελικά τη μεταβίβαση, κρατάς εκείνη.` : "."}</p>`
        : `<p class="small" style="margin:0">Θα σε ειδοποιήσουμε μόλις βρεθεί θέση.</p>`}
      ${alts ? `<p class="label" style="margin:14px 0 4px">Ελεύθερες σε άλλη θύρα · όποιος προλάβει</p>${alts}` : ""}
      <div class="actions"><a class="btn" href="#/m/${c.matchId}">Αλλαγή θύρας</a>
        ${btnAct("leave", "Βγες από τη λίστα", { matchId: c.matchId }, { cls: "btn link", confirm: "Να βγεις από τη λίστα; Αν ξαναμπείς, θα μπεις στο τέλος.", ok: "Βγήκες από τη λίστα." })}</div></div>`;
  }
  if (c.status === "assigned" && o) {
    const back = btnAct("backout", "Δεν μπορώ τελικά να πάω", { offerId: o.id }, { cls: "btn link", confirm: "Η θέση θα πάει στον επόμενο της λίστας. Συνέχεια;", ok: "Η θέση πάει στον επόμενο." });
    const sub = `${esc(seatText(o))} · από @${esc(o.owner)}`;
    if (o.status === "assigned" && o.step === "wait") {
      return `<div class="card">${head("Σου βρέθηκε θέση!", "ok", sub)}
        <p class="small" style="margin:0">Η μεταβίβαση ισχύει για τον επόμενο αγώνα του διαρκείας, οπότε ο ΑΦΜ θα ζητηθεί ${esc(waitText(m))}. Θα σε ειδοποιήσουμε.</p>
        <div class="actions">${back}</div></div>`;
    }
    if (o.status === "assigned" && o.step === "afm") {
      return `<div class="card">${head("Σου βρέθηκε θέση!", "ok", sub)}
        <label for="afm-in-${o.id}" style="margin-top:6px">Ο ΑΦΜ σου</label>
        ${dueLine(o.due, "Στείλ' τον ")}
        <input type="text" id="afm-in-${o.id}" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="9 ψηφία">
        <p class="small muted" style="margin:8px 0 0">${ICON.lock} Τον βλέπει μόνο ο @${esc(o.owner)}, για να κάνει τη μεταβίβαση, και σβήνεται μετά. Αν δεν σταλεί εγκαίρως, η θέση πάει στον επόμενο.</p>
        <div class="actions"><button class="btn solid" type="button" data-act="afm" data-input="afm-in-${o.id}" data-body='${esc(JSON.stringify({ offerId: o.id }))}' data-ok="Ο ΑΦΜ στάλθηκε.">Αποστολή ΑΦΜ</button>${back}</div></div>`;
    }
    if (o.status === "assigned" && o.step === "transfer") {
      return `<div class="card">${head(o.late ? "Ο κάτοχος αργεί" : "Σε εξέλιξη", "warn", sub)}
        <ol class="steps">
          ${step("did", 1, "Σου βρέθηκε θέση")}
          ${step("did", 2, "Έστειλες τον ΑΦΜ σου")}
          ${step("now", 3, `Περιμένεις τον @${esc(o.owner)} να κάνει τη μεταβίβαση`, o.late ? `<p class="small" style="margin:4px 0 0">Έχει ${esc(dueText(o.due))}. Αλλιώς σου βρίσκουμε άλλη θέση.</p>` : dueLine(o.due))}
          ${step("todo", 4, "Αποδοχή στο Gov.gr Wallet")}
        </ol><div class="actions">${back}</div></div>`;
    }
    if (o.status === "transferred") {
      return `<div class="card">${head("Έγινε η μεταβίβαση", "ok", sub)}
        <ol class="steps">
          ${step("did", 1, "Σου βρέθηκε θέση")}
          ${step("did", 2, "Έστειλες τον ΑΦΜ σου")}
          ${step("did", 3, `Ο @${esc(o.owner)} έκανε τη μεταβίβαση`)}
          ${step("now", 4, "Αποδέξου το εισιτήριο στο Gov.gr Wallet",
            `${dueLine(o.due)}<p class="small" style="margin:4px 0 8px">Θα σου έρθει email. Άνοιξε το Wallet και πάτα αποδοχή.</p><a class="btn" href="${WALLET}" target="_blank" rel="noopener">Άνοιγμα Gov.gr Wallet ${ICON.ext}</a>`)}
        </ol>
        <div class="actions">${btnAct("received", "Το πήρα — είναι στο Wallet μου", { offerId: o.id }, { ok: "Τέλεια! Καλή διασκέδαση στο γήπεδο." })}</div></div>`;
    }
  }
  if (c.status === "done") return `<div class="card done">${head("Στο Wallet σου", "ok", o ? esc(seatText(o)) : "")}<p class="small" style="margin:0">Καλή διασκέδαση στο γήπεδο!</p></div>`;
  if (c.status === "timedout") {
    return `<div class="card done">${head("Πήγε στον επόμενο", "gray")}<p class="small muted" style="margin:0">Η θέση δόθηκε στον επόμενο επειδή δεν απαντήθηκε εγκαίρως.</p>
      ${closed(m) ? "" : `<div class="actions"><a class="btn" href="#/m/${c.matchId}">Ξαναμπές στη λίστα</a></div>`}</div>`;
  }
  if (c.status === "expired") return `<div class="card done">${head("Δεν βρέθηκε θέση", "gray")}<p class="small muted" style="margin:0">Έκλεισαν οι μεταβιβάσεις για αυτόν τον αγώνα.</p></div>`;
  return "";
}

async function viewMine() {
  await mineReady;
  if (!token) {
    $("#view").innerHTML = `${tabs("mine")}<p class="empty">Διάλεξε ψευδώνυμο για να δίνεις θέσεις ή να μπαίνεις στη λίστα.</p>
      <button class="btn solid block" type="button" id="getnick">Διάλεξε ψευδώνυμο</button>`;
    $("#getnick").addEventListener("click", async () => { if (await needNick()) render(); });
    cta(); return;
  }
  const recent = (id) => { const m = matchesById.get(id); return !m || new Date(m.start).getTime() > Date.now() - 2 * 86400000; };
  const offers = (mine?.offers || []).filter((o) => recent(o.matchId));
  const claims = (mine?.claims || []).filter((c) => recent(c.matchId));
  $("#view").innerHTML = `${tabs("mine")}
    ${!pushOn ? `<div class="nudge" style="margin-bottom:6px"><p>Ενεργοποίησε τις ειδοποιήσεις: κάθε βήμα έχει περιορισμένο χρόνο.</p><a class="btn" href="#/settings">${ICON.bell} Ειδοποιήσεις</a></div>` : ""}
    <p class="label">Ψάχνω</p>
    ${claims.map(claimCard).join("") || `<p class="empty">Δεν είσαι σε καμία λίστα. Διάλεξε αγώνα από το <a href="#/football">ποδόσφαιρο</a> ή το <a href="#/basketball">μπάσκετ</a>.</p>`}
    <p class="label">Δίνω</p>
    ${offers.map(offerCard).join("") || `<p class="empty">Δεν έχεις δώσει θέση.</p>`}
    <a class="btn block" href="#/give">${ICON.swap} Δεν πάω — δίνω τη θέση μου</a>`;
  cta();
}

      <p class="small muted">Προτείνεται αυτόματα όταν μπαίνεις σε λίστα ή δίνεις θέση.</p>

      <p class="label" style="margin-top:18px">Μπάσκετ</p>

    </div>
    <div class="settings">
      <h3>Λογαριασμός</h3>

      <button class="btn" type="button" id="logout">Αποσύνδεση</button>

// ---------- Δρομολόγηση ----------
let rendering = null;
let renderAgain = false;
function render() {
  if (rendering) { renderAgain = true; return rendering; }
  rendering = renderOnce().finally(() => {
    rendering = null;
    if (renderAgain) { renderAgain = false; return render(); }
  });
  return rendering;
}
async function renderOnce() {
  // Κρατάμε ό,τι γράφει ο χρήστης στα πεδία κατά την ανανέωση.
  const keep = {};
  document.querySelectorAll("#view input[id], #view textarea[id], #view select[id]").forEach((el) => {
    keep[el.id] = el.type === "checkbox" ? el.checked : el.value;
  });
  const focused = document.activeElement?.id;
  try {
    refreshMine();
    const parts = location.hash.replace(/^#\/?/, "").split("/");
    if (parts[0] === "m" && parts[1]) await viewMatch(parts[1]);
    else if (parts[0] === "give") await viewGive(parts[1]);
    else if (parts[0] === "mine") await viewMine();
    else if (parts[0] === "settings") await viewSettings();
    else await viewHome(parts[0] === "basketball" || parts[0] === "football" ? parts[0] : sportTab());
    for (const [id, v] of Object.entries(keep)) {
      const el = document.getElementById(id);
      if (!el || el.disabled) continue;
      el.type === "checkbox" ? (el.checked = v) : (el.value = v);
      // π.χ. το «δωρεάν»: ό,τι εξαρτάται από το πεδίο ενημερώνεται ξανά.
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }
    if (focused) document.getElementById(focused)?.focus();
  } catch (err) {
    $("#view").innerHTML = `<p class="empty">${esc(err.message)}</p>`;
  }
}

let lastHash = location.hash;
window.addEventListener("hashchange", () => {
  if (location.hash.split("/")[1] !== lastHash.split("/")[1]) window.scrollTo(0, 0);
  lastHash = location.hash;
  document.body.classList.add("loading");
  render().finally(() => document.body.classList.remove("loading"));
});
// Ανανέωση κάθε 15 δευτερόλεπτα όσο η σελίδα είναι ανοιχτή (όχι σε φόρμες ούτε με ανοιχτό διάλογο).
setInterval(() => {
  if (document.visibilityState !== "visible" || $("#nickdlg").open) return;
  if (location.hash.startsWith("#/give") || location.hash.startsWith("#/settings")) return;
  if (document.activeElement?.matches?.("#view input, #view textarea")) return;
  render();
}, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") render(); });
navigator.serviceWorker?.addEventListener("message", (e) => {
  if (e.data?.type === "open" && e.data.url) location.href = e.data.url;
});

renderWho();
// Πρώτα η σελίδα· ο έλεγχος ειδοποιήσεων γίνεται παράλληλα και ανανεώνει μόνο αν άλλαξε κάτι.
loadMatches()
  .then(() => {
    const before = pushOn;
    syncPush().then(() => { if (pushOn !== before) render(); });
    return render();
  })
  .catch(() => { $("#view").innerHTML = `<p class="empty">Δεν φορτώθηκε το πρόγραμμα. Δοκίμασε ξανά.</p>`; });
</script>
</body>
</html>
