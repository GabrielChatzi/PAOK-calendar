name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, re, html, json, concurrent.futures as cf
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          def get(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60).read().decode("utf-8", "ignore")
              except Exception as e:
                  return ""
          pool = {}
          def grab(page):
              # ranking tables
              for tr in re.findall(r"<tr>(.*?)</tr>", page, re.S):
                  m = re.search(r'<img[^>]+src="([^"]+)".*?class="team-text">([^<]+)<', tr, re.S)
                  if m: pool.setdefault(html.unescape(m.group(2)).strip(), m.group(1))
              for block in page.split("node--type-national-match")[1:]:
                  names = [re.sub(r"<[^>]+>", "", n).strip() for n in re.findall(r"field--name-name[^>]*>(.*?)</div>", block, re.S)[:2]]
                  logos = re.findall(r'field--name-field-icon.*?<img[^>]+src="([^"]+)"', block, re.S)[:2]
                  for n, l in zip(names, logos): pool.setdefault(html.unescape(n), l)
          def comp(i):
              p = get(f"https://www.epo.gr/el/competition/{i}/matches")
              if not p: return i, 0, ""
              title = re.search(r"<title>([^<]*)", p)
              pages = [p] + [get("https://www.epo.gr" + html.unescape(v)) for v in dict.fromkeys(re.findall(r'value="(/el/competition/%d/stage/\d+/group/\d+/matches)"' % i, p))][:12]
              return i, pages, title.group(1) if title else ""
          titles = {}
          with cf.ThreadPoolExecutor(6) as ex:
              for i, pages, t in ex.map(comp, range(1, 121)):
                  if pages:
                      titles[i] = t
                      for pg in pages: grab(pg)
          json.dump({"titles": titles, "pool": pool}, open("probe/epo_pool.json", "w"), ensure_ascii=False, indent=0)
          print(len(titles), len(pool))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
