name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, urllib.parse, re
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36", "Accept-Language": "el,en"}
          out = open("probe/result.txt", "w")
          for q in ["Achilleas Triandrias", "Agrotikos Asteras", "Makedonikos", "Ethnikos Pylaias", "Nea Politeia Evosmou", "Megas Alexandros"]:
              u = "https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=" + urllib.parse.quote(q)
              try:
                  t = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40).read().decode("utf-8", "ignore")
                  hits = re.findall(r'wappen/(?:tiny|small|head)/(\d+)\.png[^>]*>.*?title="([^"]+)"', t, re.S)[:4]
                  out.write(f"{q}: {len(t)} {hits}\n")
              except Exception as e:
                  out.write(f"{q}: ERR {e}\n")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
