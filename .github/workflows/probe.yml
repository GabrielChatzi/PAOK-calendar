name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          B=https://ekasth.gr/champs/matchcenter8
          g(){ curl -sSL -A "$UA" -m 60 -o "probe/$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> probe/result.txt 2>&1; }
          g range.json "$B/bgapi.php?action=range&from=2026-09-01&to=2027-06-30"
          g day.json "$B/bgapi.php?action=day&date=2026-11-21"
          g comp.html "$B/competition.html"
          g team.html "$B/team.html"
          g game.html "$B/game.html"
          for f in comp team game; do grep -oE 'api\("[a-z_]+"[^)]{0,120}\)' probe/$f.html | sort -u >> probe/actions.txt; done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
