name: Υπενθυμίσεις αγώνων

on:
  schedule:
    # Κάθε 15 λεπτά· στέλνει υπενθύμιση για αγώνες που ξεκινούν μέσα στα επόμενα 75 λεπτά
    # και ξεκινά την παρακολούθηση live όταν πλησιάζει αγώνας με live.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write  # ταυτότητα για τις ειδοποιήσεις web push (/api/push)

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ποιες υπενθυμίσεις έχουν ήδη σταλεί κρατιέται στην cache, όχι στο repo.
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: reminded-${{ github.run_id }}
          restore-keys: reminded-

      - name: Αποστολή υπενθυμίσεων
        id: remind
        env:
          PUSH: "1"
        run: python3 notify.py reminders

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: reminded-${{ github.run_id }}

      # Μεταβιβάσεις διαρκείας: χρονικές ειδοποιήσεις (τέλος προτεραιότητας θύρας, άνοιγμα
      # μεταβίβασης, υπενθύμιση προθεσμίας) και κλείσιμο θέσεων μετά την προθεσμία.
      - name: Μεταβιβάσεις
        if: always()
        continue-on-error: true
        run: curl -fsS -X POST "https://paokalendar.vercel.app/api/tx?a=tick" -H "Content-Type: application/json" -d "{}"

      # Όταν ένας αγώνας έχει (σχεδόν) τελειώσει και δεν έχουμε το αποτέλεσμα, ανανεώνουμε το
      # πρόγραμμα κάθε 15 λεπτά αντί για κάθε 2 ώρες, ώσπου να βγει (το πολύ 6 ώρες μετά την έναρξη).
      - name: Ανανέωση αποτελεσμάτων
        if: steps.remind.outputs.refresh == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recent=$(gh run list --workflow update.yml --limit 5 --json status,createdAt \
            --jq "[.[] | select(.status != \"completed\" or (.createdAt | fromdateiso8601) > (now - 600))] | length")
          if [ "$recent" = "0" ]; then
            gh workflow run update.yml --ref main
            echo "Ξεκίνησε ανανέωση για αποτελέσματα."
          else
            echo "Η ανανέωση τρέχει ήδη ή έγινε πριν από λίγο."
          fi

      - name: Έναρξη live
        if: steps.remind.outputs.live == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          running=$(gh run list --workflow live.yml --limit 5 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$running" = "0" ]; then
            gh workflow run live.yml --ref main
            echo "Ξεκίνησε η παρακολούθηση live."
          else
            echo "Η παρακολούθηση live τρέχει ήδη."
          fi
