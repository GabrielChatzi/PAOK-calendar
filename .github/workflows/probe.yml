name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, re
          UA = {"User-Agent": "PAOKalendar/1.0 (https://paokalendar.gr)"}
          def api(host, **q):
              u = f"https://{host}/w/api.php?" + urllib.parse.urlencode({"format": "json", **q})
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30))
          out = open("probe/result.txt", "w")
          for n in [l.strip() for l in open("missing.txt") if l.strip()]:
              name = re.sub(r"\(\d\)|\b\d{4}\b", "", n).strip()
              try:
                  r = api("el.wikipedia.org", action="query", list="search", srsearch=name + " ποδόσφαιρο", srlimit=3)
                  titles = [x["title"] for x in r["query"]["search"]]
                  imgs = []
                  if titles:
                      p = api("el.wikipedia.org", action="query", prop="pageimages", piprop="original", titles="|".join(titles))
                      imgs = [(v["title"], v.get("original", {}).get("source", "")) for v in p["query"]["pages"].values()]
                  out.write(f"{n} :: {imgs}\n")
              except Exception as e:
                  out.write(f"{n} :: ERR {e}\n")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
