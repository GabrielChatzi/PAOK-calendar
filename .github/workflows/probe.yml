name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          g(){ curl -sSL -A "$UA" -m 60 -o "probe/$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> probe/result.txt 2>&1; }
          g arxeio.html "https://www.epsm.gr/arxeio.asp"
          g arxeio2.html "https://www.epsm.gr/arxeio.asp?page=2"
          g search.html "https://www.epsm.gr/search.asp?q=%CE%A0%CF%81%CF%8C%CE%B3%CF%81%CE%B1%CE%BC%CE%BC%CE%B1%20%CE%B1%CE%B3%CF%8E%CE%BD%CF%89%CE%BD%20%CF%85%CF%80%CE%BF%CE%B4%CE%BF%CE%BC%CF%8E%CE%BD"
          g game.html "https://www.epsm.gr/game_ypodomon.asp?game_number=100043"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
