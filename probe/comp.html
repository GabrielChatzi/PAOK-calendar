<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchCenter · Διοργάνωση</title>
<link rel="stylesheet" href="assets/style.css?v=6">
<style>
.calbox{display:grid;grid-template-columns:auto 1fr minmax(260px,360px);gap:18px;align-items:center;margin:28px 0 60px;padding:22px 24px;
  background:linear-gradient(135deg,var(--bg-3),var(--bg-2));border:1px solid var(--edge);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.calbox:empty{display:none}
.cal-ic{width:54px;height:54px;display:grid;place-items:center;background:var(--accent);color:#fff;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.cal-tx h3{margin:0 0 4px;font-size:20px;font-weight:900;font-stretch:72%;letter-spacing:.3px}
.cal-tx p{margin:0;color:var(--muted);font-size:14px}
.cal-ac{display:flex;flex-direction:column;gap:8px}
.cal-ac select{height:40px;padding:0 12px;background:var(--bg);color:var(--text);border:1px solid var(--edge);border-radius:4px;font:inherit;font-weight:700}
.cal-bt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cal-bt a{height:38px;display:grid;place-items:center;border-radius:4px;font-weight:800;font-size:14px;background:var(--bg);border:1px solid var(--line);color:var(--muted);pointer-events:none;opacity:.5;transition:.15s}
.calbox.on .cal-bt a{pointer-events:auto;opacity:1;color:#fff;background:var(--accent);border-color:var(--accent)}
.calbox.on .cal-bt a:hover{background:var(--accent-hi);border-color:var(--accent-hi);color:var(--bg)}
.cal-dl{font-size:13px;color:var(--muted);text-align:center;visibility:hidden}
.calbox.on .cal-dl{visibility:visible}
.cal-dl:hover{color:var(--accent-hi)}
.ldr{margin:34px 0 0}
.ldr:empty{display:none}
.ldr-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ldr-k{display:flex;gap:8px}
.ldr-k button{height:46px;padding:0 22px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font:inherit;font-size:17px;font-weight:900;font-stretch:72%;letter-spacing:.6px;cursor:pointer;border-radius:4px}
.ldr-k button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ldr-k button small{display:block;font-size:10px;font-weight:700;letter-spacing:.4px;opacity:.8;margin-top:-2px}
.ldr-m{display:flex;border:1px solid var(--edge);border-radius:4px;overflow:hidden}
.ldr-m button{height:36px;padding:0 14px;border:0;background:var(--bg-2);color:var(--muted);font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.ldr-m button.on{background:var(--bg-3);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.ldr-l{display:grid;gap:6px}
.ldr-r{display:grid;grid-template-columns:38px 52px 1fr auto;gap:14px;align-items:center;padding:8px 14px;background:var(--bg-2);border:1px solid var(--line);color:inherit;text-decoration:none}
a.ldr-r:hover{background:var(--bg-3)}
.ldr-r.top{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 35%,var(--bg-2)),var(--bg-2) 70%);border-color:var(--accent)}
.ldr-r .rk{font-size:22px;font-weight:900;font-stretch:70%;color:var(--muted);text-align:center}
.ldr-r.top .rk{color:var(--accent-hi)}
.ldr-r .who{min-width:0}
.ldr-r .who b{display:block;font-size:17px;font-weight:900;font-stretch:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr-r .who span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden}
.ldr-r .who span img{width:20px;height:20px;object-fit:contain;flex:none}
.ldr-r .v{text-align:right}
.ldr-r .v b{display:block;font-size:28px;font-weight:900;font-stretch:66%;line-height:1}
.ldr-r .v span{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.4px}
.ldr-n{margin-top:8px;font-size:12px;color:var(--muted)}
@media (max-width:820px){.calbox{grid-template-columns:auto 1fr}.cal-ac{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap">
  <a class="back" href="competitions.html">‹ Όλες οι διοργανώσεις</a>
  <div class="comphead" id="head"></div>
  <div class="grouptabs" id="groups"></div>
  <div id="body"><div class="loading">Φόρτωση αγώνων και βαθμολογίας…</div></div>
  <section class="ldr" id="ldr"></section>
  <section class="calbox" id="cal"></section>
</main>
<footer>Δεδομένα: ΕΟΚ · basket.gr</footer>
<script src="assets/config.js?v=6"></script>
<script src="assets/common.js?v=6"></script>
<script>
header("", "comp");
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const CH = P.get("ch");
let D = null, G = P.get("group") || "", GID = P.get("gid") || "";

const isYouth = n => /ΕΦΗΒ|ΝΕΑΝΙΔ|ΠΑΙΔ|ΚΟΡΑΣΙΔ|ΜΙΝΙ|\bU\s?-?\d{1,2}\b/.test(UP(n));   // no MVP for youth championships
let MD = null;   // index of the matchday on screen
let VIEW = new URLSearchParams(location.search).get("view") || "games";   // games | mvp
const MVPC = {};
let YOUTH = false;

function currentMatchday(mds) {
  const today = new Date().toLocaleDateString("en-CA", tz);
  let i = mds.findIndex(md => md.games.some(x => isLive(x.state) ||
    (!isFinal(x.state) && (x.date ? new Date(x.date).toLocaleDateString("en-CA", tz) : "") >= today)));
  return i < 0 ? mds.length - 1 : i;          // season over → last matchday
}

function render() {
  const groups = D.groups || [];
  if (!groups.length) { $("body").innerHTML = `<div class="empty">Δεν υπάρχουν αγώνες σε αυτή τη διοργάνωση.</div>`; return; }
  if (GID) { const x = groups.find(g => g.id === GID); if (x) G = x.name; GID = ""; }
  if (!groups.some(g => g.name === G)) G = groups[0].name;
  $("groups").innerHTML = groups.length > 6
    ? `<select class="in" id="gsel" style="min-width:280px;max-width:100%">${groups.map(g => `<option ${g.name === G ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select>`
    : groups.length > 1 ? groups.map(g => `<button class="${g.name === G ? "on" : ""}" data-g="${esc(g.name)}">${esc(g.name)}</button>`).join("") : "";
  if (YOUTH) VIEW = "games";
  const g = groups.find(x => x.name === G);
  const mds = g.matchdays.map(md => ({ ...md, first: md.games[0]?.date || "" }));
  if (MD === null || MD >= mds.length) MD = currentMatchday(mds);
  history.replaceState(null, "", `?ch=${encodeURIComponent(CH)}&group=${encodeURIComponent(G)}&md=${MD}&view=${VIEW}`);
  const md = mds[MD];

  $("body").innerHTML = `<div class="two-col">
    <div><h3 class="sec-h">ΒΑΘΜΟΛΟΓΙΑ${g.name ? " · " + esc(UP(g.name)) : ""}</h3>
      ${standingsTable(g.standings, [], g.source === "computed" ? "Υπολογισμένη από τα αποτελέσματα (νίκη 2, ήττα 1)." : "", true)}</div>
    <div>${YOUTH ? "" : `<div class="viewtabs"><button data-view="games" class="${VIEW === "games" ? "on" : ""}">ΑΓΩΝΕΣ</button>
        <button data-view="mvp" class="${VIEW === "mvp" ? "on" : ""}">ΣΚΟΡΕΡ</button></div>`}
      <div class="mdnav">
        <button class="btn" data-step="-1" ${MD <= 0 ? "disabled" : ""} aria-label="Προηγούμενη αγωνιστική">‹</button>
        <select class="in" id="mdsel">${mds.map((x, i) => `<option value="${i}" ${i === MD ? "selected" : ""}>${esc(x.name)}${x.first ? " · " + esc(shortDate(x.first)) : ""}</option>`).join("")}</select>
        <button class="btn" data-step="1" ${MD >= mds.length - 1 ? "disabled" : ""} aria-label="Επόμενη αγωνιστική">›</button>
      </div>
      ${VIEW === "mvp" ? `<div id="mvpbox"><div class="loading">Φόρτωση σκόρερ…</div></div>`
        : `<div class="mdgrid">${md.games.map(x => gameBox(x, isLive(x.state) || isFinal(x.state) ? shortDate(x.date) : `${shortDate(x.date)} · ${hhmm(x.date)}`)).join("")}</div>`}
    </div></div>`;
  if (VIEW === "mvp") loadMvp(G, md.name);
}

async function loadMvp(group, mdName) {
  const key = `${group}|${mdName}`;
  try {
    if (!MVPC[key]) MVPC[key] = (await api("mvps", { ch: CH, group, md: mdName })).mvps || [];
    const box = $("mvpbox");
    if (box && `${G}|${D.groups.find(x => x.name === G).matchdays[MD].name}` === key) box.innerHTML = mvpList(MVPC[key], true);
  } catch (e) { const box = $("mvpbox"); if (box) box.innerHTML = `<div class="empty">Σφάλμα φόρτωσης (${esc(e.message)}).</div>`; }
}

$("groups").onchange = e => { if (e.target.id === "gsel") { G = e.target.value; MD = null; render(); } };
$("groups").onclick = e => { const g = e.target.dataset.g; if (g) { G = g; MD = null; render(); } };
$("body").onclick = e => {
  const s = e.target.dataset.step, v = e.target.dataset.view;
  if (s) { MD += +s; render(); }
  if (v && v !== VIEW) { VIEW = v; render(); }
};
$("body").onchange = e => { if (e.target.id === "mdsel") { MD = +e.target.value; render(); } };

function calBox() {
  const names = new Set();
  (D.groups || []).forEach(g => (g.matchdays || []).forEach(m => (m.games || []).forEach(x => {
    if (x.home && x.home.name) names.add(x.home.name);
    if (x.away && x.away.name) names.add(x.away.name);
  })));
  const list = [...names].sort((a, b) => a.localeCompare(b, "el"));
  if (!list.length) return;
  $("cal").innerHTML = `
    <div class="cal-ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
    <div class="cal-tx"><h3 class="up">Το πρόγραμμα της ομάδας σου στο κινητό</h3>
      <p>Επίλεξε ομάδα και πρόσθεσέ την στο ημερολόγιό σου. Οι αγώνες ενημερώνονται αυτόματα (ώρες, γήπεδα, αποτελέσματα).</p></div>
    <div class="cal-ac">
      <select id="calteam"><option value="">Επίλεξε ομάδα…</option>${list.map(n => `<option>${esc(n)}</option>`).join("")}</select>
      <div class="cal-bt">
        <a id="calg" target="_blank" rel="noopener">Google Calendar</a>
        <a id="calw">iPhone / Outlook</a>
      </div>
      <a id="cald" class="cal-dl">ή κατέβασε αρχείο .ics</a>
    </div>`;
  const upd = () => {
    const t = $("calteam").value, on = !!t;
    $("cal").classList.toggle("on", on);
    if (!on) return;
    const feed = new URL(`bgapi.php?action=ics&ch=${encodeURIComponent(CH)}&team=${encodeURIComponent(t)}`, location.href).href;
    const web = feed.replace(/^https?:/, "webcal:");
    $("calg").href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent(web);
    $("calw").href = web;
    $("cald").href = feed;
  };
  $("calteam").onchange = upd;
}


let LD = null, LK = "pts", LM = "total";
function leadersBox() {
  const box = $("ldr"); if (!LD || LD.minor) { box.innerHTML = ""; return; }
  const L = (LD[LK] || {})[LM] || [], is3 = LK === "p3", avg = LM === "avg";
  const unit = is3 ? (avg ? "ΤΡΙΠ. / ΑΓ." : "ΤΡΙΠΟΝΤΑ") : (avg ? "ΠΟΝ. / ΑΓ." : "ΠΟΝΤΟΙ");
  const row = r => { const u = playerUrl(r.pid), tag = u ? "a" : "div";
    const other = avg ? `${is3 ? r.p3 : r.pts} σύν.` : `${(r[is3 ? "p3" : "pts"] / r.gp).toFixed(1)} μ.ό.`;
    return `<${tag} class="ldr-r ${r.rank === 1 ? "top" : ""}"${u ? ` href="${u}"` : ""}><div class="rk num">${r.rank}</div>${face(r.photo, 52)}
      <div class="who"><b class="up">${esc(r.name)}</b><span>${r.logo ? `<img src="${esc(r.logo)}" alt="">` : ""}${esc(r.team)} · ${r.gp} αγ. · ${other}</span></div>
      <div class="v num"><b>${avg ? r.val.toFixed(1) : r.val}</b><span>${unit}</span></div></${tag}>`; };
  box.innerHTML = `<div class="ldr-h"><div class="ldr-k">
      <button data-lk="p3" class="${is3 ? "on" : ""}">ΜΠΟΜΠΕΡΣ<small>ΠΕΡΙΣΣΟΤΕΡΑ ΤΡΙΠΟΝΤΑ</small></button>
      <button data-lk="pts" class="${!is3 ? "on" : ""}">ΚΑΝΟΝΙΕΡΗΔΕΣ<small>ΠΕΡΙΣΣΟΤΕΡΟΙ ΠΟΝΤΟΙ</small></button></div>
    <div class="ldr-m"><button data-lm="total" class="${!avg ? "on" : ""}">ΣΥΝΟΛΟ</button><button data-lm="avg" class="${avg ? "on" : ""}">ΜΕΣΟΣ ΟΡΟΣ</button></div></div>
    <div class="ldr-l">${L.length ? L.map(row).join("") : `<div class="empty">Δεν υπάρχουν ακόμα στατιστικά.</div>`}</div>
    <div class="ldr-n">Top 10 από ${LD.games} αγώνες${LD.missing ? ` (${LD.missing} χωρίς στατιστικά ακόμα)` : ""}${avg ? ` · μέσος όρος για όσους έπαιξαν τουλάχιστον ${LD.min_games} αγώνες` : ""}.</div>`;
}
$("ldr").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.lk) LK = b.dataset.lk; if (b.dataset.lm) LM = b.dataset.lm; leadersBox(); };
function loadLeaders() { api("leaders", { ch: CH }).then(d => { LD = d; leadersBox(); }).catch(() => {}); }

async function seasonsMenu(c) {
  const key = UP(c.org || "").replace(/[^Α-ΩA-Z0-9]/g, "");
  if (!key) return;
  try {
    const [cur, arc] = await Promise.all([api("channels"), api("channels", { archive: 1 })]);
    const same = x => UP(x.org || "").replace(/[^Α-ΩA-Z0-9]/g, "") === key;
    const L = [...(cur.channels || []).filter(same).map(x => ({ id: x.id, label: "Τρέχουσα σεζόν" })),
               ...(arc.channels || []).filter(same).sort((a, b) => String(b.archive).localeCompare(String(a.archive))).map(x => ({ id: x.id, label: `Σεζόν ${x.archive}` }))];
    if (L.length < 2) return;
    $("head").insertAdjacentHTML("beforeend", `<select class="in seasonsel" id="cseason" style="margin-left:auto;align-self:center;max-width:200px">${L.map(x => `<option value="${esc(x.id)}" ${x.id === CH ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select>`);
    $("cseason").onchange = e => { location.href = `competition.html?ch=${encodeURIComponent(e.target.value)}`; };
  } catch {}
}

if (!CH) location.href = "competitions.html";
api("channel", { ch: CH }).then(d => {
  D = d;
  const c = d.channel || {};
  if (!c.logo) { try { c.logo = JSON.parse(sessionStorage.getItem("mc_logos") || "{}")[CH] || ""; } catch {} }
  YOUTH = isYouth(c.name);
  document.title = `MatchCenter · ${c.name || ""}`;
  $("head").innerHTML = `${c.logo ? `<img src="${esc(c.logo)}" alt="">` : ""}<div><h1 class="up">${esc(c.name || "")}</h1><span>${d.count} αγώνες</span></div>`;
  if (P.get("md") !== null && P.get("group")) MD = +P.get("md");
  if ((d.groups || []).length > 1) $("head").querySelector("span").textContent += ` · ${d.groups.length} φάσεις / όμιλοι`;
  calBox();
  render();
  if (!YOUTH) loadLeaders();
  setTimeout(() => seasonsMenu(c), 1500);
}).catch(e => { $("body").innerHTML = `<div class="empty">Σφάλμα φόρτωσης (${esc(e.message)}).</div>`; });
</script>
</body>
</html>
