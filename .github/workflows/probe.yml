name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: ./probe.sh > probe-log.txt 2>&1 || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p /tmp/p && cp -r docs probe-log.txt /tmp/p/
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan probe-data && git rm -rfq . && cp -r /tmp/p/* .
          git add -A && git commit -qm probe && git push -f origin probe-data
