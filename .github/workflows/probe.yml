name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          U=https://www.paokfc.gr/wp-content/uploads/2026/07/pao.png
          curl -sSL -o probe/w.png -w "weserv %{http_code} %{size_download} %{content_type}\n" "https://wsrv.nl/?url=$U" >> probe/result.txt
          curl -sSL -A "Mozilla/5.0" -o probe/d.png -w "direct %{http_code} %{size_download} %{content_type}\n" "$U" >> probe/result.txt
          curl -sSL https://paokalendar.gr/api/admin | python3 -c "import json,sys; d=json.load(sys.stdin); print([(c['sport'],c['name'],c['url'][:60]) for c in d.get('crests',[])])" >> probe/result.txt
          curl -sSL -o probe/c.bin -w "crest %{http_code} %{content_type}\n" "https://paokalendar.gr/crests/$(curl -sSL https://paokalendar.gr/matches.json | grep -o 'paokalendar.gr/crests/[0-9a-f]*\.[a-z]*' | head -1 | sed 's#.*/##')" >> probe/result.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
