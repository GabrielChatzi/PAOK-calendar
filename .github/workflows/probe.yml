name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          g(){ curl -sSL -A "$UA" -m 60 -o "probe/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> probe/result.txt 2>&1; }
          g koe.html "https://www.koe.org.gr/"
          g koe_gr.html "https://www.koe.gr/"
          g epo56.html "https://www.epo.gr/el/competition/56/matches"
          g epo56p.html "https://www.epo.gr/el/panellinio-protathlima-ypodomon-neanidon-k-17"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
