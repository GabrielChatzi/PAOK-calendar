name: Ενημέρωση ημερολογίων

on:
  schedule:
    # Κάθε 2 ώρες (ώρα UTC), ώστε τα αποτελέσματα να φτάνουν γρήγορα
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_calendars.py, standings.py, notify.py, club.py, manual.json, .github/workflows/update.yml]

permissions:
  contents: write
  issues: write  # issue «Αγώνες προς έλεγχο»
  id-token: write  # ταυτότητα για τις ειδοποιήσεις web push (/api/push)

concurrency:
  group: update-calendars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Δημιουργία ημερολογίων
        id: build
        continue-on-error: true
        env:
          PUSH: "1"
        run: python3 build_calendars.py

      - name: Αποθήκευση αλλαγών
        run: |
          if git diff --quiet -- docs && [ -z "$(git ls-files --others --exclude-standard docs)" ]; then
            echo "Καμία αλλαγή."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Ενημέρωση προγράμματος αγώνων"
          # Αν στο μεταξύ αποθήκευσε κι άλλη εκτέλεση, κρατάμε τα αρχεία αυτής (είναι τα νεότερα).
          git pull --rebase -X theirs --quiet
          git push

      # Διαφορές με τις ανακοινώσεις της ΑΣ ΠΑΟΚ: ένα issue που ενημερώνεται (το GitHub στέλνει email).
      - name: Αγώνες προς έλεγχο
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Αγώνες προς έλεγχο"
          num=$(gh issue list --state open --search "in:title $title" --json number,title \
                --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -s checks.md ]; then
            hash=$(sha1sum checks.md | cut -c1-12)
            printf '%s\n\n<!-- %s -->\n' "$(cat checks.md)" "$hash" > body.md
            if [ -z "$num" ]; then
              gh issue create --title "$title" --body-file body.md
            elif ! gh issue view "$num" --json body --jq .body | grep -q "$hash"; then
              gh issue edit "$num" --body-file body.md
              gh issue comment "$num" --body "Η λίστα άλλαξε. Δες την ενημερωμένη περιγραφή του issue."
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Δεν υπάρχουν πλέον διαφορές. Κλείνει αυτόματα."
          fi

      # Αν κάποια πηγή απέτυχε, το workflow σημειώνεται ως αποτυχημένο,
      # ώστε να έρθει ειδοποίηση από το GitHub.
      - name: Έλεγχος πηγών
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Κάποια πηγή προγράμματος απέτυχε· τα αντίστοιχα ημερολόγια έμειναν ως είχαν."
          exit 1
