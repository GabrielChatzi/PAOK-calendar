name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          python3 - <<'PY'
          import urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          out = open("probe/result.txt", "w")
          for i, d in enumerate(["Κ15 LEAGUE 1", "Κ14 LEAGUE 1", "Κ14 LEAGUE 2", "Κ13 ΕΙΔΙΚΗΣ 1ος ΟΜΙΛΟΣ", "Κ15 ΓΥΝΑΙΚΩΝ", "Κ12 ΚΟΡΑΣΙΔΩΝ"]):
              u = "https://www.epsm.gr/table_ypodomon_analytika.asp?" + urllib.parse.urlencode({"diorganosi": d})
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60).read()
              except Exception as e:
                  b = str(e).encode()
              open(f"probe/an{i}.html", "wb").write(b)
              out.write(f"{i} {d} {len(b)}\n")
          koe = urllib.request.urlopen(urllib.request.Request("https://koe.org.gr/sports/water-polo", headers=UA), timeout=60).read()
          open("probe/koe_wp.html", "wb").write(koe)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
