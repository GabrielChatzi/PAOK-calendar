name: explore
on:
  push:
    branches: [explore-wiki]
    paths: [tools/explore.py]
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/explore.py
        continue-on-error: true
      - run: |
          mkdir -p tools/out && cp /tmp/out/* tools/out/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/out && git commit -qm "explore: αποτελέσματα" && git push
