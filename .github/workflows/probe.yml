name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          for u in matches.json standings.json api/data; do curl -sSL -m 30 -o "probe/$(echo $u | tr / _)" -w "$u %{http_code} %{size_download}\n" "https://paokalendar.gr/$u"; done | tee probe/result.txt
          grep -o 'src="[^"]*"' <(curl -sSL https://paokalendar.gr/) | head -5 > probe/src.txt || true
          curl -sSL https://paokalendar.gr/ -o probe/index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
