name: probe
on:
  push:
    branches: [probe-archive]
    paths: [probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py; cat probe_out/_log.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-out; git rm -rqf --cached .; git add -f probe_out; git commit -qm probe
          git push -f origin HEAD:probe-out
