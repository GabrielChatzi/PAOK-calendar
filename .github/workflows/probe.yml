name: probe academy
on:
  push:
    branches: [probe-academy]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          sleep 30
          curl -sS https://paokalendar.gr/api/admin | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(d), len(d.get('crests',[])))" > probe/result.txt 2>&1
          curl -sS -o /dev/null -w "post %{http_code}\n" -X POST https://paokalendar.gr/api/admin -H 'Content-Type: application/json' -d '{"password":"x","action":"crest-save"}' >> probe/result.txt
          curl -sS https://paokalendar.gr/ | grep -c academyCrestsHtml >> probe/result.txt || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe result" && git push
