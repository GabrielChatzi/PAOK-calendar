<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAOKalendar</title>
<meta name="description" content="Ανεπίσημη σελίδα φιλάθλων με πρόγραμμα, αποτελέσματα, βαθμολογίες και ειδοποιήσεις για όλα τα τμήματα του ΠΑΟΚ.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="PAOKalendar">
<meta name="apple-mobile-web-app-title" content="PAOKalendar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;800&family=Fira+Sans:wght@400;500;600&display=swap&subset=greek" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --surface: #f1f0ed;
    --muted: #66655f;
    --rule: #d9d8d3;
    --display: "Fira Sans Extra Condensed", "Arial Narrow", sans-serif;
    --body: "Fira Sans", system-ui, sans-serif;
    --stripe: repeating-linear-gradient(90deg, var(--ink) 0 14px, var(--paper) 14px 28px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #fff;
      --paper: #000;
      --surface: #161615;
      --muted: #a3a29c;
      --rule: #2c2c2a;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Η ταυτότητα της σελίδας: οι ρίγες της φανέλας. */
  .masthead { background: var(--stripe); padding: 56px 16px 0; }
  .masthead.compact { padding-top: 28px; }
  .masthead-inner { max-width: 680px; margin: 0 auto; }
  .masthead h1 {
    display: inline-block; margin: 0; padding: 10px 16px 6px;
    background: var(--paper);
    font: 800 clamp(44px, 13vw, 76px)/0.9 var(--display);
    letter-spacing: -0.01em;
  }
  .masthead.compact h1 { font-size: clamp(36px, 10vw, 56px); }
  .masthead h1 a { text-decoration: none; }
  .masthead h1 .light { font-weight: 600; color: var(--muted); }
  .masthead { padding-top: calc(56px + env(safe-area-inset-top)); }
  .masthead.compact { padding-top: calc(28px + env(safe-area-inset-top)); }
  main { padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

  /* Εγκατάσταση ως εφαρμογή */
  .moved {
    background: var(--ink); color: var(--paper); padding: 14px 16px; margin: 18px 0 0;
  }
  .moved strong { display: block; font: 800 20px/1.15 var(--display); }
  .moved p { margin: 4px 0 0; font-size: 15px; }
  .moved a { font-weight: 600; text-underline-offset: 3px; }
  .explain { border: 1.5px solid var(--ink); padding: 14px 16px; margin: 6px 0 18px; }
  .explain h4 { margin: 0 0 6px; font: 800 20px/1.15 var(--display); }
  .explain p { margin: 0 0 8px; }
  .explain p:last-child { margin-bottom: 0; }
  .step-title { font: 800 20px/1.15 var(--display); margin: 22px 0 8px; }
  .platform { margin: 0 0 22px; }
  .platform h3 { font: 800 24px/1.1 var(--display); margin: 26px 0 8px; }
  .platform.mine h3::after { content: "  (αυτή η συσκευή)"; font: 500 15px var(--body); color: var(--muted); }
  ul.perks { margin: 0 0 8px; padding-left: 20px; max-width: 58ch; }
  ul.perks li { margin-bottom: 4px; }
  footer a { text-underline-offset: 2px; }
  .install {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
    border: 1.5px solid var(--ink); padding: 12px; margin: 0 0 24px;
  }
  .install img { width: 52px; height: 52px; border-radius: 12px; display: block; }
  .install strong { display: block; font: 800 20px/1.1 var(--display); }
  .install p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .install .btn { padding: 8px 12px; }
  .install-close {
    border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer;
    align-self: start;
  }
  .share-glyph { display: inline-block; vertical-align: -3px; }

  main { max-width: 680px; margin: 0 auto; padding: 0 16px 48px; }
  .lede { margin: 18px 0 28px; color: var(--muted); max-width: 52ch; }
  h2.section-title { font: 800 34px/1 var(--display); margin: 44px 0 14px; }

  /* Σήματα ομάδων */
  .crest {
    width: 22px; height: 22px; object-fit: contain; vertical-align: -4px; margin-right: 6px;
    display: inline-block; flex: none;
  }
  .initials {
    display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px;
    border: 1.5px solid var(--ink); border-radius: 50%;
    font: 600 10px/1 var(--body); vertical-align: -4px; flex: none;
  }
  @media (prefers-color-scheme: dark) {
    img.crest { background: #fff; border-radius: 3px; padding: 1px; }
  }

  /* Επόμενος αγώνας */
  .next { background: var(--ink); color: var(--paper); padding: 20px 20px 22px; margin-bottom: 8px; }
  .next-label { font-size: 15px; opacity: .75; margin: 0 0 8px; }
  .next-teams { font: 800 clamp(30px, 8.5vw, 48px)/1.08 var(--display); margin: 0 0 12px; overflow-wrap: anywhere; }
  .next-teams .crest, .next-teams .initials { width: 34px; height: 34px; vertical-align: -6px; }
  .next-teams .initials { border-color: var(--paper); font-size: 13px; }
  .next-when { font: 600 22px/1.2 var(--display); margin: 0; }
  .next-meta { margin: 6px 0 0; opacity: .8; font-size: 15px; }

  /* Τμήματα */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile {
    display: block; text-decoration: none; border: 1.5px solid var(--ink);
    padding: 12px 12px 14px; position: relative; min-height: 112px;
  }
  .tile:active { background: var(--ink); color: var(--paper); }
  .tile-name { font: 800 20px/1.05 var(--display); display: block; hyphens: auto; }
  .tile-emoji { display: block; font-size: 20px; line-height: 1; margin-bottom: 6px; }
  .tile-next { display: block; font-size: 14px; margin-top: 8px; line-height: 1.35; }
  .tile-pos { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .tile:active .tile-pos { color: inherit; }

  /* Φίλτρα και επιλογές */
  .controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 8px; }
  .controls > * { min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips-hint { margin: -2px 0 0; font-size: 14px; color: var(--muted); }
  .chip {
    flex: none; border: 1.5px solid var(--ink); background: var(--paper);
    padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg { display: flex; border: 1.5px solid var(--ink); width: 100%; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; cursor: pointer; font-weight: 500; }
  .seg button + button { border-left: 1.5px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .legend { margin: 4px 0 0; font-size: 14px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  .legend span::before {
    content: ""; display: inline-block; width: 6px; height: 16px; margin-right: 7px; vertical-align: -3px;
    border: 1.5px solid var(--ink);
  }
  .legend .l-home::before { border: 0; background: repeating-linear-gradient(180deg, var(--ink) 0 4px, transparent 4px 8px); }

  /* Καρτέλες σελίδας τμήματος */
  .back { display: inline-block; margin: 18px 0 6px; font-weight: 500; text-underline-offset: 3px; }
  .section-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
  .section-head h2 { margin: 0; font: 800 clamp(36px, 10vw, 52px)/1 var(--display); }
  .section-head span { font-size: 34px; }
  .tabs {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    border: 1.5px solid var(--ink); margin: 26px 0 14px;
  }
  .tabs a {
    padding: 10px 6px; text-align: center; text-decoration: none; font-weight: 600;
    border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
  }
  .tabs a:nth-child(2n) { border-right: 0; }
  .tabs a:nth-child(n+3) { border-bottom: 0; }
  .tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }
  @media (min-width: 560px) {
    .tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tabs a, .tabs a:nth-child(2n) { border-right: 1.5px solid var(--ink); border-bottom: 0; }
    .tabs a:last-child { border-right: 0; }
  }

  /* Λίστα αγώνων */
  .day {
    position: sticky; top: 0; z-index: 1; background: var(--paper);
    margin: 0; padding: 22px 0 6px; border-bottom: 2px solid var(--ink);
    font: 800 22px/1.1 var(--display);
  }
  .day small { font: 500 15px var(--body); color: var(--muted); margin-left: 8px; }
  ol.games { list-style: none; margin: 0; padding: 0; }
  .game {
    display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: start;
    padding: 12px 0 12px 14px; border-bottom: 1px solid var(--rule); position: relative;
  }
  /* Εντός έδρας: ρίγες στην άκρη. Εκτός: απλό περίγραμμα. */
  .game::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 6px;
    border: 1.5px solid var(--ink);
  }
  .game.home::before { border: 0; background: repeating-linear-gradient(180deg, var(--ink) 0 4px, transparent 4px 8px); }
  .time { font: 800 22px/1.2 var(--display); }
  .time.tbc { color: var(--muted); font-size: 18px; }
  .teams { font: 600 20px/1.25 var(--display); overflow-wrap: anywhere; }
  .teams .team { display: block; }
  .teams b { font-weight: 800; }
  .meta { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .meta a { text-underline-offset: 2px; }
  .score { font: 800 22px/1.25 var(--display); text-align: right; white-space: nowrap; }
  .score span.n { display: block; }
  .res {
    display: inline-block; min-width: 24px; margin-top: 4px; padding: 0 5px;
    font: 600 15px/24px var(--body); text-align: center; border: 1.5px solid var(--ink);
  }
  .res.w { background: var(--ink); color: var(--paper); }
  .empty { padding: 28px 0; color: var(--muted); }
  .more {
    margin: 20px 0 0; width: 100%; border: 1.5px solid var(--ink); background: transparent;
    padding: 12px; font-weight: 600; cursor: pointer;
  }

  /* Μήνας */
  .month { margin-top: 18px; }
  .month-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
  .month-head h3 { margin: 0; text-align: center; font: 800 26px/1.1 var(--display); }
  .month-head button { width: 44px; height: 44px; border: 1.5px solid var(--ink); background: transparent; font: 800 22px/1 var(--display); cursor: pointer; }
  .month-head button:disabled { opacity: .25; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .wd { text-align: center; font-size: 13px; color: var(--muted); padding: 8px 0 4px; }
  .cell {
    min-height: 62px; padding: 4px 3px 5px; border: 0; border-bottom: 1px solid var(--rule);
    background: transparent; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .cell.out { visibility: hidden; cursor: default; }
  .cell .n { font: 600 16px/22px var(--display); width: 24px; text-align: center; }
  .cell.today .n { background: var(--ink); color: var(--paper); }
  .cell.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
  .cell.none { cursor: default; }
  .cell.none .n { color: var(--muted); }
  .mks { display: flex; flex-wrap: wrap; gap: 2px; font-size: 15px; line-height: 1; }
  .mk { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .mk::after { content: ""; width: 14px; height: 4px; border: 1px solid var(--ink); }
  .mk.home::after { border: 0; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px); }
  .plus { font: 600 13px/1 var(--body); color: var(--muted); align-self: center; }

  /* Βαθμολογία */
  .standing { margin: 8px 0 30px; }
  .standing h3 { font: 800 24px/1.1 var(--display); margin: 18px 0 8px; }
  .table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table.st { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.st th { font-weight: 500; color: var(--muted); text-align: right; padding: 6px 6px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
  table.st th:nth-child(2) { text-align: left; }
  table.st td { padding: 8px 6px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.st td.pos { width: 28px; color: var(--muted); }
  table.st td.team { text-align: left; white-space: normal; font-weight: 500; min-width: 140px; }
  table.st td.pts { font-weight: 600; }
  table.st tr.paok td { background: var(--ink); color: var(--paper); font-weight: 600; }
  table.st tr.paok .initials { border-color: var(--paper); }
  .source { font-size: 14px; color: var(--muted); }

  /* Ακολούθησε: ημερολόγια και ειδοποιήσεις */
  .follow h3 { font: 800 26px/1.1 var(--display); margin: 26px 0 8px; }
  .follow p { margin: 0 0 12px; max-width: 58ch; }
  .help { color: var(--muted); font-size: 15px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .btn {
    display: inline-block; border: 1.5px solid var(--ink); padding: 9px 14px; background: transparent;
    text-decoration: none; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn:active { background: var(--ink); color: var(--paper); }
  ul.notify { list-style: none; margin: 14px 0 0; padding: 0; border-top: 2px solid var(--ink); }
  ul.notify li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  ul.notify strong { font: 600 19px/1.2 var(--display); display: block; }
  ul.notify small { color: var(--muted); font-size: 14px; display: block; }
  ul.notify code { font-size: 12px; color: var(--muted); word-break: break-all; }
  ol.steps { margin: 0 0 12px; padding-left: 22px; max-width: 58ch; }
  ol.steps li { margin-bottom: 6px; }

  .cal-list { list-style: none; margin: 14px 0 0; padding: 0; border-top: 2px solid var(--ink); }
  .cal { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .cal-name { font: 600 19px/1.2 var(--display); text-decoration: none; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 10px 16px; font-weight: 500; max-width: calc(100% - 32px); z-index: 5;
  }
  footer { margin-top: 48px; font-size: 14px; color: var(--muted); }
  footer p { margin: 0 0 8px; }

  @media (min-width: 560px) {
    .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .game { grid-template-columns: 70px 1fr auto; }
    .cell { min-height: 78px; padding: 6px; }
    .mks { font-size: 18px; }
  }
</style>
</head>
<body>
<header class="masthead" id="masthead">
  <div class="masthead-inner"><h1><a href="#/" aria-label="PAOKalendar, αρχική">PAOK<span class="light">alendar</span></a></h1></div>
</header>

<main id="app"><p class="empty">Φόρτωση προγράμματος…</p></main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var TZ = "Europe/Athens";
  var PAGE = 40;
  var NTFY_IOS = "https://apps.apple.com/app/ntfy/id1625396347";
  var NTFY_ANDROID = "https://play.google.com/store/apps/details?id=io.heckel.ntfy";
  var KIND_INFO = {
    pre: ["Πριν τον αγώνα", "Περίπου μία ώρα πριν ξεκινήσει"],
    time: ["Αλλαγές προγράμματος", "Νέος αγώνας, ορισμός ή αλλαγή ώρας"],
    result: ["Τελικό αποτέλεσμα", "Το σκορ μόλις ανακοινωθεί"]
  };
  var isAndroid = /android/i.test(navigator.userAgent);
  var data = null, standings = {};

  // Επιλογές που θυμάται η σελίδα (ανά συσκευή).
  var prefs = { view: "list", sports: [], gender: "all", when: "upcoming", venue: "all" };
  try {
    var saved = JSON.parse(localStorage.getItem("paok-filters") || "{}");
    ["view", "gender", "when", "venue"].forEach(function (k) { if (typeof saved[k] === "string") prefs[k] = saved[k]; });
    if (Array.isArray(saved.sports)) {
      prefs.sports = saved.sports.filter(function (x) { return typeof x === "string"; });
    } else if (typeof saved.sport === "string" && saved.sport !== "all") {
      prefs.sports = [saved.sport];  // παλιά αποθήκευση με ένα άθλημα
    }
  } catch (e) {}
  function savePrefs() { try { localStorage.setItem("paok-filters", JSON.stringify(prefs)); } catch (e) {} }

  // Κατάσταση που δεν αποθηκεύεται.
  var ui = { shown: PAGE, month: null, day: null, secView: "list", secVenue: "all" };

  var fmtDay = new Intl.DateTimeFormat("el-GR", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
  var fmtShort = new Intl.DateTimeFormat("el-GR", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
  var fmtTime = new Intl.DateTimeFormat("el-GR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  var fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  var fmtMonth = new Intl.DateTimeFormat("el-GR", { month: "long", year: "numeric", timeZone: "UTC" });
  var WEEKDAYS = ["Δευ", "Τρι", "Τετ", "Πεμ", "Παρ", "Σαβ", "Κυρ"];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function $(id) { return document.getElementById(id); }

  function dayDiff(date) {
    var a = new Date(fmtKey.format(new Date()) + "T00:00:00");
    var b = new Date(fmtKey.format(date) + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function relative(date) {
    var d = dayDiff(date);
    if (d === 0) return "Σήμερα";
    if (d === 1) return "Αύριο";
    if (d > 1 && d < 7) return "Σε " + d + " μέρες";
    return "";
  }
  // Ένας αγώνας είναι «επόμενος» μέχρι 2 ώρες μετά την έναρξη, αν δεν έχει σκορ.
  function isUpcoming(m) { return !m.score && new Date(m.start).getTime() > Date.now() - 2 * 3600 * 1000; }
  function outcome(m) {
    var p = /^(\d+)-(\d+)$/.exec(m.score || "");
    if (!p) return "";
    var mine = +p[m.paokHome ? 1 : 2], theirs = +p[m.paokHome ? 2 : 1];
    return mine > theirs ? "w" : mine < theirs ? "l" : "d";
  }
  var OUTCOME_LABEL = { w: "Ν", d: "Ι", l: "Η" };
  var OUTCOME_TITLE = { w: "Νίκη", d: "Ισοπαλία", l: "Ήττα" };

  function sectionOf(m) { return data.sectionMap[m.section] || { name: m.section, emoji: "" }; }

  // ---- Σήματα
  var paokLogo = {};
  function initials(name) {
    var words = String(name).replace(/[."«»]/g, " ").split(/\s+/).filter(function (w) { return w.length > 1; });
    return (words.length > 1 ? words[0][0] + words[1][0] : (words[0] || "?").slice(0, 2)).toUpperCase();
  }
  function crest(url, name, section) {
    if (!url && name === "ΠΑΟΚ") url = paokLogo[section] || paokLogo._any;
    var fallback = '<span class="initials" aria-hidden="true">' + esc(initials(name)) + "</span>";
    if (!url) return fallback;
    return '<img class="crest" src="' + esc(url) + '" alt="" loading="lazy" referrerpolicy="no-referrer" ' +
      'onerror="this.outerHTML=this.dataset.f" data-f="' + esc(fallback) + '">';
  }
  function teamHtml(name, logo, section) {
    return crest(logo, name, section) + (name === "ΠΑΟΚ" ? "<b>ΠΑΟΚ</b>" : esc(name));
  }

  // ---- Λίστα αγώνων
  function gameHtml(m, showSection) {
    var date = new Date(m.start), s = sectionOf(m), o = outcome(m);
    var meta = [showSection ? s.emoji + " " + s.name : "", m.competition, m.round].filter(Boolean).map(esc).join(", ");
    if (m.venue) meta += "<br>" + esc(m.venue);
    if (m.tv) meta += ", " + esc(m.tv);
    var parts = /^(\d+)-(\d+)$/.exec(m.score || "");
    return '<li class="game ' + (m.paokHome ? "home" : "away") + '">' +
      '<div class="time' + (m.timeKnown ? "" : " tbc") + '">' + (m.timeKnown ? fmtTime.format(date) : "TBC") + "</div>" +
      "<div>" +
        '<div class="teams"><span class="team">' + teamHtml(m.home, m.homeLogo, m.section) + '</span>' +
          '<span class="team">' + teamHtml(m.away, m.awayLogo, m.section) + "</span></div>" +
        '<div class="meta">' + meta +
          (m.url ? ' <a href="' + esc(m.url) + '" rel="noopener" target="_blank">Πηγή</a>' : "") + "</div>" +
      "</div>" +
      '<div class="score">' + (parts
        ? '<span class="n">' + parts[1] + '</span><span class="n">' + parts[2] + "</span>" +
          (o ? '<span class="res ' + o + '" title="' + OUTCOME_TITLE[o] + '">' + OUTCOME_LABEL[o] + "</span>" : "")
        : "") + "</div>" +
    "</li>";
  }

  function listHtml(list, mode, showSection) {
    if (mode === "results") list = list.slice().reverse();
    if (!list.length) {
      return '<p class="empty">' + (mode === "upcoming"
        ? "Δεν υπάρχουν προγραμματισμένοι αγώνες για αυτή την επιλογή. Δες τα αποτελέσματα ή άλλαξε φίλτρα."
        : "Δεν υπάρχουν αποτελέσματα για αυτή την επιλογή ακόμα.") + "</p>";
    }
    var out = [], lastKey = null;
    list.slice(0, ui.shown).forEach(function (m) {
      var date = new Date(m.start), key = fmtKey.format(date);
      if (key !== lastKey) {
        if (lastKey) out.push("</ol>");
        var rel = relative(date);
        out.push('<h3 class="day">' + esc(cap(fmtDay.format(date))) +
          (rel && rel.indexOf("Σε ") !== 0 ? "<small>" + rel + "</small>" : "") + '</h3><ol class="games">');
        lastKey = key;
      }
      out.push(gameHtml(m, showSection));
    });
    out.push("</ol>");
    if (list.length > ui.shown) out.push('<button type="button" class="more" data-act="more">Περισσότεροι αγώνες</button>');
    return out.join("");
  }

  // ---- Μήνας
  function monthKey(key) { return key.slice(0, 7); }
  function addMonths(mk, n) {
    var y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + "-" + pad(m + 1);
  }
  function monthHtml(list, showSection) {
    var todayKey = fmtKey.format(new Date());
    var byDay = {};
    list.forEach(function (m) {
      var k = fmtKey.format(new Date(m.start));
      (byDay[k] = byDay[k] || []).push(m);
    });
    var allKeys = data.matches.map(function (m) { return fmtKey.format(new Date(m.start)); }).sort();
    var first = monthKey(allKeys[0] || todayKey), last = monthKey(allKeys[allKeys.length - 1] || todayKey);
    if (!ui.month) ui.month = monthKey(todayKey) < first ? first : monthKey(todayKey) > last ? last : monthKey(todayKey);
    var mk = ui.month, y = +mk.slice(0, 4), mo = +mk.slice(5, 7);
    if (!ui.day || monthKey(ui.day) !== mk || !byDay[ui.day]) {
      var days = Object.keys(byDay).filter(function (k) { return monthKey(k) === mk; }).sort();
      var future = days.filter(function (k) { return k >= todayKey; });
      ui.day = byDay[todayKey] && monthKey(todayKey) === mk ? todayKey : (future[0] || days[0] || null);
    }
    var title = cap(fmtMonth.format(new Date(Date.UTC(y, mo - 1, 1))));
    var cells = WEEKDAYS.map(function (w) { return '<div class="wd" aria-hidden="true">' + w + "</div>"; });
    var lead = (new Date(Date.UTC(y, mo - 1, 1)).getUTCDay() + 6) % 7;
    var count = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    for (var i = 0; i < lead; i++) cells.push('<div class="cell out"></div>');
    for (var d = 1; d <= count; d++) {
      var key = y + "-" + pad(mo) + "-" + pad(d), dayList = byDay[key] || [];
      var cls = "cell" + (key === todayKey ? " today" : "") + (key === ui.day ? " sel" : "") + (dayList.length ? "" : " none");
      var marks = dayList.slice(0, 3).map(function (m) {
        return '<span class="mk ' + (m.paokHome ? "home" : "away") + '">' + sectionOf(m).emoji + "</span>";
      }).join("") + (dayList.length > 3 ? '<span class="plus">+' + (dayList.length - 3) + "</span>" : "");
      var label = d + " " + title + ", " + (dayList.length ? dayList.length + (dayList.length === 1 ? " αγώνας" : " αγώνες") : "χωρίς αγώνες");
      cells.push('<button type="button" class="' + cls + '" data-day="' + key + '"' + (dayList.length ? "" : " disabled") +
        ' aria-label="' + esc(label) + '"' + (key === ui.day ? ' aria-pressed="true"' : "") + ">" +
        '<span class="n">' + d + '</span><span class="mks">' + marks + "</span></button>");
    }
    var sel = ui.day && byDay[ui.day], below;
    if (!sel) {
      below = '<p class="empty">Κανένας αγώνας αυτόν τον μήνα για αυτή την επιλογή. Πήγαινε σε άλλο μήνα ή άλλαξε φίλτρα.</p>';
    } else {
      var dd = new Date(sel[0].start), rel = relative(dd);
      below = '<h3 class="day">' + esc(cap(fmtDay.format(dd))) + (rel && rel.indexOf("Σε ") !== 0 ? "<small>" + rel + "</small>" : "") +
        '</h3><ol class="games">' + sel.map(function (m) { return gameHtml(m, showSection); }).join("") + "</ol>";
    }
    return '<section class="month" aria-label="Προβολή μήνα"><div class="month-head">' +
      '<button type="button" data-act="prev-month" aria-label="Προηγούμενος μήνας"' + (mk <= first ? " disabled" : "") + ">‹</button>" +
      "<h3>" + esc(title) + "</h3>" +
      '<button type="button" data-act="next-month" aria-label="Επόμενος μήνας"' + (mk >= last ? " disabled" : "") + ">›</button>" +
      '</div><div class="grid">' + cells.join("") + "</div>" + below + "</section>";
  }

  // ---- Επόμενος αγώνας
  function nextHtml(list, label) {
    var up = list.filter(isUpcoming);
    if (!up.length) return "";
    var m = up[0], s = sectionOf(m), date = new Date(m.start), rel = relative(date);
    return '<section class="next" aria-label="Επόμενος αγώνας">' +
      '<p class="next-label">' + esc(label || ("Επόμενος αγώνας, " + s.emoji + " " + s.name)) + "</p>" +
      '<p class="next-teams">' + teamHtml(m.home, m.homeLogo, m.section) + "<br>" + teamHtml(m.away, m.awayLogo, m.section) + "</p>" +
      '<p class="next-when">' + esc((rel ? rel + ", " : "") + fmtShort.format(date) + (m.timeKnown ? ", " + fmtTime.format(date) : ", ώρα TBC")) + "</p>" +
      '<p class="next-meta">' + esc([m.competition, m.venue].filter(Boolean).join(", ")) + "</p></section>";
  }

  function seg(id, options, current) {
    return '<div class="seg" data-seg="' + id + '" role="group">' + options.map(function (o) {
      return '<button type="button" data-v="' + o[0] + '" aria-pressed="' + (o[0] === current) + '">' + o[1] + "</button>";
    }).join("") + "</div>";
  }
  var LEGEND = '<p class="legend"><span class="l-home">Εντός έδρας</span><span class="l-away">Εκτός έδρας</span></p>';

  // ---- Βαθμολογία
  function paokPosition(key) {
    var tables = standings[key] || [];
    for (var i = 0; i < tables.length; i++) {
      for (var j = 0; j < tables[i].rows.length; j++) {
        var r = tables[i].rows[j];
        if (r.paok) return { pos: r.pos, title: tables[i].title, pts: r.cells[r.cells.length - 1], played: r.cells[0] };
      }
    }
    return null;
  }
  function standingsHtml(key) {
    var tables = standings[key] || [];
    if (!tables.length) return '<p class="empty">Δεν υπάρχει βαθμολογία για αυτό το τμήμα ακόμα.</p>';
    return tables.map(function (t) {
      var head = "<tr><th>#</th><th>Ομάδα</th>" + t.columns.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr>";
      var rows = t.rows.map(function (r) {
        return '<tr class="' + (r.paok ? "paok" : "") + '"><td class="pos">' + esc(r.pos) + '</td><td class="team">' +
          teamHtml(r.team, r.logo, key) + "</td>" +
          r.cells.map(function (c, i) { return '<td class="' + (i === r.cells.length - 1 ? "pts" : "") + '">' + esc(c) + "</td>"; }).join("") + "</tr>";
      }).join("");
      return '<div class="standing"><h3>' + esc(t.title) + '</h3><div class="table-wrap"><table class="st">' +
        "<thead>" + head + "</thead><tbody>" + rows + "</tbody></table></div>" +
        '<p class="source"><a href="' + esc(t.url) + '" rel="noopener" target="_blank">Πηγή βαθμολογίας</a></p></div>';
    }).join("");
  }

  // ---- Ημερολόγια και ειδοποιήσεις
  function calBase() { return location.host + location.pathname.replace(/[^/]*$/, ""); }
  function calButtons(key) {
    var base = calBase();
    return [["home", "Εντός"], ["away", "Εκτός"]].map(function (p) {
      var file = key + "-" + p[0] + ".ics";
      return isAndroid
        ? '<button type="button" class="btn" data-copy="https://' + esc(base + file) + '" data-msg="Ο σύνδεσμος αντιγράφηκε. Επικόλλησέ τον στο Google Calendar.">' + p[1] + "</button>"
        : '<a class="btn" href="webcal://' + esc(base + file) + '">' + p[1] + "</a>";
    }).join("");
  }
  function topicOf(key, kind) { return data.ntfy.prefix + "-" + key + "-" + kind; }

  function followHtml(key) {
    var s = data.sectionMap[key];
    var host = data.ntfy.server.replace(/^https?:\/\//, "");
    var rows = data.ntfy.kinds.map(function (kind) {
      var topic = topicOf(key, kind), info = KIND_INFO[kind];
      var display = "ΠΑΟΚ " + s.name + ": " + info[0];
      var btn = isAndroid
        ? '<a class="btn solid" href="ntfy://' + host + "/" + topic + "?display=" + encodeURIComponent(display) + '">Ενεργοποίηση</a>'
        : '<button type="button" class="btn solid" data-copy="' + esc(topic) + '" data-msg="Αντιγράφηκε. Στο ntfy πάτα + και επικόλλησέ το.">Αντιγραφή</button>';
      return "<li><span><strong>" + info[0] + "</strong><small>" + info[1] + "</small><code>" + esc(topic) + "</code></span>" + btn + "</li>";
    }).join("");
    var store = isAndroid
      ? '<a class="btn solid" href="' + NTFY_ANDROID + '" rel="noopener" target="_blank">Κατέβασε το ntfy από το Google Play</a>'
      : isIOS
        ? '<a class="btn solid" href="' + NTFY_IOS + '" rel="noopener" target="_blank">Κατέβασε το ntfy από το App Store</a>'
        : '<a class="btn" href="' + NTFY_IOS + '" rel="noopener" target="_blank">ntfy για iPhone</a>' +
          '<a class="btn" href="' + NTFY_ANDROID + '" rel="noopener" target="_blank">ntfy για Android</a>';
    var pick = isAndroid
      ? "<p>Πάτα «Ενεργοποίηση» σε όσα θέλεις. Το ntfy ανοίγει και σε ρωτά αν θέλεις να εγγραφείς· πάτα «Subscribe».</p>"
      : "<p>Πάτα «Αντιγραφή» σε αυτό που θέλεις. Μετά άνοιξε το ntfy, πάτα το +, επικόλλησε το όνομα και πάτα «Subscribe». Κάνε το ίδιο για κάθε επιλογή που θέλεις.</p>";
    return '<div class="follow"><h3>Ειδοποιήσεις στο κινητό</h3>' +
      '<div class="explain"><h4>Τι είναι το ntfy;</h4>' +
        "<p>Μια δωρεάν εφαρμογή που απλώς εμφανίζει ειδοποιήσεις στο κινητό σου. Δεν θέλει λογαριασμό, email ή κωδικό και δεν έχει διαφημίσεις.</p>" +
        "<p>Τη χρησιμοποιούμε γιατί μια ιστοσελίδα δεν μπορεί από μόνη της να στείλει ειδοποιήσεις σε όλα τα κινητά. Θα λαμβάνεις μόνο ό,τι διαλέξεις εδώ.</p></div>" +
      '<p class="step-title">1. Κατέβασε το ntfy</p>' +
      '<div class="actions">' + store + "</div>" +
      (isIOS ? '<p class="help">Όταν το ανοίξεις πρώτη φορά, πάτα «Allow» για να επιτρέψεις τις ειδοποιήσεις.</p>' : "") +
      '<p class="step-title">2. Διάλεξε τι θέλεις να μαθαίνεις</p>' + pick +
      '<ul class="notify">' + rows + "</ul>" +
      '<p class="help" style="margin-top:12px">Για να σταματήσεις, σβήσε τη συνδρομή μέσα στο ntfy. Τίποτα άλλο δεν χρειάζεται.</p>' +
      "<h3>Ημερολόγιο</h3><p>Οι αγώνες στο ημερολόγιο του κινητού, χωριστά εντός και εκτός έδρας. Ενημερώνονται μόνοι τους.</p>" +
      '<p class="help">' + (isAndroid
        ? "Πάτα για να αντιγράψεις τον σύνδεσμο, μετά στο calendar.google.com: + δίπλα στο «Άλλα ημερολόγια», «Από διεύθυνση URL»."
        : "Πάτα «Εντός» ή «Εκτός» και μετά «Συνδρομή».") + "</p>" +
      '<div class="actions">' + calButtons(key) + "</div></div>";
  }

  // ---- Αρχική
  function passesHome(m) {
    var s = sectionOf(m);
    if (prefs.sports.length && prefs.sports.indexOf(s.sport) < 0) return false;
    if (prefs.gender === "men" && s.women) return false;
    if (prefs.gender === "women" && !s.women) return false;
    if (prefs.venue === "home" && !m.paokHome) return false;
    if (prefs.venue === "away" && m.paokHome) return false;
    return true;
  }

  function tilesHtml() {
    return '<div class="tiles">' + data.sections.map(function (s) {
      var up = data.matches.filter(function (m) { return m.section === s.key && isUpcoming(m); })[0];
      var next = up
        ? esc(fmtShort.format(new Date(up.start))) + ", " + (up.paokHome ? "με " + esc(up.away) + " (εντός)" : "με " + esc(up.home) + " (εκτός)")
        : "Χωρίς προγραμματισμένους αγώνες";
      var pos = paokPosition(s.key);
      return '<a class="tile" href="#/' + s.key + '"><span class="tile-emoji" aria-hidden="true">' + s.emoji + "</span>" +
        '<span class="tile-name">' + esc(s.name) + '</span><span class="tile-next">' + next + "</span>" +
        (pos ? '<span class="tile-pos">' + pos.pos + "η θέση, " + esc(pos.title) + "</span>" : "") + "</a>";
    }).join("") + "</div>";
  }

  function homeHtml() {
    var sports = [], emojiFor = {};
    data.sections.forEach(function (s) { if (sports.indexOf(s.sport) < 0) sports.push(s.sport); emojiFor[s.sport] = s.emoji; });
    var chips = '<div class="chips" data-sports role="group" aria-label="Αθλήματα, μπορείς να διαλέξεις πολλά">' +
      [["all", "Όλα τα αθλήματα"]].concat(sports.map(function (sp) { return [sp, emojiFor[sp] + " " + sp]; })).map(function (o) {
        var on = o[0] === "all" ? !prefs.sports.length : prefs.sports.indexOf(o[0]) >= 0;
        return '<button type="button" class="chip" data-sport="' + esc(o[0]) + '" aria-pressed="' + on + '">' + esc(o[1]) + "</button>";
      }).join("") + "</div>" + '<p class="chips-hint">Διάλεξε ένα ή περισσότερα αθλήματα.</p>';
    var list = data.matches.filter(passesHome);
    var body = prefs.view === "month"
      ? monthHtml(list, true)
      : listHtml(list.filter(function (m) { return prefs.when === "upcoming" ? isUpcoming(m) : !isUpcoming(m); }), prefs.when, true);
    return '<p class="lede">Ανεπίσημη σελίδα φιλάθλων με πρόγραμμα, αποτελέσματα και βαθμολογίες όλων των τμημάτων του ΠΑΟΚ. Ενημερώνεται μόνη της κάθε δύο ώρες.</p>' +
      installHtml() +
      nextHtml(data.matches) +
      '<h2 class="section-title">Τμήματα</h2>' + tilesHtml() +
      '<h2 class="section-title">Όλοι οι αγώνες</h2>' +
      '<div class="controls">' + seg("view", [["list", "Λίστα"], ["month", "Μήνας"]], prefs.view) + chips +
        seg("gender", [["all", "Όλα"], ["men", "Ανδρών"], ["women", "Γυναικών"]], prefs.gender) +
        (prefs.view === "month" ? "" : seg("when", [["upcoming", "Επόμενοι"], ["results", "Αποτελέσματα"]], prefs.when)) +
        seg("venue", [["all", "Όλοι"], ["home", "Εντός"], ["away", "Εκτός"]], prefs.venue) + LEGEND + "</div>" +
      body +
      '<h2 class="section-title">Ειδοποιήσεις και ημερολόγια</h2>' +
      '<p>Μπες σε ένα τμήμα και πάτα «Ακολούθησε» για να διαλέξεις ειδοποιήσεις (πριν τον αγώνα, αλλαγές ώρας, αποτελέσματα) ή να προσθέσεις τους αγώνες στο ημερολόγιό σου. Οι ειδοποιήσεις έρχονται μέσω της δωρεάν εφαρμογής ntfy, χωρίς λογαριασμό· εκεί θα βρεις οδηγίες βήμα βήμα.</p>' +
      '<ul class="cal-list">' + data.sections.map(function (s) {
        return '<li class="cal"><a class="cal-name" href="#/' + s.key + '/follow">' + s.emoji + " " + esc(s.name) + "</a>" + calButtons(s.key) + "</li>";
      }).join("") + "</ul>" + footerHtml();
  }

  // ---- Σελίδα τμήματος
  var TABS = [["", "Πρόγραμμα"], ["results", "Αποτελέσματα"], ["standings", "Βαθμολογία"], ["follow", "Ακολούθησε"]];
  function sectionHtml(key, tab) {
    var s = data.sectionMap[key];
    var all = data.matches.filter(function (m) { return m.section === key; });
    var pos = paokPosition(key);
    var tabs = '<nav class="tabs" aria-label="' + esc(s.name) + '">' + TABS.map(function (t) {
      return '<a href="#/' + key + (t[0] ? "/" + t[0] : "") + '"' + (t[0] === tab ? ' aria-current="page"' : "") + ">" + t[1] + "</a>";
    }).join("") + "</nav>";
    var body;
    if (tab === "standings") {
      body = standingsHtml(key);
    } else if (tab === "follow") {
      body = followHtml(key);
    } else {
      var venueFiltered = all.filter(function (m) {
        return ui.secVenue === "all" || (ui.secVenue === "home") === m.paokHome;
      });
      var controls = '<div class="controls">' + (tab === "results" ? "" : seg("secView", [["list", "Λίστα"], ["month", "Μήνας"]], ui.secView)) +
        seg("secVenue", [["all", "Όλοι"], ["home", "Εντός"], ["away", "Εκτός"]], ui.secVenue) + LEGEND + "</div>";
      if (tab === "results") {
        body = controls + listHtml(venueFiltered.filter(function (m) { return !isUpcoming(m); }), "results", false);
      } else if (ui.secView === "month") {
        body = controls + monthHtml(venueFiltered, false);
      } else {
        body = controls + listHtml(venueFiltered.filter(isUpcoming), "upcoming", false);
      }
    }
    return '<a class="back" href="#/">‹ Όλα τα τμήματα</a>' +
      '<div class="section-head"><span aria-hidden="true">' + s.emoji + "</span><h2>" + esc(s.name) + "</h2></div>" +
      (pos ? '<p class="lede" style="margin:0 0 16px">' + pos.pos + "η θέση στο " + esc(pos.title) + ", " + esc(pos.pts) + " βαθμοί σε " + esc(pos.played) + " αγώνες.</p>" : "") +
      nextHtml(all, "Επόμενος αγώνας") + tabs + body + footerHtml();
  }

  function footerHtml() {
    var times = Object.keys(data.updated || {}).map(function (k) { return data.updated[k]; }).sort();
    var last = times.length ? new Date(times[times.length - 1]) : null;
    return "<footer><p>Το PAOKalendar είναι ανεπίσημη σελίδα φιλάθλων και δεν συνδέεται με τον ΠΑΟΚ ή τις εταιρείες του.</p>" + (last ? "<p>Τελευταία αλλαγή στο πρόγραμμα: " + esc(fmtShort.format(last) + ", " + fmtTime.format(last)) + ".</p>" : "") +
      "<p>Αγώνες χωρίς ορισμένη ώρα εμφανίζονται ως «TBC» και στα ημερολόγια μπαίνουν στις 18:00.</p>" +
      "<p>Πηγές: ESPN, ΕΠΟ, esake.gr, Euroleague, basket.gr, volleyleague.gr, ΕΟΠΕ, ΟΧΕ, Water Polo League. Τα σήματα ανήκουν στις ομάδες.</p>" +
      '<p><a href="#/app">Το PAOKalendar ως εφαρμογή στο κινητό</a></p></footer>';
  }

  // ---- Νέα διεύθυνση: η παλιά σελίδα στο GitHub Pages δείχνει πού μετακόμισε.
  // Τα ημερολόγια στην παλιά διεύθυνση συνεχίζουν να ενημερώνονται κανονικά.
  var NEW_HOME = "https://paokalendar.vercel.app/";
  function movedHtml() {
    if (!/github\.io$/.test(location.hostname)) return "";
    var target = NEW_HOME + location.hash;
    return '<div class="moved" role="note"><strong>Το PAOKalendar μετακόμισε</strong>' +
      '<p>Νέα διεύθυνση: <a href="' + esc(target) + '">paokalendar.vercel.app</a>. ' +
      "Οι συνδρομές σε ημερολόγια που έκανες από εδώ συνεχίζουν να δουλεύουν.</p></div>";
  }

  // ---- Εγκατάσταση ως εφαρμογή
  var installEvent = null;
  var isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  // Το × κρύβει το μήνυμα για 14 μέρες· οι οδηγίες μένουν πάντα στο #/app.
  var INSTALL_SNOOZE = 14 * 24 * 3600 * 1000;
  var installDismissed = false;
  try {
    var until = +localStorage.getItem("paok-install-snooze-until") || 0;
    installDismissed = until > Date.now();
  } catch (e) {}

  var SHARE_ICON = '<svg class="share-glyph" width="16" height="18" viewBox="0 0 16 18" aria-hidden="true">' +
    '<path d="M8 1v10M4.5 4.5 8 1l3.5 3.5M3 8H1.5v8.5h13V8H13" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

  function installHtml() {
    if (isStandalone || installDismissed) return "";
    var text, action = "";
    if (installEvent) {
      text = "Βάλ' το στην αρχική οθόνη. Ανοίγει σε πλήρη οθόνη και δουλεύει και χωρίς σύνδεση.";
      action = '<button type="button" class="btn solid" data-act="install">Εγκατάσταση</button>';
    } else if (isIOS) {
      text = "Στο Safari πάτα " + SHARE_ICON + " και μετά «Προσθήκη στην οθόνη Αφετηρίας».";
    } else if (isAndroid) {
      text = "Στο Chrome πάτα ⋮ πάνω δεξιά και μετά «Εγκατάσταση εφαρμογής» ή «Προσθήκη στην αρχική οθόνη».";
    } else {
      return "";
    }
    return '<div class="install" role="region" aria-label="Εγκατάσταση εφαρμογής">' +
      '<img src="icons/apple-touch-icon.png" alt="">' +
      "<div><strong>PAOKalendar στο κινητό</strong><p>" + text + ' <a href="#/app">Οδηγίες</a></p>' +
      (action ? '<div style="margin-top:8px">' + action + "</div>" : "") + "</div>" +
      '<button type="button" class="install-close" data-act="install-close" aria-label="Κλείσιμο για τώρα">×</button></div>';
  }

  // ---- Σελίδα με οδηγίες για την εφαρμογή
  function appHtml() {
    var installBtn = installEvent ? '<div class="actions"><button type="button" class="btn solid" data-act="install">Εγκατάσταση τώρα</button></div>' : "";
    var platforms = [
      { id: "ios", mine: isIOS, title: "iPhone", body:
        '<ol class="steps"><li>Άνοιξε το <strong>paokalendar.vercel.app</strong> στο Safari.</li>' +
        "<li>Πάτα το κουμπί Κοινοποίησης " + SHARE_ICON + " κάτω στη μέση της οθόνης.</li>" +
        "<li>Κύλησε λίγο και πάτα «Προσθήκη στην οθόνη Αφετηρίας».</li>" +
        "<li>Πάτα «Προσθήκη» πάνω δεξιά. Το εικονίδιο με τις ρίγες εμφανίζεται στην αρχική οθόνη.</li></ol>" },
      { id: "android", mine: isAndroid, title: "Android", body:
        (isAndroid ? installBtn : "") +
        '<ol class="steps"><li>Άνοιξε το <strong>paokalendar.vercel.app</strong> στο Chrome.</li>' +
        "<li>Πάτα ⋮ πάνω δεξιά.</li>" +
        "<li>Πάτα «Εγκατάσταση εφαρμογής» ή «Προσθήκη στην αρχική οθόνη» και μετά «Εγκατάσταση».</li></ol>" },
      { id: "desktop", mine: !isIOS && !isAndroid, title: "Υπολογιστής", body:
        (!isIOS && !isAndroid ? installBtn : "") +
        "<p>Στο Chrome ή στο Edge, πάτα το εικονίδιο εγκατάστασης στη δεξιά άκρη της γραμμής διευθύνσεων.</p>" }
    ];
    platforms.sort(function (a, b) { return (b.mine ? 1 : 0) - (a.mine ? 1 : 0); });
    return '<a class="back" href="#/">‹ Αρχική</a>' +
      '<div class="section-head"><h2>Η εφαρμογή στο κινητό</h2></div>' +
      (isStandalone
        ? '<div class="explain"><p>Το PAOKalendar είναι ήδη εγκατεστημένο σε αυτή τη συσκευή.</p></div>'
        : "") +
      "<p>Το PAOKalendar μπαίνει στην αρχική οθόνη σαν κανονική εφαρμογή, χωρίς App Store ή Google Play:</p>" +
      '<ul class="perks"><li>Εικονίδιο με τις ρίγες στην αρχική οθόνη.</li>' +
      "<li>Ανοίγει σε πλήρη οθόνη, χωρίς τη γραμμή του browser.</li>" +
      "<li>Δουλεύει και χωρίς σύνδεση, με το πρόγραμμα από την τελευταία φορά.</li>" +
      "<li>Πιάνει ελάχιστο χώρο και ενημερώνεται μόνο του.</li></ul>" +
      platforms.map(function (p) {
        return '<section class="platform' + (p.mine ? " mine" : "") + '"><h3>' + p.title + "</h3>" + p.body + "</section>";
      }).join("") +
      '<p class="help">Για τις ειδοποιήσεις αγώνων δες την καρτέλα «Ακολούθησε» σε κάθε τμήμα.</p>' +
      footerHtml();
  }

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    installEvent = e;
    if (data && !route().key) render();  // αρχική ή σελίδα οδηγιών
  });
  window.addEventListener("appinstalled", function () {
    installEvent = null;
    isStandalone = true;
    if (data) render();
    toast("Το PAOKalendar μπήκε στην αρχική οθόνη.");
  });

  // ---- Δρομολόγηση
  function route() {
    var parts = location.hash.replace(/^#\/?/, "").split("/");
    var key = parts[0], tab = parts[1] || "";
    if (key === "app") return { key: null, tab: "", page: "app" };
    return data.sectionMap[key] ? { key: key, tab: tab } : { key: null, tab: "" };
  }
  var lastRoute = null;
  function render() {
    var r = route(), sig = (r.page || r.key) + "/" + r.tab;
    if (sig !== lastRoute) {
      if (lastRoute !== null) window.scrollTo(0, 0);
      if (r.key !== (lastRoute || "").split("/")[0]) { ui.month = null; ui.day = null; ui.shown = PAGE; ui.secVenue = "all"; }
      lastRoute = sig;
    }
    $("masthead").classList.toggle("compact", !!(r.key || r.page));
    document.title = r.page === "app" ? "Εφαρμογή – PAOKalendar"
      : r.key ? data.sectionMap[r.key].name + " – PAOKalendar" : "PAOKalendar";
    $("app").innerHTML = movedHtml() +
      (r.page === "app" ? appHtml() : r.key ? sectionHtml(r.key, r.tab) : homeHtml());
  }

  // ---- Ενέργειες
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3500);
  }
  function copy(text, msg) {
    function fallback() { prompt("Αντίγραψε:", text); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(msg); }, fallback);
    } else { fallback(); }
  }

  $("app").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.sport) {
      var sp = b.dataset.sport;
      if (sp === "all") {
        prefs.sports = [];
      } else {
        var i = prefs.sports.indexOf(sp);
        if (i >= 0) prefs.sports.splice(i, 1); else prefs.sports.push(sp);
        // Όλα επιλεγμένα είναι το ίδιο με «Όλα τα αθλήματα».
        var total = {};
        data.sections.forEach(function (s) { total[s.sport] = 1; });
        if (prefs.sports.length >= Object.keys(total).length) prefs.sports = [];
      }
      savePrefs();
      ui.shown = PAGE; ui.day = null;
      render();
      return;
    }
    var group = b.closest("[data-seg]");
    if (group && b.dataset.v) {
      var k = group.dataset.seg;
      if (k === "secView" || k === "secVenue") { ui[k] = b.dataset.v; }
      else { prefs[k] = b.dataset.v; savePrefs(); }
      ui.shown = PAGE; ui.day = null;
      render();
      return;
    }
    if (b.dataset.copy) { copy(b.dataset.copy, b.dataset.msg); return; }
    if (b.dataset.day && !b.disabled) { ui.day = b.dataset.day; render(); return; }
    var act = b.dataset.act;
    if (act === "install" && installEvent) {
      installEvent.prompt();
      installEvent.userChoice.then(function () { installEvent = null; render(); });
      return;
    }
    if (act === "install-close") {
      installDismissed = true;
      try { localStorage.setItem("paok-install-snooze-until", String(Date.now() + INSTALL_SNOOZE)); } catch (e) {}
      render();
      toast("Οι οδηγίες υπάρχουν πάντα στο κάτω μέρος της σελίδας.");
      return;
    }
    if (act === "more") { ui.shown += PAGE; render(); }
    if (act === "prev-month") { ui.month = addMonths(ui.month, -1); ui.day = null; render(); }
    if (act === "next-month") { ui.month = addMonths(ui.month, 1); ui.day = null; render(); }
  });
  window.addEventListener("hashchange", render);

  var loadedAt = 0;
  function load() {
    return Promise.all([
      fetch("matches.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch("standings.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
    ]).then(apply);
  }
  function apply(res) {
    data = res[0]; standings = res[1] || {};
    data.ntfy = data.ntfy || { server: "https://ntfy.sh", prefix: "paokcal-x7q3", kinds: ["pre", "time", "result"] };
    data.sectionMap = {};
    data.sections.forEach(function (s) { data.sectionMap[s.key] = s; });
    data.matches.forEach(function (m) {
      var logo = m.paokHome ? m.homeLogo : m.awayLogo;
      if (logo && !paokLogo[m.section]) paokLogo[m.section] = logo;
      if (logo && !paokLogo._any) paokLogo._any = logo;
    });
    loadedAt = Date.now();
    render();
  }

  load().catch(function () {
    $("app").innerHTML = '<p class="empty">Το πρόγραμμα δεν φόρτωσε. Έλεγξε τη σύνδεσή σου και ανανέωσε τη σελίδα.</p>';
  });

  // Όταν η εφαρμογή ξαναέρχεται στο προσκήνιο, φέρνει νέα δεδομένα αν έχουν περάσει 10 λεπτά.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && data && Date.now() - loadedAt > 10 * 60 * 1000) {
      var y = window.scrollY;
      load().then(function () { window.scrollTo(0, y); }).catch(function () {});
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
