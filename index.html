    if (!teams.home && !teams.away) return null;
    var cols = ESPN_PLAYER.filter(function (c) { return seen[c[0]]; });
    return { title: "Συνθέσεις", cols: cols, home: teams.home, away: teams.away,
             legend: seen.totalGoals ? "Γ γκολ · Ασ ασίστ · Σ σουτ · Ε στην εστία · Φ φάουλ · Απ αποκρούσεις. Με έντονα η αρχική ενδεκάδα." : "Με έντονα η αρχική ενδεκάδα." };
  }
  function fetchDetail(m) {
    var L = m.live || {};
    if (L.src === "espn") {
      return fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/" + encodeURIComponent(L.league) +
        "/summary?event=" + encodeURIComponent(L.id), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        var st = espnState(d);
        var comp = d.header.competitions[0];
        var homeId = (comp.competitors.filter(function (c) { return c.homeAway === "home"; })[0] || {}).team;
        homeId = homeId ? String(homeId.id) : "";
        var events = (d.keyEvents || []).map(function (e) {
          var t = ((e.type || {}).type || "").toLowerCase();
          var kind = e.scoringPlay ? "goal" : t.indexOf("red") >= 0 ? "red" : t.indexOf("yellow") >= 0 ? "yellow" : "";
          if (!kind) return null;
          var who = (e.participants || [])[0];
          return {
            kind: kind, clock: (e.clock || {}).displayValue || "", home: String((e.team || {}).id) === homeId,
            player: who && who.athlete ? who.athlete.displayName : (e.shortText || ""),
            note: t.indexOf("penalty") >= 0 ? "(πέναλτι)" : t.indexOf("own") >= 0 ? "(αυτογκόλ)" : ""
          };
        }).filter(Boolean);
        var teams = ((d.boxscore || {}).teams) || [];
        var byId = {};
        teams.forEach(function (t) {
          var map = {};
          (t.statistics || []).forEach(function (x) { map[x.name] = x.displayValue; });
          byId[String(t.team.id)] = map;
        });
        var awayId = Object.keys(byId).filter(function (k) { return k !== homeId; })[0];
        var stats = ESPN_STATS.filter(function (x) {
          return byId[homeId] && byId[awayId] && byId[homeId][x[0]] != null && byId[awayId][x[0]] != null;
        }).map(function (x) { return { label: x[1], home: byId[homeId][x[0]], away: byId[awayId][x[0]] }; });
        var box = st.state === "pre" ? null : espnBox(d, homeId);
        if (st.state === "pre") stats = [];
        return { state: st, events: events, stats: stats, box: box };
      });
    }
    if (L.src === "euroleague") {
      return fetch("https://live.euroleague.net/api/Header?gamecode=" + encodeURIComponent(L.code) +
        "&seasoncode=" + encodeURIComponent(L.season), { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) { return t.trim() ? JSON.parse(t) : {}; })  // κενό πριν από το τζάμπολ
        .then(function (h) {
        var st = euroleagueState(h);
        // Πάντα οι 4 περίοδοι· όσες δεν έχουν παιχτεί μένουν κενές. Η πηγή δίνει αθροιστικά σκορ
        // και στα διαλείμματα (περίοδος 0) έχει ήδη γεμίσει την επόμενη με το ίδιο σκορ.
        var quarters = [], prevA = 0, prevB = 0, cur = st.quarter || 0;
        for (var q = 1; q <= 4; q++) {
          var ca = +h["ScoreQuarter" + q + "A"] || 0, cb = +h["ScoreQuarter" + q + "B"] || 0;
          var dA = Math.max(0, ca - prevA), dB = Math.max(0, cb - prevB);
          var played = st.state === "post" || (cur ? q <= cur : st.state === "in" && (dA > 0 || dB > 0));
          quarters.push({ label: q + "η", home: played ? dA : "", away: played ? dB : "" });
          if (played) { prevA = Math.max(prevA, ca); prevB = Math.max(prevB, cb); }
        }
        var ota = +h.ScoreExtraTimeA || 0, otb = +h.ScoreExtraTimeB || 0;
        if (ota || otb) quarters.push({ label: "Παρ.", home: ota > prevA ? ota - prevA : ota, away: otb > prevB ? otb - prevB : otb });
        if (st.state === "pre") quarters = [];
        var det = {
          state: st, quarters: quarters, home: st.home, away: st.away,
          timeouts: [h.TimeoutsA || 0, h.TimeoutsB || 0]
        };
        if (st.state === "pre") return det;
        // Ομαδικά φάουλ της περιόδου: το Header δίνει μόνο σύνολα (FoultsA/B), γι' αυτό μετράμε από το play-by-play
        // τα φάουλ παικτών (CM, CMT…, CMU, CMD, OF· όχι του προπονητή) της τρέχουσας περιόδου. Στην παράταση
        // μετρούν μαζί με της 4ης, όπως στους κανονισμούς της FIBA.
        if (st.state === "in") {
          var prevDet = detail[m.uid];  // ως να έρθει το νέο play-by-play, τα φάουλ της προηγούμενης ανάγνωσης
          if (prevDet && prevDet.foulsPeriod) { det.fouls = prevDet.fouls; det.foulsPeriod = prevDet.foulsPeriod; }
          fetch("https://live.euroleague.net/api/PlayByPlay?gamecode=" + encodeURIComponent(L.code) +
            "&seasoncode=" + encodeURIComponent(L.season), { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (p) {
              var q = st.quarter || +p.ActualQuarter || 0;
              if (!q) return;
              var keys = ["FirstQuarter", "SecondQuarter", "ThirdQuarter", "ForthQuarter"];
              var plays = q <= 4 ? p[keys[q - 1]] || [] : (p.ForthQuarter || []).concat(p.ExtraTime || []);
              var a = String(p.CodeTeamA || h.CodeTeamA || "").trim(), f = [0, 0];
              plays.forEach(function (x) {
                if (!/^(CM|OF)/.test(String(x.PLAYTYPE || "").trim())) return;
                f[String(x.CODETEAM || "").trim() === a ? 0 : 1]++;
              });
              det.fouls = f; det.foulsPeriod = q;
              if (detail[m.uid] === det) { var y = window.scrollY; render(); window.scrollTo(0, y); }
            }).catch(function () {});
        }
        // Το boxscore (Stats: πρώτα η ομάδα A, όπως το ScoreA = γηπεδούχος). Αν αποτύχει, μένουν το σκορ και οι περίοδοι.
        return fetch("https://live.euroleague.net/api/Boxscore?gamecode=" + encodeURIComponent(L.code) +
          "&seasoncode=" + encodeURIComponent(L.season), { cache: "no-store" })
          .then(function (r) { return r.text(); })
          .then(function (t) {
            var b = t.trim() ? JSON.parse(t) : {}, s = b.Stats || [];
            var bb = basketBox(elTeam(s[0]), elTeam(s[1]), true);
            det.stats = bb.stats; det.box = bb.box;
            return det;
          }, function () { return det; })
          .catch(function () { return det; });
      });
    }
    if (API_LIVE.indexOf(L.src) >= 0) return waterpoloDetail(m);
    return Promise.reject(new Error("χωρίς live"));
  }
  var detailTimer = null;
  function pollDetail(m) {
    clearTimeout(detailTimer);
    if (!m || !m.live) return;
    var r = route();
    if (r.page !== "match" || r.nt !== m.nt) return;
    var active = liveCandidate(m) || (liveState[m.uid] && liveState[m.uid].state === "in");
    // Για αγώνες που τελείωσαν φέρνουμε τα στοιχεία μία φορά· για ζωντανούς κάθε 30''.
    if (!active && detail[m.uid]) return;
    if (!active && !m.score && new Date(m.start).getTime() > Date.now()) return;  // μελλοντικός
    if (document.visibilityState === "visible") {
      fetchDetail(m).then(function (det) {
        detail[m.uid] = det;
        var prev = liveState[m.uid];
        if (det.state && det.state.state === "post") det.state.postAt = prev && prev.state === "post" && prev.postAt || Date.now();
        liveState[m.uid] = det.state;
        var y = window.scrollY;
        render();
        window.scrollTo(0, y);
      }).catch(function () {});
    }
    if (active) detailTimer = setTimeout(function () { pollDetail(m); }, LIVE_POLL);
  }

  // ---- Live σκορ (ποδόσφαιρο μέσω ESPN, EuroCup μέσω Euroleague)
  var liveState = {};
  var LIVE_POLL = 30 * 1000;
  function liveCandidate(m) {
    if (!m.live || !m.timeKnown || m.score) return false;
    var t = new Date(m.start).getTime(), now = Date.now();
    var ls = liveState[m.uid];
    // Μετά το «Τελικό» συνεχίζουμε για 10 λεπτά: οι πηγές δείχνουν καμιά φορά για λίγο τέλος σε
    // διάλειμμα, και έτσι η σελίδα διορθώνεται μόνη της αντί να μείνει σε λάθος τελικό.
    if (ls && ls.state === "post" && ls.postAt && now - ls.postAt > 10 * 60 * 1000) return false;
    return now >= t - 10 * 60 * 1000 && now <= t + 3.5 * 3600 * 1000;
  }
  function espnState(d) {
    var c = d.competitions ? d.competitions[0] : d.header.competitions[0];
    var t = c.status.type, sc = {};
    c.competitors.forEach(function (x) { sc[x.homeAway] = +(x.score && x.score.value != null ? x.score.value : x.score) || 0; });
    // Αναβολή/διακοπή: η ESPN τα δείχνει ως «post», αλλά δεν είναι τελικό.
    var off = /POSTPONED|CANCELED|ABANDONED|SUSPENDED|FORFEIT/.test(t.name || "");
    var label = off ? (t.description || t.shortDetail || "Αναβλήθηκε") : t.state === "post" ? "Τελικό" : t.name === "STATUS_HALFTIME" ? "Ημίχρονο" : (t.shortDetail || t.detail || "");
    return { state: off ? "pre" : t.state, home: sc.home || 0, away: sc.away || 0, label: label };
  }
  function euroleagueState(h) {
    var a = parseInt(h.ScoreA, 10) || 0, b = parseInt(h.ScoreB, 10) || 0, q = parseInt(h.Quarter, 10) || 0;
    var state = h.Live ? "in" : (a || b) ? "post" : "pre";
    var clock = String(h.RemainingPartialTime || "").trim();
    var label = state === "post" ? "Τελικό" : q ? (q <= 4 ? q + "η περ." : "Παράτ.") + (clock ? " " + clock : "") : state === "in" ? "Διάλειμμα" : "Ξεκινά";
    return { state: state, home: a, away: b, label: label, quarter: q };
  }
  function fetchLive(m) {
    var L = m.live || {};
    if (L.src === "espn") {
      var base = "https://site.api.espn.com/apis/site/v2/sports/soccer/" + encodeURIComponent(L.league);
      return fetch(base + "/scoreboard", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        var ev = (d.events || []).filter(function (e) { return String(e.id) === String(L.id); })[0];
        if (ev) return espnState(ev);
        return fetch(base + "/summary?event=" + encodeURIComponent(L.id), { cache: "no-store" })
          .then(function (r) { return r.json(); }).then(espnState);
      });
    }
    if (L.src === "euroleague") {
      return fetch("https://live.euroleague.net/api/Header?gamecode=" + encodeURIComponent(L.code) +
        "&seasoncode=" + encodeURIComponent(L.season), { cache: "no-store" })
        .then(function (r) { return r.text(); })
        .then(function (t) { return euroleagueState(t.trim() ? JSON.parse(t) : {}); });  // κενό πριν από το τζάμπολ
    }
    if (API_LIVE.indexOf(L.src) >= 0) return waterpoloFetch(m).then(function (j) { return waterpoloState(j, L.src); });
    return Promise.reject(new Error("χωρίς live"));
  }

  // ---- Live μέσω του api/live.js: πόλο (ΚΟΕ, European Aquatics), βόλεϊ (Data Project), μπάσκετ
  // (Genius Sports, ΕΟΚ), χάντμπολ (EHF)
  var API_LIVE = ["koe", "ea", "dp", "gs", "ehf", "eok"];
  function waterpoloFetch(m, box) {
    var L = m.live, q = box ? ["box=1"] : [];
    ["src", "code", "cat", "gara", "tur", "gru", "a", "b", "fed", "id", "day", "side", "key", "comp"].forEach(function (k) {
      if (L[k] != null) q.push(k + "=" + encodeURIComponent(L[k]));
    });
    return fetch("/api/live?" + q.join("&")).then(function (r) {
      if (!r.ok) throw new Error("live " + r.status);
      return r.json();
    });
  }
  function waterpoloState(j, src) {
    if (j.off) return { state: "pre", home: 0, away: 0, quarter: 0, label: j.off };
    if (src === "ehf") {
      return { state: j.state, home: j.home || 0, away: j.away || 0, quarter: j.quarter || 0,
               label: j.state === "post" ? "Τελικό" : j.state === "pre" ? "Ξεκινά" : (j.quarter || 1) + "ο ημίχρονο" };
    }
    if (src === "dp") {
      return { state: j.state, home: j.home || 0, away: j.away || 0, quarter: j.quarter || 0,
               label: j.state === "post" ? "Τελικό" + (j.note ? " (" + j.note + ")" : "") : j.state === "pre" ? "Ξεκινά"
                 : (j.quarter === 6 ? "Χρυσό σετ" : j.quarter + "ο σετ") + (j.clock ? " " + j.clock.replace("-", "–") : "") };
    }
    var label = j.state === "post" ? "Τελικό" : j.state === "pre" ? "Ξεκινά"
      : j.quarter ? (j.quarter <= 4 ? j.quarter + "η περ." : src === "gs" ? "Παράτ." : "Πέναλτι") + (j.clock ? " " + j.clock : "")
      : j.done ? "Διάλειμμα" : "Σε εξέλιξη";
    return { state: j.state, home: j.home || 0, away: j.away || 0, label: label, quarter: j.quarter || 0 };
  }
  function waterpoloDetail(m) {
    return waterpoloFetch(m, true).then(function (j) {
      var dt = j.detail || {};  // στατιστικά ομάδας και παικτών (πόλο ΚΟΕ, βόλεϊ, χάντμπολ EHF)
      if (m.live.src === "dp") {
        var vs = waterpoloState(j, "dp"), done = j.done || 0, sets = [];
        // Πάντα 5 σετ, όπως στα σκορ του βόλεϊ· όσα δεν έχουν παιχτεί μένουν κενά, ο νικητής κάθε σετ με έντονα.
        for (var i = 0; i < 5; i++) {
          var x = (j.quarters || [])[i], played = x && (i < done || (vs.state === "in" && i === done));
          sets.push({ label: String(i + 1), home: played ? x.home : "", away: played ? x.away : "",
                      win: x && i < done ? (x.home > x.away ? "home" : "away") : "" });
        }
        if (j.golden) sets.push({ label: "ΧΣ", home: j.golden.home, away: j.golden.away,
                                  win: vs.state === "post" ? (j.golden.home > j.golden.away ? "home" : "away") : "" });
        var cur = vs.state === "in" ? (vs.quarter === 6 ? j.golden : (j.quarters || [])[done]) : null;
        return { state: vs, home: vs.home, away: vs.away, periodTitle: "Πόντοι ανά σετ", totalLabel: "Σετ",
                 quarters: vs.state === "pre" ? [] : sets, current: cur, stats: dt.stats || [], box: dt.box || null, currentLabel: vs.quarter === 6 ? "Χρυσό σετ" : vs.quarter + "ο σετ",
                 sourceNote: "Live από την Data Project (επίσημο σύστημα της ΕΟΠΕ)." };
      }
      var st = waterpoloState(j, m.live.src), quarters = [];
      if (j.quarters && j.quarters.length) {
        // Πάντα οι 4 περίοδοι· όσες δεν έχουν παιχτεί μένουν κενές. Μετά την 4η, τα πέναλτι.
        var halves = m.live.src === "ehf", n = halves ? 2 : 4;  // χάντμπολ: δύο ημίχρονα
        for (var i = 0; i < Math.max(n, j.quarters.length); i++) {
          var x = j.quarters[i];
          quarters.push({ label: i < n ? i + 1 + (halves ? "ο" : "η") : m.live.src === "gs" ? "Παρ." : "Πέν.", home: x ? x.home : "", away: x ? x.away : "" });
        }
      }
      var bb = m.live.src === "gs" && j.box ? basketBox(j.box.home, j.box.away, false) : { stats: dt.stats || [], box: dt.box || null };
      return { state: st, quarters: st.state === "pre" ? [] : quarters, home: st.home, away: st.away,
               stats: st.state === "pre" ? [] : bb.stats, box: st.state === "pre" ? null : bb.box,
               fouls: st.state === "in" && j.fouls ? j.fouls : null, foulsPeriod: j.quarter || 0,
               periodTitle: m.live.src === "ehf" ? "Σκορ ανά ημίχρονο" : undefined,
               sourceNote: "Live από " + ({ koe: "την ΚΟΕ (live.koe.org.gr)", gs: "τη Genius Sports (επίσημα στατιστικά της Basket League)",
                 eok: "το livescore της ΕΟΚ (basket.gr)", ehf: "την EHF (eurohandball.com)" }[m.live.src] || "την European Aquatics") + "." };
    });
  }

  // Παλιά εφεδρική πηγή (Sofascore, αφαιρέθηκε): σβήνουμε ό,τι είχε κρατήσει η συσκευή.
  try { localStorage.removeItem("paok-sofa-teams"); } catch (e) {}
  var liveTimer = null;
  function pollLive() {
    if (!data || document.visibilityState !== "visible") return;
    var list = data.matches.filter(liveCandidate);
    if (!list.length) return;
    Promise.all(list.map(function (m) {
      return fetchLive(m).then(function (st) { return [m.uid, st]; }, function () { return null; });
    })).then(function (res) {
      var changed = false;
      res.forEach(function (r) {
        if (!r) return;
        var old = liveState[r[0]];
        if (!old || old.state !== r[1].state || old.home !== r[1].home || old.away !== r[1].away || old.label !== r[1].label) changed = true;
        if (r[1].state === "post") r[1].postAt = old && old.state === "post" && old.postAt || Date.now();
        liveState[r[0]] = r[1];
      });
      if (changed) render();
    });
  }
  function startLive() {
    pollLive();
    if (!liveTimer) liveTimer = setInterval(pollLive, LIVE_POLL);
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") pollLive(); });

  var loadedAt = 0;
  function load() {
    return Promise.all([
      fetch("matches.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch("standings.json", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
      loadAdmin()
    ]).then(apply);
  }
  // Καταχωρίσεις του διαχειριστή (api/admin.js): το σκορ τους φαίνεται αμέσως, πριν από την ενημέρωση.
  function loadAdmin() {
    if (!pushOrigin) return Promise.resolve([]);
    return fetch("/api/admin", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (d) { return d.entries || []; }).catch(function () { return []; });
  }
  var adminEntries = {};
  function applyAdmin(entries) {
    entries.forEach(function (e) { adminEntries[e.nt] = e; });
    data.matches.forEach(function (m) {
      var e = adminEntries[m.nt];
      if (!e) return;
      if (e.final) {
        m.score = e.home + "-" + e.away;
        if (e.note) m.note = e.note;
      } else if (!m.score && (!liveState[m.uid] || liveState[m.uid].admin || liveState[m.uid].state === "pre")) {
        liveState[m.uid] = { state: "in", home: e.home, away: e.away, label: e.label || e.note || "Σε εξέλιξη", admin: true };
      }
    });
  }
  function apply(res) {
    data = res[0]; standings = res[1] || {};
    data.sectionMap = {};
    data.sections.forEach(function (s) { data.sectionMap[s.key] = s; });
    data.matches.forEach(function (m) {
      var logo = m.paokHome ? m.homeLogo : m.awayLogo;
      if (logo && !paokLogo[m.section]) paokLogo[m.section] = logo;
      if (logo && !paokLogo._any) paokLogo._any = logo;
    });
    applyAdmin(res[2] || []);
    loadedAt = Date.now();
    if (push.ready && push.sub && cleanMatchTopics()) syncPush().catch(function () {});
    render();
    startLive();
  }

  load().catch(function () {
    $("app").innerHTML = '<p class="empty">Το πρόγραμμα δεν φόρτωσε. Έλεγξε τη σύνδεσή σου και ανανέωσε τη σελίδα.</p>';
  });

  // Όσο ένας αγώνας χωρίς live παίζεται ή περιμένουμε το τελικό του, η σελίδα ξαναδιαβάζει το
  // πρόγραμμα κάθε 2 λεπτά, ώστε το αποτέλεσμα να φαίνεται μόλις το βρει η ενημέρωση.
  setInterval(function () {
    if (!data || document.visibilityState !== "visible" || Date.now() - loadedAt < 2 * 60 * 1000) return;
    if (!data.matches.some(function (m) { return phase(m); })) return;
    var y = window.scrollY;
    load().then(function () { window.scrollTo(0, y); }).catch(function () {});
  }, 30 * 1000);

  // Όταν η εφαρμογή ξαναέρχεται στο προσκήνιο, φέρνει νέα δεδομένα αν έχουν περάσει 10 λεπτά.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && data && Date.now() - loadedAt > 10 * 60 * 1000) {
      var y = window.scrollY;
      load().then(function () { window.scrollTo(0, y); }).catch(function () {});
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
    initPush();
  }
})();
</script>
</body>
